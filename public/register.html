<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>注册 · 估值钟摆</title>
<link rel="stylesheet" href="/shared/styles.css">
<style>.auth{max-width:380px;margin:72px auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px}
.auth h2{font-size:18px;margin:0 0 6px}.auth p.hint{font-size:12px;color:var(--ink-soft);margin:0 0 16px}
.auth input{width:100%;font-size:14px;padding:10px;border:1px solid #dfe3ea;border-radius:8px;margin-bottom:12px}
.auth .err{color:var(--red);font-size:12px;margin-bottom:10px;min-height:16px}.auth .alt{font-size:12.5px;color:var(--ink-soft);margin-top:14px;text-align:center}</style>
</head><body><div class="page"><div class="auth">
<h2 data-i18n="a_reg_title">注册</h2><p class="hint" data-i18n="a_reg_hint">需要一枚激活码（向站长索取）。</p><div class="err" id="err"></div>
<input id="u" data-i18n-ph="a_reg_username_ph" placeholder="用户名（3-20 位字母/数字/_-）" autocomplete="username">
<input id="p" type="password" data-i18n-ph="a_reg_password_ph" placeholder="密码（至少 6 位）" autocomplete="new-password">
<input id="c" data-i18n-ph="a_reg_code_ph" placeholder="激活码 XXXX-XXXX-XXXX">
<button class="btn primary" id="go" style="width:100%" data-i18n="a_reg_btn">注册并进入</button>
<div class="alt"><span data-i18n="a_has_account">已有账号？</span><a href="/login" data-i18n="a_login_link">去登录</a> · <a href="#" id="langSw"></a></div>
</div></div>
<script type="module">
import { t, applyI18n, toggleLang, langButtonLabel } from "/shared/i18n.js";
applyI18n();
const sw=document.getElementById("langSw"); sw.textContent=langButtonLabel();
sw.addEventListener("click",(e)=>{e.preventDefault();toggleLang();});
const err=document.getElementById("err");
async function reg(){ err.textContent="";
  const go=document.getElementById("go"); go.disabled=true;
  try{
    const r=await fetch("/api/register",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:document.getElementById("u").value.trim(),password:document.getElementById("p").value,code:document.getElementById("c").value.trim()})});
    if(r.ok){ const b=await r.json().catch(()=>({})); location.href=b.board&&b.board.slug?"/b/"+b.board.slug:"/app"; return; }
    err.textContent=(await r.json().catch(()=>({}))).error||t("a_reg_fail");
  }catch{ err.textContent=t("a_net_err"); }
  finally{ go.disabled=false; }
}
document.getElementById("go").addEventListener("click",reg);
document.getElementById("c").addEventListener("keydown",(e)=>{if(e.key==="Enter")reg();});
</script></body></html>
