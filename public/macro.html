<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宏观看板 · ValuePort</title>
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* ===== 宏观看板（MVP）：只量水位与引力，不预测天气；最后落到你自己的击球区。设计见 docs/macro-design.md ===== */
  .page{display:flex;flex-direction:column}
  .mc-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:0 4px 22px}
  .mc-hero h1{font-size:clamp(36px,5vw,56px);margin:0}
  /* 一句话判定拆成几颗短胶囊：每个市场的区间与分位 + 自选里的机会数 */
  .mc-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
  .mc-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;border-radius:var(--r-pill);background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--card-edge);font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .mc-chip i{width:8px;height:8px;border-radius:50%;flex:none}
  .mc-chip b{font-weight:500;color:var(--ink)}
  .mc-meta{font-size:13px;color:var(--ink-mute);margin-top:8px}
  .mc-badge{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;border-radius:var(--r-pill);font-size:13px;white-space:nowrap;background:var(--track);color:var(--ink-soft)}
  .mc-badge.go{background:var(--sun);color:var(--sun-ink)}
  .mc-grid{display:flex;flex-direction:column;gap:16px}
  .mc-card{background:var(--card);border:1px solid var(--card-edge);border-radius:var(--r-xl);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:22px 24px}
  .mc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .mc-title{font-size:20px;font-weight:500;letter-spacing:-.01em}
  .mc-sub{font-size:12.5px;color:var(--ink-mute);margin-top:3px}
  /* 市场水位：三列 */
  .mc-markets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .mc-mkt{display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;border-radius:var(--r-lg);background:rgba(29,29,27,.035)}
  .mc-mkt-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .mc-mkt-name{font-size:16px;font-weight:500}
  .mc-mkt-zone{font-size:12.5px;padding:2px 10px;border-radius:var(--r-pill);color:#fff}
  .mc-gauge{width:100%;max-width:280px;margin:0 auto}
  .mc-gauge svg{display:block;width:100%}
  .mc-inds{display:flex;flex-direction:column;gap:9px}
  .mc-ind{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
  .mc-ind-k{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;min-width:0}
  .mc-ind-k i{color:var(--ink-mute);font-size:13px;cursor:help}
  .mc-ind-v{font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
  .mc-pbar{grid-column:1 / -1;position:relative;display:flex;gap:2px;height:6px;margin-top:3px}
  .mc-pbar span{border-radius:var(--r-pill);opacity:.22}
  .mc-pbar span.on{opacity:1}
  .mc-pbar b{position:absolute;top:-3px;width:3px;height:12px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
  .mc-ind-note{grid-column:1 / -1;font-size:11.5px;color:var(--ink-mute)}
  .mc-pending{flex:1;display:flex;align-items:center;justify-content:center;min-height:220px;padding:20px;border-radius:var(--r-md);text-align:center;
    background-color:rgba(255,255,255,.4);background-image:var(--hatch);font-size:13px;line-height:1.7;color:var(--ink-soft)}
  /* 引力 */
  .mc-ctl{display:flex;gap:8px;flex-wrap:wrap}
  .mc-seg{display:flex;gap:2px;padding:3px;background:var(--track);border-radius:var(--r-pill)}
  .mc-seg button{height:28px;padding:0 12px;border:0;border-radius:var(--r-pill);background:none;cursor:pointer;font-family:var(--font);font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .mc-seg button.on{background:#fff;color:var(--ink)}
  .mc-gsay{font-size:14px;line-height:1.7;color:var(--ink-soft);margin:-4px 0 12px}
  .mc-gsay b{color:var(--ink);font-weight:500}
  .mc-chart{position:relative;height:240px;padding-left:44px}
  .mc-chart svg{position:absolute;left:44px;right:0;top:0;bottom:22px;width:calc(100% - 44px);height:calc(100% - 22px)}
  .mc-grid-line{position:absolute;left:0;right:0;border-top:1px dashed rgba(29,29,27,.09)}
  .mc-grid-line span{position:absolute;left:0;top:-7px;width:38px;text-align:right;font-size:10.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .mc-axis{position:absolute;left:44px;right:0;bottom:0;height:18px;font-size:11px;color:var(--ink-mute)}
  .mc-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .mc-ey{fill:none;stroke:var(--chart-2);stroke-width:2.4;stroke-linejoin:round}
  .mc-y10{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
  .mc-real{fill:none;stroke:var(--ink-mute);stroke-width:1.5;stroke-dasharray:4 3}
  .mc-gap{fill:rgba(246,207,74,.28);stroke:none}
  .mc-hline{position:absolute;top:0;bottom:22px;width:1px;background:var(--ink);opacity:.25;pointer-events:none}
  .mc-hline[hidden],.mc-tip[hidden]{display:none}
  .mc-tip{position:absolute;top:6px;z-index:2;min-width:190px;padding:9px 12px;border-radius:var(--r-md);background:var(--dark);color:#f3f0e8;font-size:12px;line-height:1.7;pointer-events:none;font-variant-numeric:tabular-nums}
  .mc-tip-d{color:#bdb7aa;font-size:11px;margin-bottom:2px}
  .mc-tip-r{display:flex;align-items:center;gap:6px}
  .mc-tip-r i{width:8px;height:8px;border-radius:2px;flex:none}
  .mc-tip-r b{margin-left:auto;font-weight:500;color:#fff}
  .mc-tip-gap{margin-top:3px;padding-top:4px;border-top:1px solid rgba(255,255,255,.12);color:var(--sun)}
  .mc-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-mute)}
  .mc-legend i{display:inline-block;width:16px;height:0;border-top:2.2px solid;vertical-align:middle;margin-right:5px}
  /* 你的击球区 */
  .mc-zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .mc-zone{padding:12px 14px;border-radius:var(--r-md);background:rgba(29,29,27,.035);display:flex;flex-direction:column;gap:4px}
  .mc-zone-k{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
  .mc-zone-k i{width:8px;height:8px;border-radius:50%}
  .mc-zone-v{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .mc-names{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .mc-name{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px 0 6px;border-radius:var(--r-pill);background:rgba(29,29,27,.045);color:var(--ink);text-decoration:none;font-size:13px}
  .mc-name:hover{background:rgba(29,29,27,.08)}
  .mc-name .dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
  .mc-name small{color:var(--ink-mute);font-size:11.5px}
  .mc-callout{margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);background:rgba(246,207,74,.16);border-radius:var(--r-md);padding:11px 15px}
  .mc-foot{margin:26px 4px 8px;text-align:center;font-size:13px;color:var(--ink-mute);line-height:1.8}
  .mc-foot q{display:block;font-size:15px;color:var(--ink-soft);quotes:"「" "」"}
  /* 市场列数跟着「显示几个市场」走 */
  .mc-markets{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
  /* 自定义：页头右侧的按钮 + 浮层（≤600px 变底部抽屉） */
  .mc-hero-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mc-cust{position:relative}
  .mc-cust-btn i{font-size:15px}
  .mc-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:320px;padding:14px;border-radius:var(--r-lg);background:var(--card-solid);box-shadow:0 18px 50px -12px rgba(40,35,20,.28),0 0 0 1px var(--divider)}
  .mc-pop[hidden],.mc-scrim[hidden]{display:none}
  .mc-pop-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 4px 10px}
  .mc-pop-h b{font-size:15px;font-weight:500}
  .mc-pop-h small{font-size:12px;color:var(--ink-mute)}
  .mc-pop-l{font-size:11.5px;color:var(--ink-mute);margin:10px 6px 4px;letter-spacing:.02em}
  .mc-row{display:flex;align-items:center;gap:6px;min-height:48px;padding:6px 4px 6px 10px;border-radius:var(--r-sm)}
  .mc-row:hover{background:var(--track)}
  .mc-row-n{flex:1;min-width:0;font-size:14px}
  .mc-row-n small{display:block;margin-top:1px;font-size:11.5px;color:var(--ink-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-row.off .mc-row-n{color:var(--ink-mute)}
  .mc-mv{width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--ink-soft);cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
  .mc-mv:hover:not(:disabled){background:var(--track-edge,rgba(29,29,27,.1));color:var(--ink)}
  .mc-mv:disabled{opacity:.25;cursor:default}
  .mc-sw{position:relative;flex:none;width:40px;height:24px;margin-left:4px}
  .mc-sw input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
  .mc-sw span{position:absolute;inset:0;border-radius:var(--r-pill);background:rgba(29,29,27,.14);transition:background .18s;pointer-events:none}
  .mc-sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .18s}
  .mc-sw input:checked + span{background:var(--dark)}
  .mc-sw input:checked + span::after{transform:translateX(16px)}
  .mc-sw input:focus-visible + span{box-shadow:0 0 0 3px var(--sun-soft)}
  .mc-pop-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 4px 0;padding-top:10px;border-top:1px solid var(--divider);font-size:12px;color:var(--ink-mute)}
  .mc-pop-f button{border:0;background:none;padding:4px 0;font-family:var(--font);font-size:12.5px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .mc-pop-f button:disabled{opacity:.4;cursor:default;text-decoration:none}
  .mc-scrim{position:fixed;inset:0;z-index:29;background:transparent}
  @media (max-width:600px){ .mc-scrim{background:rgba(29,29,27,.18)} }
  /* 市场脉搏：每个市场一栏，三只指数 + 一年走势 */
  .mc-pulse{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:12px}
  .mc-pm{display:flex;flex-direction:column;gap:4px;padding:14px 16px 12px;border-radius:var(--r-lg);background:rgba(29,29,27,.035);min-width:0}
  .mc-pm-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .mc-pm-h b{font-size:15px;font-weight:500}
  .mc-pm-h small{font-size:11.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  .mc-pm-say{font-size:12.5px;line-height:1.6;color:var(--ink-soft);margin:2px 0 6px;min-height:20px}
  .mc-ix{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;align-items:center;gap:4px 12px;padding:8px 0;border-top:1px solid var(--divider)}
  .mc-ix-n{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-ix-n small{display:block;font-size:11px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .mc-ix-v{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mc-ix-v small{display:block;font-size:12px}
  .mc-up{color:var(--green)} .mc-dn{color:var(--red)} .mc-flat{color:var(--ink-mute)} .mc-neu{color:var(--ink-soft)} /* 利率升降不分好坏，不上色 */
  .mc-spark{display:block;width:84px;height:28px;overflow:visible}
  .mc-spark path{fill:none;stroke:var(--ink-soft);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
  .mc-spark.up path{stroke:var(--green)} .mc-spark.dn path{stroke:var(--red)}
  .mc-miss{font-size:12.5px;color:var(--ink-mute)}
  .mc-src{margin-top:12px;font-size:11.5px;color:var(--ink-mute);line-height:1.6}
  .mc-err{display:flex;align-items:center;justify-content:center;gap:8px;min-height:120px;padding:16px;border-radius:var(--r-md);background:rgba(255,255,255,.4);background-image:var(--hatch);font-size:13px;color:var(--ink-soft);text-align:center}
  .mc-err button{border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  /* 利率 · 汇率 · 商品：小方块 */
  .mc-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .mc-tile{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:var(--r-md);background:rgba(29,29,27,.035);min-width:0}
  .mc-tile-k{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-tile-k i{color:var(--ink-mute);cursor:help}
  .mc-tile-v{font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .mc-tile-c{font-size:12px;font-variant-numeric:tabular-nums;display:flex;gap:8px;flex-wrap:wrap}
  .mc-tile-d{font-size:11px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .mc-tile .mc-spark{width:100%;height:24px;margin-top:2px}
  .mc-tile.sk-t{min-height:96px}
  @media (max-width:1100px){ .mc-markets,.mc-pulse{grid-template-columns:1fr} .mc-zones{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:820px){ .mc-tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:600px){
    .mc-pop{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;max-height:80vh;overflow:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
    .mc-hero-r{width:100%;justify-content:space-between}
    .mc-ix{grid-template-columns:minmax(0,1fr) 64px auto}
    .mc-spark{width:64px}
    .mc-ix-n small{white-space:normal}
    .mc-tile-v{font-size:19px}
  }
  @media (max-width:560px){ .mc-card{padding:18px 16px} .mc-zones{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
  <!-- 模块依赖整棵树先声明：浏览器一次并行拉取，不用等上一层下载完才发现下一层 -->
  <link rel="modulepreload" href="/shared/core.js">
  <link rel="modulepreload" href="/shared/gauge.js">
  <link rel="modulepreload" href="/shared/macro-board.js">
  <link rel="modulepreload" href="/shared/i18n.js">
  <link rel="modulepreload" href="/shared/langmenu.js">
  <link rel="modulepreload" href="/shared/feedback.js">
  <link rel="modulepreload" href="/shared/global-ai.js">
  <link rel="modulepreload" href="/shared/feedback-core.js">
  <!-- 悬停 / 按下顶部导航链接时在后台预渲染目标页 -->
  <script type="speculationrules">{"prerender":[{"where":{"or":[{"href_matches":"/portfolio"},{"href_matches":"/b/*"},{"href_matches":"/macro"}]},"eagerness":"moderate"}]}</script>
</head>
<body>
<div class="page">
  <header class="topnav">
    <a class="brand" href="/portfolio" id="brand"><span class="brand-word"><b>Value</b>Port</span><span class="brand-beta">beta</span></a>
    <nav class="topnav-tabs" aria-label="导航">
      <a class="nav-tab" id="tabBoard" href="/"><i class="ri-line-chart-line" aria-hidden="true"></i><span data-i18n="nav_watchlist">Watchlist</span></a>
      <a class="nav-tab on" href="/macro" aria-current="page"><i class="ri-earth-line" aria-hidden="true"></i><span data-i18n="nav_macro">宏观看板</span></a>
      <a class="nav-tab" href="/portfolio"><i class="ri-pie-chart-2-line" aria-hidden="true"></i><span data-i18n="nav_portfolio">Portfolio</span></a>
    </nav>
    <div class="topnav-actions" id="topActions"></div>
  </header>
  <script src="/shared/navboot.js"></script>

  <div class="mc-hero">
    <div>
      <p class="eyebrow" id="mcEyebrow"></p>
      <h1 data-i18n="nav_macro">宏观看板</h1>
      <div class="mc-meta" id="mcMeta"></div>
      <div class="mc-chips" id="mcVerdict"></div>
    </div>
    <div class="mc-hero-r">
      <span class="mc-badge" id="mcBadge" hidden></span>
      <div class="mc-cust">
        <button class="btn sm ghost mc-cust-btn" id="mcCustBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="mcCustPop"><i class="ri-equalizer-line" aria-hidden="true"></i><span id="mcCustLabel"></span></button>
        <div class="mc-scrim" id="mcScrim" hidden></div>
        <div class="mc-pop" id="mcCustPop" role="dialog" aria-labelledby="mcCustTitle" hidden></div>
      </div>
    </div>
  </div>

  <div class="mc-grid">
    <section class="mc-card" id="mcLevel">
      <div class="mc-head"><div><div class="mc-title" id="mcLevelTitle"></div><div class="mc-sub" id="mcLevelSub"></div></div></div>
      <div class="mc-markets" id="mcMarkets"><div class="sk-card" style="min-height:300px"></div><div class="sk-card"></div><div class="sk-card"></div></div>
    </section>
    <section class="mc-card" id="mcPulse">
      <div class="mc-head"><div><div class="mc-title" id="mcPulseTitle"></div><div class="mc-sub" id="mcPulseSub"></div></div></div>
      <div class="mc-pulse" id="mcPulseBody"></div>
      <div class="mc-src" id="mcPulseSrc"></div>
    </section>
    <section class="mc-card" id="mcCross">
      <div class="mc-head"><div><div class="mc-title" id="mcCrossTitle"></div><div class="mc-sub" id="mcCrossSub"></div></div></div>
      <div class="mc-tiles" id="mcCrossBody"></div>
      <div class="mc-src" id="mcCrossSrc"></div>
    </section>
    <section class="mc-card" id="mcGravity">
      <div class="mc-head"><div><div class="mc-title" id="mcGravTitle"></div><div class="mc-sub" id="mcGravSub"></div></div><div class="mc-ctl" id="mcGravCtl"></div></div>
      <div class="mc-gsay" id="mcGravSay"></div>
      <div class="mc-chart" id="mcGravChart"></div>
      <div class="mc-legend" id="mcGravLegend"></div>
    </section>
    <section class="mc-card" id="mcMine" hidden>
      <div class="mc-head"><div><div class="mc-title" id="mcMineTitle"></div><div class="mc-sub" id="mcMineSub"></div></div><a class="btn sm" id="mcMineLink" href="/"></a></div>
      <div class="mc-zones" id="mcZones"></div>
      <div class="mc-names" id="mcNames"></div>
      <div class="mc-callout" id="mcMineSay" hidden></div>
    </section>
  </div>

  <div class="mc-foot"><q id="mcQuote"></q><span id="mcFootNote"></span></div>
</div>

<script type="module">
import { applyI18n, LANG } from "/shared/i18n.js";
import { mountLangMenu } from "/shared/langmenu.js";
import { mountFeedback } from "/shared/feedback.js";
import { mountGlobalAi } from "/shared/global-ai.js";
import { Gauge } from "/shared/gauge.js";
import { ZONES, structValid, computeAnchors, priceToPhi } from "/shared/core.js";
import { PREFS_KEY, DEFAULT_PREFS, normalizePrefs, parsePrefs, serializePrefs, visibleMarkets, isDefaultPrefs, toggleMarket, moveMarket, setCross, pickNewer, marketSummary, sparkPath } from "/shared/macro-board.js";

applyI18n();
mountLangMenu(document.getElementById("topActions"));
mountFeedback(document.getElementById("topActions")); // 反馈入口（只对已登录用户显示）
mountGlobalAi(document.getElementById("topActions"), { getPage: () => ({ kind: "macro", path: location.pathname, title: document.title }) }); // 全站 AI 助手（只对已登录用户显示）
const zh = LANG === "zh", T = (a, b) => (zh ? a : b);
const $ = (id) => document.getElementById(id);

async function loadMacro(keys, withRates) {
  for (const k of keys) MAC.st[k] = "loading";
  if (withRates) MAC.ratesSt = "loading";
  let d = null;
  try { const r = await fetch("/api/macro?markets=" + keys.join(","), { cache: "no-cache" }); d = r.ok ? await r.json() : null; } catch { d = null; } // 每次回源校验，别用旧缓存
  for (const k of keys) {
    const m = d && d.markets && d.markets.find((x) => x && x.key === k);
    MAC.st[k] = m ? "ok" : "error";
    if (m) { MAC.markets[k] = m; if (d.gravity && d.gravity[k]) MAC.gravity[k] = d.gravity[k]; }
  }
  if (d) { MAC.rates = d.rates || []; MAC.ratesSt = "ok"; MAC.updatedAt = d.updatedAt || MAC.updatedAt; } else if (MAC.ratesSt !== "ok") MAC.ratesSt = "error";
  renderLevel(); renderGravity(); renderPulse(); renderCross(); renderVerdict(); renderMineSay();
}
async function loadPulse(keys, withCross) {
  for (const k of keys) PUL.st[k] = "loading";
  if (withCross) PUL.crossSt = "loading";
  let d = null;
  try { const r = await fetch(`/api/macro/pulse?markets=${keys.join(",")}&cross=${withCross ? 1 : 0}`); d = r.ok ? await r.json() : null; } catch { d = null; }
  for (const k of keys) {
    const list = d && d.markets && d.markets[k];
    const ok = list && list.some((x) => !x.missing);
    PUL.st[k] = ok ? "ok" : "error";
    if (ok) PUL.markets[k] = list;
  }
  if (withCross) { const ok = d && d.cross && d.cross.some((x) => !x.missing); PUL.crossSt = ok ? "ok" : "error"; if (ok) PUL.cross = d.cross; }
  if (d && d.ts) PUL.ts = d.ts;
  renderPulse(); renderCross();
}
function ensureData() {
  const v = vis();
  const needM = v.filter((k) => !MAC.st[k] || MAC.st[k] === "error");
  const needRates = prefs.cross && (!MAC.ratesSt || MAC.ratesSt === "error");
  if (needM.length || (needRates && !Object.values(MAC.st).includes("loading"))) loadMacro(needM, needRates);
  const needP = v.filter((k) => !PUL.st[k] || PUL.st[k] === "error");
  const needX = prefs.cross && (!PUL.crossSt || PUL.crossSt === "error");
  if (needP.length || needX) loadPulse(needP, needX);
}

function marketGauge(mount, m) {
  const g = new Gauge(mount);
  g.setName(MKT[m.key]);
  g.set({ ticker: zh ? `${m.level} 分位` : `P${m.level}`, fairLow: 30, fairHigh: 70, mos: 200 / 3, ext: 200 / 7, price: Math.max(0.5, m.level) }, false);
  const svg = mount.querySelector("svg"); // 收紧 viewBox，去掉钟摆四周留白
  if (svg) requestAnimationFrame(() => { try { const b = svg.getBBox(); if (b.width) svg.setAttribute("viewBox", `${b.x - 6} ${b.y - 6} ${b.width + 12} ${b.height + 12}`); } catch {} });
  g.swingIn();
}

  const row = el("div", "mc-row" + (prefs.cross ? "" : " off"));
  const n = el("div", "mc-row-n", T("利率 · 汇率 · 商品", "Rates · FX · Commodities")); n.appendChild(el("small", "", T("美中 10 年国债、美元兑人民币 / 港元、黄金、原油", "US/China 10Y, USD/CNY, USD/HKD, gold, oil"))); row.appendChild(n);
  const s = sw(prefs.cross, T("显示利率、汇率与商品", "Show rates, FX and commodities"), (c) => applyPrefs(setCross(prefs, c))); s.querySelector("input").dataset.f = "cross:sw";
  row.appendChild(s); pop.appendChild(row);
  const f = el("div", "mc-pop-f");
  f.appendChild(el("span", "", signedIn ? T("已同步到你的账户", "Synced to your account") : T("保存在这台设备上", "Saved on this device")));
  const reset = el("button", "", T("恢复默认", "Reset")); reset.type = "button"; reset.dataset.f = "reset"; reset.disabled = isDefaultPrefs(prefs);
  reset.addEventListener("click", () => applyPrefs({ ...DEFAULT_PREFS, at: Date.now() }));

  const back = focusKey && pop.querySelector(`[data-f="${focusKey}"]`);

}
function openCust(on) {
