<body class="booting">
<div class="page">
  <!-- 顶部导航条：左 tabs（主人模式）/ 右 图标动作（语言全员可见、分享主人可见） -->
  <header class="topnav">
    <a class="brand" href="/" id="brand"><span class="brand-word"><b>Value</b>Port</span><span class="brand-beta">beta</span></a>
    <nav class="topnav-tabs hidden" id="appNav" aria-label="导航">
      <button class="nav-tab on" data-view="board">
        <i class="ri-line-chart-line" aria-hidden="true"></i>
        <span data-i18n="nav_watchlist">Watchlist</span>
      </button>
      <a class="nav-tab" href="/macro" data-view="macro">
        <i class="ri-earth-line" aria-hidden="true"></i>
        <span data-i18n="nav_macro">宏观看板</span>

        <i class="ri-pie-chart-2-line" aria-hidden="true"></i>
        <span data-i18n="nav_portfolio">Portfolio</span>

    <div class="topnav-actions" id="topActions">

    </div>

  <div class="page-head">
    <div class="hero">
      <div class="hero-main">
        <p class="eyebrow" id="eyebrow" data-i18n="def_eyebrow">市场情绪 · Valuation Pendulum</p>
        <h1 id="title" data-i18n="def_title">估值钟摆看板</h1>
        <p class="sub" id="sub" data-i18n="def_sub">每只标的一只钟摆：指针落位由现价与设定的合理价值区间、安全边际共同决定。市场在两端摆动，钟摆终将回归中点。</p>
        <p class="updated" id="updated" aria-live="polite"></p>
      </div>
      <div class="hero-stats" id="heroStats" aria-live="polite">
        <div class="stat total">
          <span class="stat-ico" aria-hidden="true"><i class="ri-stock-line" aria-hidden="true"></i></span>
          <span class="stat-num" id="statTotal">0</span>
          <span class="stat-lab" data-i18n="ov_total">标的</span>
        </div>
        <div class="stat strike">
          <span class="stat-ico" id="icoStrike" aria-hidden="true"><i class="ri-focus-3-line" aria-hidden="true"></i></span>
          <span class="stat-num" id="statStrike">0</span>
          <span class="stat-lab" data-i18n="ov_strike">击球区</span>
        </div>
        <div class="stat bubble">
          <span class="stat-ico" id="icoBubble" aria-hidden="true"><i class="ri-bubble-chart-line" aria-hidden="true"></i></span>
          <span class="stat-num" id="statBubble">0</span>
          <span class="stat-lab" data-i18n="ov_bubble">泡沫区</span>
        </div>
      </div>
    </div>
  </div>


  <!-- 有标的落进击球区时的一行提示（名称可点进详情；可关掉，进击球区的标的变了会再出现） -->
  <div class="strike-banner hidden" id="strikeBanner" role="status"></div>
  <!-- 该复核的估值：选中的估值卡超过半年没动，或之后出了新年报 -->
  <div class="strike-banner review hidden" id="reviewBanner" role="status"></div>

  <div class="layout">
    <div class="charts" id="charts"><div class="chart-item sk-tile" aria-hidden="true"><div class="sk-row"><span class="sk sk-round" style="width:34px;height:34px"></span><div class="sk-grow"><span class="sk sk-line" style="width:46%"></span><span class="sk sk-line" style="width:28%;height:9px;margin-top:8px"></span></div><span class="sk sk-line" style="width:64px;height:22px"></span></div><span class="sk sk-pill" style="height:14px"></span><div class="sk-row"><span class="sk sk-line" style="width:22%"></span><span class="sk-grow"></span><span class="sk sk-line" style="width:18%"></span></div></div><div class="chart-item sk-tile" aria-hidden="true"><div class="sk-row"><span class="sk sk-round" style="width:34px;height:34px"></span><div class="sk-grow"><span class="sk sk-line" style="width:46%"></span><span class="sk sk-line" style="width:28%;height:9px;margin-top:8px"></span></div><span class="sk sk-line" style="width:64px;height:22px"></span></div><span class="sk sk-pill" style="height:14px"></span><div class="sk-row"><span class="sk sk-line" style="width:22%"></span><span class="sk-grow"></span><span class="sk sk-line" style="width:18%"></span></div></div><div class="chart-item sk-tile" aria-hidden="true"><div class="sk-row"><span class="sk sk-round" style="width:34px;height:34px"></span><div class="sk-grow"><span class="sk sk-line" style="width:46%"></span><span class="sk sk-line" style="width:28%;height:9px;margin-top:8px"></span></div><span class="sk sk-line" style="width:64px;height:22px"></span></div><span class="sk sk-pill" style="height:14px"></span><div class="sk-row"><span class="sk sk-line" style="width:22%"></span><span class="sk-grow"></span><span class="sk sk-line" style="width:18%"></span></div></div><div class="chart-item sk-tile" aria-hidden="true"><div class="sk-row"><span class="sk sk-round" style="width:34px;height:34px"></span><div class="sk-grow"><span class="sk sk-line" style="width:46%"></span><span class="sk sk-line" style="width:28%;height:9px;margin-top:8px"></span></div><span class="sk sk-line" style="width:64px;height:22px"></span></div><span class="sk sk-pill" style="height:14px"></span><div class="sk-row"><span class="sk sk-line" style="width:22%"></span><span class="sk-grow"></span><span class="sk sk-line" style="width:18%"></span></div></div><div class="chart-item sk-tile" aria-hidden="true"><div class="sk-row"><span class="sk sk-round" style="width:34px;height:34px"></span><div class="sk-grow"><span class="sk sk-line" style="width:46%"></span><span class="sk sk-line" style="width:28%;height:9px;margin-top:8px"></span></div><span class="sk sk-line" style="width:64px;height:22px"></span></div><span class="sk sk-pill" style="height:14px"></span><div class="sk-row"><span class="sk sk-line" style="width:22%"></span><span class="sk-grow"></span><span class="sk sk-line" style="width:18%"></span></div></div><div class="chart-item sk-tile" aria-hidden="true"><div class="sk-row"><span class="sk sk-round" style="width:34px;height:34px"></span><div class="sk-grow"><span class="sk sk-line" style="width:46%"></span><span class="sk sk-line" style="width:28%;height:9px;margin-top:8px"></span></div><span class="sk sk-line" style="width:64px;height:22px"></span></div><span class="sk sk-pill" style="height:14px"></span><div class="sk-row"><span class="sk sk-line" style="width:22%"></span><span class="sk-grow"></span><span class="sk sk-line" style="width:18%"></span></div></div></div>
  </div>

  <!-- 设置视图（主人模式，由顶部齿轮图标切换） -->
  <div class="view-settings hidden" id="viewSettings">
    <h1 class="set-title" data-i18n="nav_settings">设置</h1>
    <!-- 分享：看板名称 / 公开地址（原「分享 · 看板设置」弹窗并入这里） -->
    <div class="cfg-block" id="shareCfg">
      <div class="cfg-top"><span class="cfg-name" data-i18n="s_title_short">分享</span><span class="save-state" id="boardSave"></span></div>
      <div class="cfg-grid">
        <label class="field"><span class="f-lab" data-i18n="s_name">看板名称</span>
          <input id="boardName" class="plain" type="text" autocomplete="off" data-i18n-ph="s_name_ph" placeholder="我的估值看板"></label>
        <label class="field"><span class="f-lab" data-i18n="s_slug">公开地址 Slug</span>
          <input id="boardSlug" type="text" autocomplete="off" maxlength="32" placeholder="my-board" spellcheck="false"></label>
      </div>
      <div class="f-lab" style="margin-top:12px" data-i18n="s_url_lab">纯查看网址（分享给任何人，只能看不能改）</div>
      <div class="share-url">
        <a id="boardLink" href="#" target="_blank">…</a>
        <button class="btn" id="btnCopyUrl" type="button" data-i18n="s_copy">复制</button>
      </div>
      <p class="quote-note" data-i18n="s_note">改动自动保存（600ms 防抖）。Slug 仅限小写字母、数字和连字符，3–32 位；保存后本页地址自动更新。</p>
    </div>
    <!-- 估值默认值：新添加标的时预填的安全边际 / 泡沫阈值 -->
    <div class="cfg-block" id="defCfg">
      <div class="cfg-top"><span class="cfg-name" id="defCfgName">估值默认值</span><span class="save-state" id="defSave"></span></div>
      <div class="cfg-grid">
        <label class="field"><span class="f-lab" id="defMosLab">安全边际 %</span><input id="defMos" class="plain" type="number" min="5" max="95" step="1" inputmode="decimal" placeholder="50"></label>
        <label class="field"><span class="f-lab" id="defExtLab">泡沫阈值 %</span><input id="defExt" class="plain" type="number" min="5" max="300" step="1" inputmode="decimal" placeholder="40"></label>
      </div>
      <p class="quote-note" id="defNote"></p>
    </div>
    <div class="cfg-block" id="aiCfg">
      <div class="cfg-top"><span class="cfg-name" id="aiCfgName">AI 模型</span><span class="save-state" id="aiSave"></span></div>
      <div id="aiCfgBody"></div>
      <div id="jevCfgBody" style="margin-top:20px"></div>
    </div>
    <!-- 数据：导出自选与估值卡（JSON 备份） -->
    <div class="cfg-block" id="dataCfg">
      <div class="cfg-top"><span class="cfg-name" id="dataCfgName">数据</span></div>
      <div class="ai-acts"><button class="btn" id="btnExport" type="button"></button><span class="ai-result" id="exportNote"></span></div>
    </div>
    <div style="padding:18px 0">
      <button class="btn" id="btnLogout" style="width:100%;justify-content:center" data-i18n="set_logout">退出登录</button>
    </div>
  </div>
  <!-- 标的详情视图（客户端路由 /b/<slug>/<code> 渲染） -->
  <div class="view-detail hidden" id="viewDetail"></div>
  <script>
    // 直接打开 /b/<slug>/<代码>：在首帧把列表换成详情骨架，等数据到了 renderDetail 再整块替换（避免先闪一下看板列表）
    if (/^\/b\/[^/]+\/[^/]+/.test(location.pathname)) {
      document.querySelector(".page-head").classList.add("hidden");
      document.querySelector(".layout").classList.add("hidden");
    }
    if (/^\/b\/[^/]+\/[^/]+/.test(location.pathname) && !document.documentElement.classList.contains("has-cache")) { // 有缓存时详情马上就能画，不用骨架
      var vd = document.getElementById("viewDetail");
      var L = function (w, h, extra) { return '<span class="sk sk-line" style="width:' + w + ';' + (h ? "height:" + h + "px;" : "") + (extra || "") + '"></span>'; };
      var card = function (inner, extra) { return '<div class="sk-card" style="' + (extra || "") + '">' + inner + "</div>"; };
      vd.innerHTML = '<div class="vd-backrow">' + L("84px", 34, "border-radius:999px") + '<span class="sk sk-round" style="width:40px;height:40px"></span></div>'
        + '<div class="vd-hero"><span class="sk sk-round" style="width:72px;height:72px"></span><div>' + L("200px", 24) + L("120px", 11, "margin-top:10px") + "</div>" + L("180px", 52, "border-radius:14px") + "</div>"
        + '<div class="vd-cols"><div class="vd-maincol">' + card(L("70%", 14), "margin-bottom:16px")
        + L("260px", 46, "border-radius:999px;margin-bottom:16px") + card(L("140px", 16) + L("100%", 160, "border-radius:16px") + L("60%", 12))
        + '</div><div class="vd-side">' + card(L("90px", 16) + '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">' + new Array(9).join(L("60%", 10) + L("80%", 19)) + "</div>", "margin-bottom:16px")
        + card(L("100px", 18) + L("70%", 11) + '<span class="sk" style="height:130px;border-radius:130px 130px 0 0;margin:10px auto 0;width:260px"></span>', "margin-bottom:16px")
        + card(L("90px", 18) + new Array(6).join('<div class="sk-row"><span class="sk sk-round" style="width:28px;height:28px"></span><span class="sk-grow">' + L("60%", 11) + "</span>" + L("40px", 14) + "</div>")) + "</div></div>";
      vd.classList.remove("hidden");
    }
  </script>
  <!-- 估值编辑器全屏双栏视图 -->
  <div class="view-detail view-valedit hidden" id="viewValEdit"></div>
</div>

<!-- 分享 / 看板设置弹窗（主人模式，Watchlist 右上角分享图标打开） -->


<!-- 标的编辑弹窗（主人模式） -->
<div class="overlay hidden" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">添加标的</span>
      <span class="save-state" id="modalSave"></span>
    </div>
    <div id="modalForm"></div>
    <div class="modal-foot">
      <button class="btn ghost danger" id="btnModalRemove" data-i18n="m_remove">移除</button>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button class="btn ghost" id="btnModalCancel"><span data-i18n="m_cancel">取消</span><kbd class="kbd">esc</kbd></button>
        <button class="btn primary" id="btnModalDone"><span data-i18n="m_done">完成</span><kbd class="kbd">↵</kbd></button>
      </div>
    </div>
  </div>
</div>
