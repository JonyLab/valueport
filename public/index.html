<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>估值钟摆 · 看板</title>
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* ===== zed.dev 风：暖白纸张 + 衬线标题 + 蓝灰强调 ===== */
  :root{
    --bg:#f4f2ec; --card:#faf9f4;
    --ink:#1b1a17; --ink-soft:#57534a; --ink-mute:#8a857a;
    --border:#dadde2; --accent:#ece8de;
    --ring:rgba(46,64,102,.22); --ring-border:#5a6886;
    --divider:#dadde2; --track:#ece8de; --track-edge:#e0dccf;
    --shadow:0 1px 2px rgba(60,50,25,.05);
    --sh:4px 4px 0 rgba(46,84,180,.06),-4px -4px 0 rgba(46,84,180,.05);
  }
  h1{font-family:var(--serif);font-weight:400;letter-spacing:-.025em}
  .eyebrow{color:var(--ink-mute)}
  body{overflow-x:hidden;padding:0}
  .layout{display:block}
  /* ===== zed.dev 线条系统：有界中央栏（两侧满高竖线）+ 区块横标尺线 + 钟摆方格 ===== */
  .page{max-width:1120px;margin:0 auto;position:relative;min-height:100vh;padding:0;
    display:flex;flex-direction:column;
    border-left:1px solid var(--divider);border-right:1px solid var(--divider)}
  .page-head{position:relative;margin:0;padding:30px 28px 22px;border-bottom:1px solid var(--divider)}
  /* 标题段底线（与隔断带共同围出 14px 账本带）——本线不放菱形，节点交给结构边界（顶栏线/页脚线），呼应 zed 的 divider-slash 不带节点 */
  /* 斜线填充底栏：填满中央栏剩余高度，呼应 zed 方格纸 */
  /* margin-top:-1px 让本元素的上边线压在上方元素的下边线上，合成单根 1px（避免双线变粗） */
  .frame-foot{flex:1 0 auto;min-height:120px;position:relative;margin-top:-1px;border-top:1px solid var(--divider);
    background-image:var(--hatch)}
  .frame-foot::before,.frame-foot::after{content:"";position:absolute;top:-3.5px;width:6px;height:6px;
    background:#fff;border:1px solid var(--node);transform:translate(-1px,-1px) rotate(45deg);z-index:2}
  .frame-foot::before{left:-3.5px} .frame-foot::after{right:-3.5px;transform:translate(1px,-1px) rotate(45deg)}
  /* zed 式标尺隔断带（divider-slash）：分开「标题段 / 看板段」。page-head 底线+节点作上线，本带自带下线+节点，
     中间填一层很淡的 45° 斜线网（比页脚 --hatch 更密更淡，对应 zed 的 offgray-200 ~20%） */
  .section-divider{position:relative;height:14px;border-bottom:1px solid var(--divider);
    background-image:repeating-linear-gradient(45deg,rgba(120,128,142,.16) 0,rgba(120,128,142,.16) 1px,transparent 1px,transparent 6px)}
  .board-bar{display:flex;align-items:flex-end;gap:8px;min-height:24px}
  .updated{font-family:var(--mono);font-size:12px;color:var(--ink-mute);margin:12px 0 0;flex:1;min-width:0}
  .btn.icon{width:34px;padding:0;justify-content:center;flex:none}
  .btn.icon svg{width:16px;height:16px}

  /* 钟摆排成有线分隔的方格：横线分行、竖线分列，外框由 .page 两侧竖线收口 */
  .charts{background:none;border:0;border-radius:0;margin:0;padding:0;max-width:none}
  /* 每格：左侧信息（名称/代码/股价/判定）+ 右侧小钟摆 */
  .chart-item{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--divider);padding:22px 24px;position:relative}
  .chart-item.chart-empty{display:block} /* 空位占位格不需要 flex 内容 */
  .chart-info{flex:1;min-width:0}
  .ci-id{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;min-width:0}
  .ci-name{font-family:var(--font);font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci-code{flex:none;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-mute)}
  .chart-info .verdict{text-align:left;margin:0;line-height:1.3}
  .chart-info .verdict .px{font-size:24px}
  .chart-info .verdict .lbl{font-size:13px}
  .chart-gauge{flex:none;width:228px;margin-top:-12px} /* 上移：半圆视觉重心偏下，往上挪一点更居中 */
  .chart-gauge svg{display:block;width:100%;height:auto;overflow:visible}
  @media (min-width:760px){
    .charts{display:grid;grid-template-columns:1fr 1fr}
    .chart-item:nth-child(odd){border-right:1px solid var(--divider)}
  }
  @media (max-width:560px){
    .page-head{padding:24px 16px 18px}
    .chart-item{padding:18px 16px;gap:12px}
    .chart-gauge{width:176px}
    .chart-info .verdict .px{font-size:21px}
  }

  /* ===== 按钮 / 表单（shadcn 形态）===== */
  /* 三档按钮：填充 primary / 描边 .btn / 纯文字 .ghost；带边框或背景的都有底缘内阴影（zed 键帽厚度） */
  .btn{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;letter-spacing:-.01em;
    border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--ink);
    font-size:13.5px;font-weight:500;box-shadow:inset 0 -2px 0 rgba(60,50,25,.05);
    transition:background .15s,border-color .15s,box-shadow .1s,transform .05s}
  .btn:hover{background:var(--accent);border-color:var(--track-edge)}
  .btn:active{transform:translateY(.5px);box-shadow:inset 0 -1px 0 rgba(60,50,25,.05)}
  .btn:focus-visible{outline:none;border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring)}
  /* primary = 填充键帽（更深的底缘内阴影） */
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.24),0 1px 2px rgba(60,50,25,.12)}
  .btn.primary:hover{background:#2a2723}
  .btn.primary:active{box-shadow:inset 0 -1px 0 rgba(0,0,0,.24)}
  /* ghost = 纯文字（无边框无底色，无键帽），低权重动作 */
  .btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--accent);border-color:transparent;color:var(--ink)}
  .btn.ghost:active{transform:translateY(.5px);box-shadow:none}
  .btn.danger{color:var(--red)}
  .btn.danger:hover{background:#fbeaea;border-color:#e6c7c2}
  .btn.ghost.danger{color:var(--red)} .btn.ghost.danger:hover{background:#fbeaea;border-color:transparent}
  .btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:4px}
  /* 快捷键徽章（zed kbd）：方角小键帽，等宽 */
  .kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;
    border-radius:2px;font-family:var(--mono);font-size:10.5px;font-weight:700;line-height:1}
  .btn:not(.primary) .kbd{background:var(--card);border:1px solid var(--border);color:var(--ink-mute)}
  .btn.primary .kbd{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.26);color:#fff}
  .btn:has(.kbd){padding-right:6px}

  .field{display:flex;flex-direction:column;gap:6px}
  .f-lab{font-size:12.5px;font-weight:500;color:#3f3f46}
  .field input,.field textarea{
    height:36px;font-size:14px;font-weight:500;color:var(--ink);font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    border:1px solid var(--border);border-radius:5px;padding:0 12px;width:100%;
    background:#fff;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.03);
    transition:border-color .15s,box-shadow .15s}
  .field textarea{height:auto;min-height:76px;padding:8px 12px;resize:vertical;line-height:1.55;font-family:var(--font);font-size:13.5px}
  .field input:focus,.field textarea:focus{border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring)}
  .field input.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,60,60,.12)}
  .field input.ok{border-color:#86c8a0}
  .field input.plain{font-family:var(--font)}
  .f-err{font-size:11px;color:var(--red);margin-top:3px;display:none}
  .cfg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .cfg-grid .field.full{grid-column:1 / -1}
  .save-state{font-size:12px;color:var(--ink-mute);margin-left:8px}
  .save-state.ok{color:var(--green)} .save-state.err{color:var(--red)}
  .quote-note{font-size:12px;color:var(--ink-mute);line-height:1.6;margin:6px 0 4px}
  .quote-note code{font-family:var(--mono);background:var(--accent);border:1px solid var(--border);padding:1px 5px;border-radius:5px}
  .quote-note a{color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}
  .quote-note a:hover{color:var(--ink)}

  .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .chip{appearance:none;font-family:var(--font);font-size:12px;font-weight:500;padding:4px 10px;
    border-radius:4px;border:1px solid var(--border);background:#fff;color:var(--ink-soft);cursor:pointer;
    transition:background .12s,color .12s,border-color .12s}
  .chip:hover{background:var(--accent)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip:focus-visible{outline:none;border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring)}

  /* 联想下拉 */
  .combo{position:relative}
  .combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:230px;
    background:#fff;border:1px solid var(--border);border-radius:6px;
    box-shadow:0 4px 16px rgba(60,50,25,.10),0 1px 2px rgba(60,50,25,.06);z-index:30;
    max-height:236px;overflow:auto;padding:4px}
  .combo-opt{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:4px;cursor:pointer;font-size:13px}
  .combo-opt:hover,.combo-opt.act{background:var(--accent)}
  .combo-opt .c-code{font-family:var(--mono);font-weight:700}
  .combo-opt .c-name{color:var(--ink-soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .combo-opt .c-mkt{font-size:10.5px;color:var(--ink-mute);background:var(--accent);border:1px solid var(--border);padding:1px 6px;border-radius:999px;white-space:nowrap}

  /* 卡片上的编辑按钮：靠上角，hover 卡片时才出现（触屏设备常驻） */
  .card-edit{position:absolute;top:12px;right:14px;z-index:5}
  @media (hover:hover){
    .card-edit{opacity:0;transition:opacity .15s}
    .chart-item:hover .card-edit,.card-edit:focus-visible{opacity:1}
  }
  /* 末尾「添加」做成一行标尺行，融入方格，而非浮起的虚线盒 */
  .add-card{grid-column:1 / -1;border:0;border-bottom:1px solid var(--divider);margin:0;padding:20px 0;
    width:100%;background:none;color:var(--ink-mute);font-size:13.5px;font-weight:500;cursor:pointer;font-family:var(--font);
    transition:background .15s,color .15s}
  .add-card:hover{background:var(--accent);color:var(--ink)}
  /* 奇数个标的时补一格空位，底边用虚线把横向标尺线接过去（虚线=空位/占位） */
  .chart-empty{border-bottom-style:dashed}

  /* ===== 弹窗（shadcn Dialog）===== */
  .overlay{position:fixed;inset:0;background:rgba(9,9,11,.45);z-index:90;display:flex}
  .overlay.hidden{display:none}
  /* zed.dev：方角卡 + 实线分隔的「头/体/脚」三段 */
  .modal{margin:auto;width:min(440px,calc(100vw - 32px));background:#fff;border:1px solid var(--border);
    border-radius:8px;box-shadow:var(--sh),0 10px 34px rgba(20,22,35,.16);padding:0 18px 0;max-height:88vh;overflow:auto}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    margin:0 -18px 16px;padding:15px 18px 13px;border-bottom:1px solid var(--divider)}
  .modal-title{font-size:15px;font-weight:600;font-family:var(--mono)}
  .modal-err{font-size:12px;color:var(--red);margin-top:10px;display:none}
  .modal-foot{display:flex;justify-content:space-between;align-items:center;
    margin:16px -18px 0;padding:13px 18px 14px;border-top:1px solid var(--divider)}

  /* ===== 顶部导航条（zed top nav：左 tabs 下划线 / 右 图标动作；底部标尺线 + 「+」节点）===== */
  /* 三栏：品牌左 / 菜单导航居中 / 动作图标右（grid 显式列，隐藏 tabs 时布局仍稳） */
  .topnav{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    height:52px;padding:0 28px;border-bottom:1px solid var(--divider)}
  .topnav::before,.topnav::after{content:"";position:absolute;bottom:-3.5px;width:6px;height:6px;
    background:#fff;border:1px solid var(--node);transform:translate(-1px,1px) rotate(45deg);z-index:2}
  .topnav::before{left:-3.5px} .topnav::after{right:-3.5px;transform:translate(1px,1px) rotate(45deg)}
  /* 产品名（顶部左侧，加粗字号） */
  .brand{grid-column:1;justify-self:start;display:inline-flex;align-items:center;font-family:var(--serif);
    font-style:italic;font-weight:700;font-size:19px;letter-spacing:0;color:var(--ink);text-decoration:none}
  .brand:hover{color:var(--ink)}
  .topnav-tabs{grid-column:2;justify-self:center;align-self:stretch;display:flex;gap:2px}
  .topnav-actions{grid-column:3;justify-self:end;display:flex;align-items:center;gap:6px}
  .nav-tab{display:inline-flex;align-items:center;gap:6px;padding:0 14px;border:0;background:none;cursor:pointer;
    font-family:var(--font);font-size:13.5px;font-weight:500;color:var(--ink-mute);letter-spacing:-.01em;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
  .nav-tab svg{width:15px;height:15px;flex:none}
  .nav-tab:hover{color:var(--ink)}
  .nav-tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .nav-tab:focus-visible{outline:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--ring-border)}
  .nav-tab:disabled{opacity:.45;cursor:not-allowed}
  .nav-tab:disabled:hover{color:var(--ink-mute)}
  /* 语言图标按钮：地球 + 当前可切到的语言码 */
  #btnLang .lang-code{font-size:12px;font-weight:600;letter-spacing:.02em}
  /* 图标按钮的「当前激活」态（如设置面板打开时齿轮高亮） */
  .btn.icon.on{background:var(--accent);color:var(--ink)}
  @media (max-width:560px){
    .topnav{padding:0 14px;height:48px}
    .nav-tab{padding:0 9px;font-size:12.5px}
    .nav-tab svg{width:16px;height:16px}
  }

  /* ===== 设置视图 ===== */
  .view-settings{max-width:640px;margin:0 auto;padding-top:4px}
  .set-title{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-.01em;margin:8px 0 18px}
  .cfg-block{padding:16px 0 14px;border-bottom:1px solid var(--border)}
  .cfg-block:last-of-type{border-bottom:0}
  .cfg-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cfg-name{font-size:14px;font-weight:600}

  .color-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--accent)}
  .color-row:first-child{border-top:none}
  .color-row .c-lab{flex:1;font-size:13px;color:var(--ink-soft)}
  .color-row input[type=color]{width:36px;height:32px;padding:2px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer}
  .color-row input[type=text]{width:96px;height:32px;font-family:var(--mono);font-size:12.5px;font-weight:500;
    border:1px solid var(--border);border-radius:8px;padding:0 9px;background:#fff;outline:none;
    transition:border-color .15s,box-shadow .15s}
  .color-row input[type=text]:focus{border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring)}
  .color-row input[type=text].bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,60,60,.12)}

  .share-url{display:flex;gap:8px;align-items:center;margin:6px 0 2px}
  .share-url a{flex:1;min-width:0;height:36px;display:flex;align-items:center;padding:0 12px;
    font-family:var(--mono);font-size:12.5px;color:var(--ink);text-decoration:none;
    background:var(--accent);border:1px solid var(--border);border-radius:8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .share-url a:hover{border-color:#d4d4d8;text-decoration:underline}
  .share-url .btn{flex:none}
  .hidden{display:none}
</style>
</head>
<body>
<div class="page">
  <!-- 顶部导航条：左 tabs（主人模式）/ 右 图标动作（语言全员可见、分享主人可见） -->
  <header class="topnav">
    <a class="brand" href="/" id="brand">ValuePort</a>
    <nav class="topnav-tabs hidden" id="appNav" aria-label="导航">
      <button class="nav-tab on" data-view="board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span data-i18n="nav_watchlist">Watchlist</span>
      </button>
      <button class="nav-tab" data-view="macro" disabled data-i18n-title="nav_macro_soon" title="即将上线" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span data-i18n="nav_macro">宏观看板</span>
      </button>
    </nav>
    <div class="topnav-actions" id="topActions">
      <button class="btn icon ghost hidden" id="btnSettings" data-i18n-title="nav_settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
      </button>
      <button class="btn sm ghost" id="btnLang" aria-label="切换语言 / Switch language" title="切换语言 / Switch language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="lang-code" id="langCode"></span>
      </button>
    </div>
  </header>

  <div class="page-head">
    <p class="eyebrow" id="eyebrow" data-i18n="def_eyebrow">市场情绪 · Valuation Pendulum</p>
    <h1 id="title" data-i18n="def_title">估值钟摆看板</h1>
    <p class="sub" id="sub" data-i18n="def_sub">每只标的一只钟摆：指针落位由现价与设定的合理价值区间、安全边际共同决定。市场在两端摆动，钟摆终将回归中点。</p>
    <div class="board-bar">
      <p class="updated" id="updated" aria-live="polite"></p>
      <button class="btn icon ghost hidden" id="btnShare" aria-label="分享 / 看板设置" data-i18n-title="s_share" title="分享列表 / 看板设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
      </button>
    </div>
  </div>

  <div class="section-divider" id="boardDivider" aria-hidden="true"></div>

  <div class="layout">
    <div class="charts" id="charts"></div>
  </div>

  <!-- 设置视图（主人模式，由顶部齿轮图标切换） -->
  <div class="view-settings hidden" id="viewSettings">
    <h1 class="set-title" data-i18n="nav_settings">设置</h1>
    <div class="cfg-block">
      <div class="cfg-top"><span class="cfg-name" data-i18n="set_text">页面文案</span><span class="save-state" id="setSave"></span></div>
      <div class="cfg-grid">

<script type="module">
import { Gauge } from "/shared/gauge.js";
import { verdictOf, structValid, applyZoneColors, ZONES, DEFAULT_ZONE_COLORS } from "/shared/core.js";
import { MKT_LABEL } from "/shared/market.js";
import { t, applyI18n, toggleLang, langButtonLabel, LANG } from "/shared/i18n.js";

applyI18n(); // 静态文案先按当前语言渲染
const VMSGS = {
  px: (p) => t("v_px", typeof p === "number" ? p.toFixed(2) : p), pxNone: t("v_px_none"), noSymbol: t("v_no_symbol"),
  waiting: t("v_waiting"), under: (pct) => t("v_under", pct), over: (pct) => t("v_over", pct), fair: t("v_fair"),
};
// 语言切换（顶部地球图标按钮，全员可见）：显示「可切到的语言」码
const btnLang = document.getElementById("btnLang");
document.getElementById("langCode").textContent = langButtonLabel();
btnLang.addEventListener("click", toggleLang);

const REDUCE = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
const ZONE_KEYS = ZONES.map((z) => z.key);
const ZONE_LABELS = { deep: t("zone_deep"), under: t("zone_under"), fair: t("zone_fair"), over: t("zone_over"), xover: t("zone_xover") };
const HEX_RE = /^#[0-9a-fA-F]{6}$/;
const SLUG_RE = /^[a-z0-9-]{3,32}$/;

const chartsEl = document.getElementById("charts");
const updatedEl = document.getElementById("updated");
const items = []; // {id, cfg, gauge, chartEl, verdictEl, live, gotQuote}
let boardSlug = "";
let owner = false;
let addCardEl = null;

// 默认文案（自定义清空时恢复；随当前语言）
const DEFAULT_TEXT = { eyebrow: t("def_eyebrow"), title: t("def_title"), subtitle: t("def_sub") };

function applyColors(s) {
  const m = {};
  for (const k of ZONE_KEYS) if (s["color_" + k]) m[k] = s["color_" + k];
  applyZoneColors(m);
}
function applySettings(s) {
  document.getElementById("eyebrow").textContent = s.eyebrow || DEFAULT_TEXT.eyebrow;
  const t = s.title || DEFAULT_TEXT.title;
  document.getElementById("title").textContent = t;
  document.title = t;
  document.getElementById("sub").textContent = s.subtitle || DEFAULT_TEXT.subtitle;
}

/* ---------- 图表渲染 ---------- */
function renderVerdict(item) {
  if (item._pxRaf) { cancelAnimationFrame(item._pxRaf); item._pxRaf = null; }
  const v = verdictOf(item.cfg, VMSGS);
  const el = item.verdictEl;
  el.className = "verdict " + v.cls;
  el.innerHTML = "";
  const px = document.createElement("span");
  px.className = "px";
  px.textContent = v.px;
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = v.text;
  el.appendChild(px);
  el.appendChild(lbl);
}
// 入场动画：现价数字与钟摆 swingIn 同步入场、同时收尾（呼应 motion.dev number-trend）
// 用与 gauge.swingIn 完全相同的阻尼包络（λ=0.9）和停止阈值（env≤0.012），保证两者同时停
function animatePriceIn(item) {
  const px = item.verdictEl.querySelector(".px");
  const to = item.cfg.price;
  if (!px || !(to > 0)) return;
  if (REDUCE) { px.textContent = VMSGS.px(to); return; }
  const lambda = 0.9, cutoff = 0.012, t0 = performance.now();
  px.textContent = VMSGS.px(0);
  const step = (now) => {
    const env = Math.exp(-lambda * (now - t0) / 1000); // 1→0，随钟摆摆幅一起衰减
    // 归一化：env 降到 cutoff 时正好到达目标，避免收尾跳一下
    px.textContent = VMSGS.px(to * (1 - env) / (1 - cutoff));
    if (env > cutoff) item._pxRaf = requestAnimationFrame(step);
    else { px.textContent = VMSGS.px(to); item._pxRaf = null; }
  };
  item._pxRaf = requestAnimationFrame(step);
}
// 当前语言下该显示的标的名：英文用 Longbridge name_en，缺则回退已存名/代码
function displayName(item) {
  const c = item.cfg;
  if (LANG === "en") return item.nameEn || c.name || c.ticker || "";
  return c.name || item.nameCn || c.ticker || "";
}
// 拉取一批标的的中英文名（Longbridge），写回各 item 并刷新中枢名称
async function loadNames(syms) {
  syms = [...new Set((syms || []).filter(Boolean))];
  if (!syms.length) return;
  try {
    const res = await fetch("/api/names?symbols=" + encodeURIComponent(syms.join(",")));
    const { names } = await res.json();
    if (!names) return;
    for (const item of items) {
      const n = names[item.cfg.symbol];
      if (!n) continue;
      item.nameCn = n.cn || ""; item.nameEn = n.en || "";
      renderItemHead(item);
    }
  } catch { /* 拿不到就保持已存名 */ }
}
// 左侧信息区的名称行（名称随语言、代码用 ticker）
function renderItemHead(item) {
  if (item.nameEl) item.nameEl.textContent = displayName(item);
  if (item.codeEl) item.codeEl.textContent = (item.cfg.ticker || "").toUpperCase();
}
function addChart(cfg) {
  const wrap = document.createElement("div");
  wrap.className = "chart-item";
  // 左：信息区（名称/代码 + 股价/判定）
  const info = document.createElement("div");
  info.className = "chart-info";
  const idRow = document.createElement("div");
  idRow.className = "ci-id";
  const nameEl = document.createElement("span"); nameEl.className = "ci-name";
  const codeEl = document.createElement("span"); codeEl.className = "ci-code";
  idRow.append(nameEl, codeEl);
  const verdict = document.createElement("p");
  verdict.className = "verdict v-fair";
  info.append(idRow, verdict);
  // 右：小钟摆
  const gwrap = document.createElement("div");
  gwrap.className = "chart-gauge";
  const gauge = new Gauge(gwrap, { compact: true });
  wrap.append(info, gwrap);
  const item = { id: cfg.id || null, cfg: { ...cfg }, gauge, chartEl: wrap, verdictEl: verdict, nameEl, codeEl, live: false, gotQuote: false };
  if (owner) {
    const edit = document.createElement("button");
    edit.className = "btn sm ghost card-edit";
    edit.textContent = t("b_edit");
    edit.addEventListener("click", () => openItemModal(item, false));
    wrap.appendChild(edit);
  }
  if (addCardEl) chartsEl.insertBefore(wrap, addCardEl); else chartsEl.appendChild(wrap);
  items.push(item);
  gauge.set(item.cfg, false);
  renderVerdict(item);
  renderItemHead(item);
  syncEmptyCell();
  return item;
}
function removeChart(item) {
  const idx = items.indexOf(item);
  if (idx >= 0) { item.gauge.destroy(); item.chartEl.remove(); items.splice(idx, 1); }
  syncEmptyCell();
}
// 标的为奇数时，在末尾空格子补一个虚线占位，把横向标尺线接过去（2 列网格右下角不再开口）
function syncEmptyCell() {
  const old = chartsEl.querySelector(".chart-empty");
  if (old) old.remove();
  if (items.length % 2 === 1) {
    const ph = document.createElement("div");
    ph.className = "chart-item chart-empty";
    ph.setAttribute("aria-hidden", "true");
    if (addCardEl) chartsEl.insertBefore(ph, addCardEl); else chartsEl.appendChild(ph);
  }
}

/* ---------- 行情 ---------- */
async function fetchQuotes() {
  const symbols = [...new Set(items.map((i) => i.cfg.symbol).filter(Boolean))];
  if (!symbols.length) return;
  let data;
  try {
    const res = await fetch("/api/quotes?symbols=" + encodeURIComponent(symbols.join(",")));
    data = await res.json();
  } catch { return; }
  const quotes = data.quotes || {};
  let ok = 0;
  items.forEach((item) => {
    const p = quotes[item.cfg.symbol];
    if (!(p > 0)) return;
    ok++;
    item.cfg = { ...item.cfg, price: p };
    item.live = true;
    if (structValid(item.cfg)) {
      const first = !item.gotQuote;
      item.gotQuote = true;
      item.gauge.set(item.cfg, !first);
      if (first) item.gauge.swingIn();
      renderVerdict(item);
      if (first) animatePriceIn(item);
    }
  });
  if (ok > 0) {
    const now = new Date();
    const p2 = (n) => String(n).padStart(2, "0");
    const src = data.source === "longbridge" ? t("src_longbridge") : t("src_tencent");
    updatedEl.textContent = t("b_updated", `${p2(now.getHours())}:${p2(now.getMinutes())}:${p2(now.getSeconds())}`, src);
  }
}

/* ---------- 启动 ---------- */
async function init() {
  const m = location.pathname.match(/^\/b\/([^/]+)/);
  boardSlug = m ? decodeURIComponent(m[1]) : "";
  if (!boardSlug) { location.replace("/login"); return; }

  const [cfgRes, meRes] = await Promise.allSettled([
    fetch("/api/config?slug=" + encodeURIComponent(boardSlug)),
    fetch("/api/me"),
  ]);

  // 身份
  let me = null;
  if (meRes.status === "fulfilled" && meRes.value.ok) {
    try { me = await meRes.value.json(); } catch { me = null; }
  }
  owner = !!(me && me.board && me.board.slug === boardSlug);

  // 看板数据
  if (cfgRes.status !== "fulfilled") { chartsEl.innerHTML = `<div class="charts-empty">${t("b_loadfail")}</div>`; return; }
  const res = cfgRes.value;
  if (res.status === 404) { chartsEl.innerHTML = `<div class="charts-empty">${t("b_notfound")}</div>`; return; }
  let data;
  try { data = await res.json(); } catch { chartsEl.innerHTML = `<div class="charts-empty">${t("b_loadfail")}</div>`; return; }
  applySettings(data.settings || {});
  applyColors(data.settings || {});
  const rows = data.items || [];

  // 头部入口 / 导航
  const actions = document.getElementById("topActions");
  if (owner) {
    document.getElementById("appNav").classList.remove("hidden");
    document.getElementById("btnShare").classList.remove("hidden");
    document.getElementById("btnSettings").classList.remove("hidden");
  } else if (me && me.board && me.board.slug) {
    const mine = document.createElement("a");
    mine.className = "btn sm ghost"; mine.style.textDecoration = "none";
    mine.href = "/b/" + me.board.slug; mine.textContent = t("b_myboard");
    actions.insertBefore(mine, document.getElementById("btnLang"));
  }

  // 渲染
  chartsEl.innerHTML = "";
  items.length = 0;
  if (owner) {
    addCardEl = document.createElement("button");
    addCardEl.className = "add-card";
    addCardEl.textContent = t("b_add");
    addCardEl.addEventListener("click", () => {
      // 低/高点不预填（必须自己想清楚估值）；安全边际默认 50%、极度高估默认 40%
      const item = addChart({ ticker: "", name: "", symbol: null, price: 0, fairLow: "", fairHigh: "", mos: 50, ext: 40, sortOrder: items.length });
      openItemModal(item, true);
      item.chartEl.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "center" });
    });
    chartsEl.appendChild(addCardEl);
  }
  if (!rows.length && !owner) {
    chartsEl.innerHTML = `<div class="charts-empty">${t("b_empty")}</div>`;
    return;
  }
  rows.forEach((r) => addChart({ ...r, price: 0 }));
  if (owner) initOwner(data.settings || {});
  await fetchQuotes();
  loadNames(items.map((i) => i.cfg.symbol)); // 双语名（不阻塞首屏）
}

/* ================= 以下仅主人模式 ================= */

/* ---------- 保存（防抖 + 串行） ---------- */
const modalSaveEl = document.getElementById("modalSave");
function setSaveState(state, text) {
  modalSaveEl.className = "save-state " + (state || "");
  modalSaveEl.textContent = text || "";
}
async function saveItem(item) {
  if (!item.cfg.symbol || !structValid(item.cfg)) return;
  if (item._saving) { item._pendingSave = true; return; }
  item._saving = true;
  setSaveState("", t("st_saving"));
  const payload = {
    ticker: item.cfg.ticker, name: item.cfg.name, symbol: item.cfg.symbol,
    fairLow: item.cfg.fairLow, fairHigh: item.cfg.fairHigh, mos: item.cfg.mos, ext: item.cfg.ext,
    sortOrder: item.cfg.sortOrder || 0,
  };
  const url = item.id ? `/api/my/items/${item.id}` : "/api/my/items";
  const method = item.id ? "PUT" : "POST";
  try {
    const res = await fetch(url, { method, headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
    if (res.ok) {
      const body = await res.json();
      if (!item.id && body.id) item.id = body.id;
      if (item._discarded && item.id) { // 关窗丢弃后迟到落库的，删掉以保持一致
        fetch(`/api/my/items/${item.id}`, { method: "DELETE" }).catch(() => {});
        item.id = null;
      }
      setSaveState("ok", t("st_saved"));
    } else setSaveState("err", t("st_failed"));
  } catch { setSaveState("err", t("st_failed")); }
  finally {
    item._saving = false;
    if (item._pendingSave) { item._pendingSave = false; saveItem(item); }
  }
}
function debounceSave(item) {
  clearTimeout(item._saveT);
  item._saveT = setTimeout(() => saveItem(item), 600);
}

/* ---------- 代码联想 ---------- */
let hintSeq = 0;
async function loadHints(q) {
  const seq = ++hintSeq;
  try {
    const res = await fetch("/api/hints?q=" + encodeURIComponent(q));
    const { hints } = await res.json();
    return seq === hintSeq ? hints : null;
  } catch { return []; }
}

/* ---------- 标的编辑弹窗 ---------- */
const FIELDS = [
  { k: "ticker", lab: t("m_ticker"), type: "text" },
  { k: "fairLow", lab: t("m_fair_low"), type: "number" },
  { k: "fairHigh", lab: t("m_fair_high"), type: "number" },
  { k: "mos", lab: t("m_mos"), type: "number", presets: [10, 20, 30, 40, 50] },
  { k: "ext", lab: t("m_ext"), type: "number", presets: [10, 20, 30, 40, 50] },
];
const modalOverlay = document.getElementById("modalOverlay");
const modalForm = document.getElementById("modalForm");
const modalTitle = document.getElementById("modalTitle");
const btnModalRemove = document.getElementById("btnModalRemove");
let modalItem = null, modalIsNew = false, modalSnapshot = null;
let fieldErrs = {}, fieldInputs = {};   // 字段级内联报错：key → 错误元素 / 输入框
function showFieldErr(key, msg) { const e = fieldErrs[key]; if (e) { e.textContent = msg; e.style.display = "block"; } if (fieldInputs[key]) fieldInputs[key].classList.add("bad"); }
function clearFieldErrs() { for (const k in fieldErrs) if (fieldErrs[k]) fieldErrs[k].style.display = "none"; }

function modalTitleFor(item) {
  return item.cfg.symbol
    ? `${(item.cfg.ticker || "").toUpperCase()}${item.cfg.name ? " · " + item.cfg.name : ""}`
    : (modalIsNew ? t("m_add_title") : (item.cfg.ticker || "—").toUpperCase());
}

function buildItemForm(item) {
  modalForm.innerHTML = "";
  fieldErrs = {}; fieldInputs = {};
  const grid = document.createElement("div");
  grid.className = "cfg-grid";
  FIELDS.forEach((f) => {
    const lab = document.createElement("label");
    lab.className = "field" + (f.k === "ticker" ? " full" : "");
    const span = document.createElement("span");
    span.className = "f-lab"; span.textContent = f.lab;
    const input = document.createElement("input");
    input.type = f.type;
    if (f.type === "number") { input.min = "0"; input.step = "any"; }
    else { input.maxLength = 24; input.spellcheck = false; input.placeholder = t("m_ph_ticker"); input.autocomplete = "off"; }
    input.value = item.cfg[f.k] ?? "";
    fieldInputs[f.k] = input;

    input.addEventListener("input", () => {
      if (fieldErrs[f.k]) fieldErrs[f.k].style.display = "none"; // 输入即清除本字段报错
      const v = f.type === "number" ? parseFloat(input.value) : input.value.trim();
      const next = { ...item.cfg, [f.k]: v };
      let bad = false;
      if (f.k === "fairLow") bad = !(v > 0);
      if (f.k === "fairHigh") bad = !(v > next.fairLow);
      if (f.k === "mos") bad = !(v > 0 && v < 100);
      if (f.k === "ext") bad = !(v > 0);
      input.classList.toggle("bad", bad && input.value !== "");
      item.cfg = next;
      if (f.k === "ticker") {
        item.live = false; item.gotQuote = false;
        item.cfg = { ...item.cfg, price: 0, symbol: null, name: "" };
        input.classList.remove("ok", "bad");
        modalTitle.textContent = modalTitleFor(item);
        renderVerdict(item);
        item.gauge.set(item.cfg);
      }
      if (structValid(item.cfg)) {
        item.gauge.set(item.cfg);
        renderVerdict(item);
        debounceSave(item);
      }
    });

    if (f.k === "ticker") {
      const combo = document.createElement("div");
      combo.className = "combo";
      const list = document.createElement("div");
      list.className = "combo-list"; list.style.display = "none";
      const err = document.createElement("div");
      err.className = "f-err"; err.textContent = t("m_pick_err");
      fieldErrs.ticker = err;
      let opts = [], act = -1, searchTimer = null;
      const close = () => { list.style.display = "none"; act = -1; };
      const markState = () => {
        const txt = input.value.trim();
        if (item.cfg.symbol) { input.classList.add("ok"); input.classList.remove("bad"); err.style.display = "none"; }
        else if (txt) { input.classList.add("bad"); input.classList.remove("ok"); err.textContent = t("m_pick_err"); err.style.display = "block"; }
        else { input.classList.remove("ok", "bad"); err.style.display = "none"; }
      };
      const pick = (o) => {
        input.value = o.code;
        item.cfg = { ...item.cfg, ticker: o.code, name: o.name, symbol: o.symbol, price: 0 };
        item.live = false; item.gotQuote = false;
        modalTitle.textContent = modalTitleFor(item);
        item.nameCn = ""; item.nameEn = ""; // 换标的后旧名作废，重新拉
        if (structValid(item.cfg)) { item.gauge.set(item.cfg); renderVerdict(item); renderItemHead(item); saveItem(item); }
        close(); markState(); fetchQuotes(); loadNames([item.cfg.symbol]);
      };
      const renderList = (arr) => {
        opts = arr; act = -1; list.innerHTML = "";
        if (!arr.length) { close(); return; }
        arr.forEach((o) => {
          const d = document.createElement("div");
          d.className = "combo-opt";
          d.innerHTML = `<span class="c-code"></span><span class="c-name"></span><span class="c-mkt"></span>`;
          d.children[0].textContent = o.code;
          d.children[1].textContent = o.name;
          d.children[2].textContent = MKT_LABEL[o.mkt];
          d.addEventListener("mousedown", (e) => { e.preventDefault(); pick(o); });
          list.appendChild(d);
        });
        list.style.display = "";
      };
      const highlight = () => {
        [...list.children].forEach((d, i) => d.classList.toggle("act", i === act));
        if (act >= 0) list.children[act].scrollIntoView({ block: "nearest" });
      };
      input.addEventListener("input", () => {
        const q = input.value.trim();
        clearTimeout(searchTimer);
        if (q.length < 1) { close(); return; }
        searchTimer = setTimeout(async () => {
          const arr = await loadHints(q);
          if (arr !== null) renderList(arr);
        }, 250);
      });
      input.addEventListener("keydown", (e) => {
        if (list.style.display === "none") return;
        if (e.key === "ArrowDown") { e.preventDefault(); act = Math.min(opts.length - 1, act + 1); highlight(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(0, act - 1); highlight(); }
        else if (e.key === "Enter") { e.preventDefault(); if (act >= 0) pick(opts[act]); else if (opts.length) pick(opts[0]); }
        else if (e.key === "Escape") { e.stopPropagation(); close(); }
      });
      input.addEventListener("blur", () => { setTimeout(() => { close(); markState(); }, 150); });
      combo.append(input, list);
      lab.append(span, combo, err);
      grid.appendChild(lab);
      if (item.cfg.symbol) input.classList.add("ok");
      return;
    }

    lab.append(span, input);
    if (f.presets) {
      const chips = document.createElement("div");
      chips.className = "chips";
      const chipEls = f.presets.map((p) => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip"; c.textContent = p + "%";
        c.addEventListener("click", () => { input.value = p; input.dispatchEvent(new Event("input", { bubbles: true })); });
        chips.appendChild(c);
        return { el: c, val: p };
      });
      const syncChips = () => { const v = parseFloat(input.value); chipEls.forEach(({ el, val }) => el.classList.toggle("on", v === val)); };
      input.addEventListener("input", syncChips);
      syncChips();
      lab.appendChild(chips);
    }
    const fe = document.createElement("div");
    fe.className = "f-err"; fieldErrs[f.k] = fe;
    lab.appendChild(fe);
    grid.appendChild(lab);
    if (f.k === "fairHigh") {
      // 合理价值注释：紧贴低点/高点输入下方，链接到估值方法介绍页
      const note = document.createElement("p");
      note.className = "quote-note";
      note.style.cssText = "grid-column:1 / -1;margin:0";
      note.innerHTML = t("m_note_html");
      grid.appendChild(note);
    }
  });
  modalForm.appendChild(grid);
}

function openItemModal(item, isNew) {
  modalItem = item; modalIsNew = isNew;
  modalSnapshot = { ...item.cfg }; // 取消时回滚到打开前的状态
  modalTitle.textContent = modalTitleFor(item);
  setSaveState("", "");
  btnModalRemove.classList.toggle("hidden", isNew && !item.id);
  buildItemForm(item);
  modalOverlay.classList.remove("hidden");
  const first = modalForm.querySelector("input");
  if (isNew && first) first.focus();
}
function closeItemModal() {
  if (!modalItem) return;
  const item = modalItem;
  // 新增但从未成功保存 → 丢弃卡片；若有迟到的保存（防抖/在途）落库，用 _discarded 标记兜底删除
  if (modalIsNew && !item.id) {
    item._discarded = true;
    clearTimeout(item._saveT);
    removeChart(item);
  }
  modalItem = null;
  modalOverlay.classList.add("hidden");
}
// 「完成」= 提交：逐字段校验，报错就近显示在对应输入下方
function trySubmitModal() {
  const item = modalItem;
  if (!item) return;
  const c = item.cfg;
  // 仅当全新表单「什么都没动」才视为放弃；否则逐字段校验
  const untouched = modalIsNew && !item.id && !c.symbol && !c.ticker && !(c.fairLow > 0) && !(c.fairHigh > 0);
  if (untouched) { closeItemModal(); return; }
  clearFieldErrs();
  let firstBad = null;
  const flag = (key, msg) => { showFieldErr(key, msg); if (!firstBad) firstBad = key; };
  if (!c.symbol) flag("ticker", t("m_err_symbol"));
  if (!(c.fairLow > 0)) flag("fairLow", t("m_err_low"));
  else if (!(c.fairHigh > c.fairLow)) flag("fairHigh", t("m_err_high"));
  if (!(c.mos > 0 && c.mos < 100)) flag("mos", t("m_err_mos"));
  if (!(c.ext > 0)) flag("ext", t("m_err_ext"));
  if (firstBad) { const el = fieldInputs[firstBad]; if (el) { el.focus(); el.scrollIntoView({ block: "nearest" }); } return; }
  clearTimeout(item._saveT);
  saveItem(item);            // 立即提交（不等防抖）
  modalItem = null;
  modalOverlay.classList.add("hidden");
}
document.getElementById("btnModalDone").addEventListener("click", trySubmitModal);
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeItemModal(); });
document.getElementById("btnModalCancel").addEventListener("click", async () => {
  if (!modalItem) return;
  const item = modalItem;
  clearTimeout(item._saveT); // 丢弃尚未发出的防抖保存
  if (modalIsNew) {
    // 新建取消：整个丢弃（期间已自动创建的也删掉）
    if (item.id) await fetch(`/api/my/items/${item.id}`, { method: "DELETE" });
    removeChart(item);
  } else {
    // 编辑取消：回滚到打开前的值；期间的自动保存用快照覆盖回去
    item.cfg = { ...modalSnapshot };
    item.live = false; item.gotQuote = false;
    if (structValid(item.cfg)) { item.gauge.set(item.cfg, false); renderVerdict(item); saveItem(item); }
    fetchQuotes();
  }
  modalItem = null;
  modalOverlay.classList.add("hidden");
});
btnModalRemove.addEventListener("click", async () => {
  if (!modalItem) return;
  if (!confirm(t("m_confirm_remove"))) return;
  if (modalItem.id) await fetch(`/api/my/items/${modalItem.id}`, { method: "DELETE" });
  removeChart(modalItem);
  modalItem = null;
  modalOverlay.classList.add("hidden");
});

/* ---------- 导航：Watchlist / 宏观看板(置灰) / 设置 ---------- */
const layoutEl = document.querySelector(".layout");
const viewSettings = document.getElementById("viewSettings");
const pageHeadEl = document.querySelector(".page-head");
const btnSettings = document.getElementById("btnSettings");
// 切换视图：标题块（page-head）只属于 Watchlist；设置由右上角齿轮进入
function setView(v) {
  document.querySelectorAll(".nav-tab").forEach((x) => x.classList.toggle("on", x.dataset.view === v));
  btnSettings.classList.toggle("on", v === "settings");
  const isBoard = v === "board";
  layoutEl.classList.toggle("hidden", !isBoard);
  pageHeadEl.classList.toggle("hidden", !isBoard);          // 标题块 + 分享按钮仅 Watchlist 显示（分享在 page-head 内）
  document.getElementById("boardDivider").classList.toggle("hidden", !isBoard); // 隔断带随看板段一起隐藏
  viewSettings.classList.toggle("hidden", v !== "settings");
}
document.querySelectorAll(".nav-tab").forEach((tab) =>
  tab.addEventListener("click", () => { if (!tab.disabled) setView(tab.dataset.view); }));
btnSettings.addEventListener("click", () => setView("settings"));
// 产品名 = 回到 Watchlist（不离开看板）
document.getElementById("brand").addEventListener("click", (e) => { e.preventDefault(); setView("board"); });

/* ---------- 分享 / 看板设置弹窗 ---------- */
const shareOverlay = document.getElementById("shareOverlay");
document.getElementById("btnShare").addEventListener("click", () => shareOverlay.classList.remove("hidden"));
document.getElementById("btnShareDone").addEventListener("click", () => shareOverlay.classList.add("hidden"));
shareOverlay.addEventListener("click", (e) => { if (e.target === shareOverlay) shareOverlay.classList.add("hidden"); });

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!modalOverlay.classList.contains("hidden")) closeItemModal();
    else if (!shareOverlay.classList.contains("hidden")) shareOverlay.classList.add("hidden");
    return;
  }
  // Enter = 提交编辑弹窗（但代码联想下拉打开时让其自行处理，textarea 内不拦截）
  if (e.key === "Enter" && !modalOverlay.classList.contains("hidden")) {
    if (document.querySelector("#modalOverlay .combo-list")) return;
    if ((e.target.tagName || "").toLowerCase() === "textarea") return;
    e.preventDefault();
    trySubmitModal();
  }
});

/* ---------- 页面文案（自动保存 + 本页实时生效） ---------- */
const setEyebrow = document.getElementById("setEyebrow");
const setTitle = document.getElementById("setTitle");
const setSubtitle = document.getElementById("setSubtitle");
const setSaveEl = document.getElementById("setSave");
let setTimer = null;
async function saveSettings() {
  setSaveEl.className = "save-state"; setSaveEl.textContent = t("st_saving");
  try {
    const res = await fetch("/api/my/settings", {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ eyebrow: setEyebrow.value, title: setTitle.value, subtitle: setSubtitle.value }),
    });
    if (res.ok) {
      setSaveEl.className = "save-state ok"; setSaveEl.textContent = t("st_saved");
      applySettings({ eyebrow: setEyebrow.value.trim(), title: setTitle.value.trim(), subtitle: setSubtitle.value.trim() });
    } else { setSaveEl.className = "save-state err"; setSaveEl.textContent = t("st_failed"); }
  } catch { setSaveEl.className = "save-state err"; setSaveEl.textContent = t("st_failed"); }
}
[setEyebrow, setTitle, setSubtitle].forEach((el) =>
  el.addEventListener("input", () => { clearTimeout(setTimer); setTimer = setTimeout(saveSettings, 600); }));

/* ---------- 色块配色 ---------- */
const colSaveEl = document.getElementById("colSave");
let colorState = {};
let colTimer = null;
function currentColorMap() {
  const m = {};
  for (const k of ZONE_KEYS) if (colorState[k]) m[k] = colorState[k];
  return m;
}
function buildColorRows() {
  const wrap = document.getElementById("colorRows");
  wrap.innerHTML = "";
  ZONES.forEach((z) => {
    const cur = colorState[z.key] || DEFAULT_ZONE_COLORS[z.key];
    const row = document.createElement("div");
    row.className = "color-row";
    const lab = document.createElement("span");
    lab.className = "c-lab";
    lab.textContent = `${ZONE_LABELS[z.key] || z.key} · ${z.en}`;
    const picker = document.createElement("input");
    picker.type = "color"; picker.value = cur;
    const hex = document.createElement("input");
    hex.type = "text"; hex.maxLength = 7; hex.spellcheck = false; hex.autocomplete = "off";
    hex.value = cur; hex.placeholder = DEFAULT_ZONE_COLORS[z.key];
    picker.addEventListener("input", () => { hex.value = picker.value; hex.classList.remove("bad"); onColorChange(z.key, picker.value); });
    hex.addEventListener("input", () => {
      const v = hex.value.trim();
      if (HEX_RE.test(v)) { hex.classList.remove("bad"); picker.value = v; onColorChange(z.key, v); }
      else if (v === "") { hex.classList.remove("bad"); onColorChange(z.key, ""); }
      else hex.classList.add("bad");
    });
    row.append(lab, picker, hex);
    wrap.appendChild(row);
  });
}
function onColorChange(key, value) {
  if (value) colorState[key] = value; else delete colorState[key];
  applyZoneColors(currentColorMap());
  items.forEach((i) => i.gauge.repaint());
  clearTimeout(colTimer);
  colTimer = setTimeout(saveColors, 600);
}
async function saveColors() {
  colSaveEl.className = "save-state"; colSaveEl.textContent = t("st_saving");
  const payload = {};
  for (const k of ZONE_KEYS) payload["color_" + k] = colorState[k] || "";
  try {
    const res = await fetch("/api/my/settings", {
      method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(payload),
    });
    colSaveEl.className = res.ok ? "save-state ok" : "save-state err";
    colSaveEl.textContent = res.ok ? t("st_saved") : t("st_failed");
  } catch { colSaveEl.className = "save-state err"; colSaveEl.textContent = t("st_failed"); }
}

/* ---------- 看板设置 ---------- */
const boardNameEl = document.getElementById("boardName");
const boardSlugEl = document.getElementById("boardSlug");
const boardSaveEl = document.getElementById("boardSave");
const boardLinkEl = document.getElementById("boardLink");
let boardTimer = null;
function updateBoardLink(slug) {
  if (slug && SLUG_RE.test(slug)) {
    const url = location.origin + "/b/" + slug;
    boardLinkEl.href = url;
    boardLinkEl.textContent = url;
  } else {
    boardLinkEl.href = "#";
    boardLinkEl.textContent = t("s_slug_invalid");
  }
}
document.getElementById("btnCopyUrl").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  if (!boardLinkEl.href || boardLinkEl.href.endsWith("#")) return;
  try {
    await navigator.clipboard.writeText(boardLinkEl.href);
    const old = btn.textContent;
    btn.textContent = t("s_copied");
    setTimeout(() => { btn.textContent = old; }, 1500);
  } catch { /* 剪贴板不可用时点链接也能打开 */ }
});
async function saveBoard() {
  const name = boardNameEl.value.trim();
  const slug = boardSlugEl.value.trim();
  if (!SLUG_RE.test(slug)) return;
  boardSaveEl.className = "save-state"; boardSaveEl.textContent = t("st_saving");
  try {
    const res = await fetch("/api/my/board", {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, slug }),
    });
    if (res.ok) {
      boardSaveEl.className = "save-state ok"; boardSaveEl.textContent = t("st_saved");
      updateBoardLink(slug);
      if (slug !== boardSlug) {
        boardSlug = slug;
        history.replaceState(null, "", "/b/" + slug); // 地址栏跟随新 slug
      }
    } else {
      let errMsg = t("st_failed");
      try { const b = await res.json(); if (b.error) errMsg = b.error; } catch { /* ignore */ }
      boardSaveEl.className = "save-state err"; boardSaveEl.textContent = errMsg;
    }
  } catch { boardSaveEl.className = "save-state err"; boardSaveEl.textContent = t("st_failed"); }
}
boardSlugEl.addEventListener("input", () => {
  const v = boardSlugEl.value.trim();
  boardSlugEl.classList.toggle("bad", !(v === "" || SLUG_RE.test(v)));
  updateBoardLink(v);
  if (SLUG_RE.test(v)) {
    clearTimeout(boardTimer);
    boardTimer = setTimeout(saveBoard, 600);
  }
});
boardNameEl.addEventListener("input", () => {
  clearTimeout(boardTimer);
  boardTimer = setTimeout(saveBoard, 600);
});

document.getElementById("btnLogout").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  location.reload();
});

/* ---------- 主人模式初始化 ---------- */
function initOwner(settings) {
  // 文案/配色编辑器回填（看板信息从 /api/me 来，已在 init 中确定 slug）
  setEyebrow.value = settings.eyebrow || "";
  setTitle.value = settings.title || "";
  setSubtitle.value = settings.subtitle || "";
  colorState = {};
  for (const k of ZONE_KEYS) if (settings["color_" + k]) colorState[k] = settings["color_" + k];
  buildColorRows();
  // 看板名/slug：取 /api/me（再取一次便宜且总是新鲜）
  fetch("/api/me").then((r) => r.ok ? r.json() : null).then((me) => {
    if (!me || !me.board) return;
    boardNameEl.value = me.board.name || "";
    boardSlugEl.value = me.board.slug || "";
    updateBoardLink(me.board.slug || "");
  }).catch(() => {});
}

init();
setInterval(fetchQuotes, 60000);
</script>
