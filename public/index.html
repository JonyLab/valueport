<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>估值钟摆 · 看板</title>
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* ===== 暖调仪表盘 · 看板页（令牌见 /shared/styles.css 与 DESIGN.md） ===== */
  body{overflow-x:hidden}
  .page{display:flex;flex-direction:column}
  .layout{display:block}
  .btn.icon{flex:none}

  /* ===== 概览区：问候 + 大标题 / 大号统计 / 估值分布胶囊条 ===== */
  .page-head{margin:0 4px 30px}
  .strike-banner{display:flex;align-items:center;gap:10px;margin:-14px 4px 22px;padding:8px 8px 8px 10px;border-radius:var(--r-pill);background:rgba(46,163,93,.09);box-shadow:inset 0 0 0 1px rgba(46,163,93,.18)}
  .strike-banner.hidden,.strike-banner.offview{display:none}
  .sb-ico{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
  /* 一行排下：标题 · 标的胶囊 · 一句提醒（窄屏自动换行） */
  .sb-body{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
  .sb-head{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap}
  .sb-names{display:flex;flex-wrap:wrap;gap:6px}
  .sb-name{border:0;cursor:pointer;font-family:var(--font);font-size:12px;color:#1f7a45;background:#fff;border-radius:var(--r-pill);padding:3px 10px;box-shadow:inset 0 0 0 1px rgba(46,163,93,.25)}
  .sb-name:hover{background:rgba(46,163,93,.12)}
  .sb-say{font-size:12px;color:var(--ink-mute)}
  .sb-close{flex:none;width:26px;height:26px;border:0;border-radius:50%;background:none;color:var(--ink-mute);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
  .sb-close:hover{background:rgba(29,29,27,.06);color:var(--ink)}
  .strike-banner.review{background:rgba(240,140,46,.09);box-shadow:inset 0 0 0 1px rgba(240,140,46,.22)}
  .strike-banner + .strike-banner.review{margin-top:-14px} /* 两条都在时挨着 */
  .strike-banner.review .sb-ico{background:#e08a35}
  .strike-banner.review .sb-name{color:#8a4a17;box-shadow:inset 0 0 0 1px rgba(240,140,46,.3)}
  .strike-banner.review .sb-name:hover{background:rgba(240,140,46,.12)}
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap}
  .hero-main{min-width:0;flex:1 1 360px}
  .hero-main h1{font-size:clamp(36px,5vw,56px);margin:0}
  .hero-main .eyebrow{font-size:15px;margin-bottom:10px}
  .hero-main .sub{margin-top:12px}
  .hero-stats{display:flex;gap:clamp(20px,4vw,52px);flex:none}
  .stat{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:end}
  .stat-ico{grid-row:1;align-self:end;margin-bottom:6px;width:30px;height:30px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
  .stat-ico i{font-size:16px}
  .stat-num{grid-row:1;font-size:clamp(36px,4vw,52px);font-weight:400;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .stat-lab{grid-column:1 / -1;font-size:14px;color:var(--ink-soft);margin-top:6px}
  /* 击球区 / 泡沫区图标底色取自区间色（renderOverview 里按 ZONES 设置，跟随用户自定义配色） */
  .stat.strike .stat-ico,.stat.bubble .stat-ico{color:#fff}

  .hero-main .updated{font-size:13px;color:var(--ink-mute);margin:12px 0 0;min-width:0}
  .hero-main .updated:empty{display:none}
  @media (max-width:640px){
    .hero-stats{width:100%;justify-content:space-between}
  }

  /* ===== 标的卡片：半透明白瓷砖网格 ===== */
  /* 启动中：小标题 / 大标题 / 说明 / 统计数字先画成骨架（看板自定义文案到了再显示，避免默认文案闪一下再变） */
  /* 有会话缓存时页面脚本会立刻画缓存：首帧不画骨架，只把待替换的文案藏起来一瞬 */
  html.has-cache .sk-tile{visibility:hidden}
  html.has-cache body.booting :is(#eyebrow,#title,#sub,.stat-num,#updated){visibility:hidden}
  html:not(.has-cache) body.booting :is(#eyebrow,#title,#sub,.stat-num){color:transparent !important;width:fit-content;max-width:100%;border-radius:10px;
    background:linear-gradient(90deg,rgba(29,29,27,.055) 25%,rgba(29,29,27,.1) 37%,rgba(29,29,27,.055) 63%);background-size:400% 100%;animation:skShimmer 1.4s ease infinite}
  body.booting #updated{visibility:hidden}
  .sk-tile{min-height:196px;justify-content:space-between}
  /* 真实内容替换骨架时淡入（只用于只渲染一次的块；会反复重绘的估值研究面板不加，避免每次操作都闪） */
  .chart-item:not(.sk-tile),.vd-cols,.p-fund > .fd-sec{animation:skIn .28s ease both}
  @media (prefers-reduced-motion:reduce){ .chart-item:not(.sk-tile),.vd-cols,.p-fund > .fd-sec{animation:none} }
  .charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:16px;
    background:none;border:0;border-radius:0;margin:0;padding:0;box-shadow:none;max-width:none}
  .chart-item{position:relative;display:flex;flex-direction:column;gap:18px;padding:22px 22px 18px;
    background:var(--card);border:1px solid var(--card-edge);border-radius:var(--r-xl);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s,background .2s}
  .chart-item[style*="cursor"]:hover{transform:translateY(-2px);background:rgba(255,255,255,.78);
    box-shadow:0 1px 2px rgba(60,50,20,.05),0 18px 40px -18px rgba(60,50,20,.28)}
  .chart-info{min-width:0}
  .ci-id{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-width:0;padding-right:84px}
  /* 标的 logo：圆形，首字母占位；图片加载后填满（白底，透明 logo 也清楚） */
  .ci-logo,.vd-avatar,.peer-av,.vc-prof-av{overflow:hidden;flex:none}
  .ci-logo img,.vd-avatar img,.peer-av img,.vc-prof-av img{width:100%;height:100%;object-fit:contain;display:block}
  .has-img{background:#fff !important;box-shadow:inset 0 0 0 1px var(--divider)}
  .ci-logo{width:36px;height:36px;border-radius:50%;background:var(--track-edge);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
  .ci-name{font-size:20px;font-weight:400;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci-idtext{display:flex;flex-direction:column;gap:3px;min-width:0} /* 名称一行、代码一行 */
  .ci-name{line-height:1.15}
  .ci-code{font-size:12px;line-height:1.2;color:var(--ink-mute)}
  .chart-info .verdict{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;text-align:left;margin:0;line-height:1}
  .chart-info .verdict .px{font-size:44px;font-weight:400;letter-spacing:-.035em}
  .chart-info .verdict .lbl{position:relative;top:-8.25px; /* 标签底边落在价格基线上 */
    display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:var(--r-pill);
    background:var(--track);font-size:12.5px;font-weight:500;color:var(--ink-soft)}
  .chart-info .verdict.v-under .lbl{background:rgba(31,143,84,.12);color:var(--green)}
  .chart-info .verdict.v-over .lbl{background:rgba(198,65,65,.10);color:var(--red)}
  .chart-bar{width:100%}
  /* 五段胶囊条（钟摆展平） */
  .vbar{width:100%}
  .vbar-labels{display:flex;gap:4px;font-size:11.5px;color:var(--ink-mute);margin-bottom:8px}
  .vbar-labels span{flex:1;text-align:center;transition:color .35s}
  .vbar-track{position:relative;display:flex;gap:4px;height:12px}
  .vbar-seg{flex:1;border-radius:var(--r-pill);background:var(--track);transition:background .4s ease}
  .vbar-marker{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:4px;background:var(--hub);
    box-shadow:0 0 0 2px rgba(255,255,255,.9)}
  .vbar-ticks{position:relative;height:14px;margin-top:9px}
  .vbar-tick{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  .vbar.is-empty .vbar-seg{background:transparent !important}
  .vbar.is-empty .vbar-track{border-radius:var(--r-pill);background-image:var(--hatch)}
  .vbar-empty{position:absolute;inset:-6px 0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .vbar-empty::before{content:attr(data-t);padding:2px 10px;border-radius:var(--r-pill);background:rgba(255,255,255,.92);font-size:11px;color:var(--ink-soft)}
  .vbar.is-empty .vbar-empty{font-size:0}
  @media (max-width:560px){
    .chart-info .verdict .px{font-size:38px}
  }

  /* 卡片右上角：圆形 ↗ 详情 + 编辑 */
  .card-actions{position:absolute;top:16px;right:16px;z-index:5;display:flex;gap:6px}
  .card-actions .btn{background:rgba(255,255,255,.85)}
  .card-actions .btn:hover{background:#fff}
  .card-actions .btn.edit{opacity:0;transition:opacity .15s}
  .chart-item:hover .card-actions .btn.edit,.card-actions:focus-within .btn.edit{opacity:1}
  @media (hover:none){ .card-actions .btn.edit{opacity:1} }
  /* 「添加」瓷砖：虚线胶囊框 */
  .add-card{min-height:200px;border:1.5px dashed rgba(29,29,27,.12);border-radius:var(--r-xl);background:rgba(255,255,255,.22);
    color:var(--ink-soft);font-size:15px;font-weight:400;cursor:pointer;font-family:var(--font);
    transition:background .15s,color .15s,border-color .15s}
  .add-card{display:flex;align-items:center;justify-content:center;gap:8px}
  .add-card i{font-size:18px}
  .add-card:hover{background:rgba(255,255,255,.55);color:var(--ink);border-color:rgba(29,29,27,.4)}
  .charts-empty{grid-column:1 / -1;padding:64px 0;text-align:center;color:var(--ink-mute);font-size:15px;
    background:var(--card);border-radius:var(--r-xl)}

  /* ===== 表单补充（看板页专用） ===== */
  .field input.plain{font-family:var(--font)}
  .field input:not(.plain){font-family:var(--mono);font-size:14px}
  .save-state{font-size:12.5px;color:var(--ink-mute);margin-left:8px}
  .save-state.ok{color:var(--green)} .save-state.err{color:var(--red)}
  .valpick{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .valpick-lab{font-size:12.5px;color:var(--ink-mute)}
  .valpick-row{display:flex;gap:6px;flex-wrap:wrap}
  .valpick-chip{appearance:none;font-family:var(--font);font-size:12.5px;font-weight:500;padding:6px 13px;
    border-radius:var(--r-pill);border:0;background:var(--track);color:var(--ink-soft);cursor:pointer;
    display:inline-flex;align-items:baseline;gap:7px;transition:background .12s,color .12s}
  .valpick-chip:hover{background:var(--track-edge);color:var(--ink)}
  .valpick-chip.on{background:var(--sun);color:var(--sun-ink)}
  .valpick-chip .vp-rng{font-family:var(--mono);font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}

  /* ===== 弹窗 ===== */
  .overlay{position:fixed;inset:0;background:rgba(40,36,25,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:90;display:flex}
  .overlay.hidden{display:none}
  .modal{margin:auto;width:min(460px,calc(100vw - 32px));background:#fbfaf6;border-radius:var(--r-xl);
    box-shadow:0 40px 100px -30px rgba(40,35,20,.5);padding:0 24px;max-height:88vh;overflow:auto;overscroll-behavior:none}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin:0 -24px 18px;padding:22px 24px 0}
  .modal-title{font-size:22px;font-weight:400;letter-spacing:-.01em;font-family:var(--font)}
  .modal-err{font-size:12.5px;color:var(--red);margin-top:10px;display:none}
  .ve-confirm{padding:24px}
  .ve-confirm-msg{margin:10px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink-soft)}
  .ve-confirm-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
  .ve-confirm-acts .btn:disabled{opacity:.4;cursor:default}
  .modal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px -24px 0;padding:16px 24px 20px;
    border-top:1px dashed var(--border)}

  /* 估值编辑器视图头部 */
  .ve-head{padding-bottom:12px;margin-bottom:12px}
  .ve-back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.6);font-size:13.5px;color:var(--ink-soft);text-decoration:none}
  .ve-back:hover{color:var(--ink);background:#fff}
  .ve-titlerow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .ve-title{font-weight:400;font-size:26px;letter-spacing:-.01em;color:var(--ink)}
  .vc{max-width:none}
  @media (max-width:860px){ .vc-singles-grid{grid-template-columns:1fr} }

  /* ===== 设置视图 / 标的详情视图（身份区 + 主栏[关键数据/tabs] + 侧栏[钟摆/同看板]） ===== */
  .view-detail{padding:0}
  .view-detail.view-valedit{padding:0}
  .vd-backrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .vd-back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.6);border:1px solid var(--card-edge);font-size:13.5px;color:var(--ink-soft);text-decoration:none}
  .vd-back:hover{color:var(--ink);background:#fff}
  .vd-pendhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .vd-pendedit{background:var(--track) !important;color:var(--ink-soft) !important;font-size:16px}
  .vd-pendedit:hover{background:var(--track-edge) !important;color:var(--ink) !important}
  .vd-backrow-right{display:flex;align-items:center;gap:8px}
  .ve-head-right{margin-left:auto}
  /* 身份区 */
  /* 第一行名称（主），第二行 代码徽章 + 市场 · 交易所 · 币种（次） */
  .vd-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;margin:0 4px 26px}
  .vd-avatar{width:60px;height:60px;border-radius:50%;background:var(--dark);color:var(--sun);display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:500;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
  .vd-heroid{min-width:0}
  .vd-name{font-size:clamp(26px,3vw,34px);font-weight:500;line-height:1.15;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vd-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--ink-mute)}
  .vd-code{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--track);border-radius:var(--r-pill);padding:2px 9px}
  .vd-quote{display:grid;grid-template-columns:auto auto;align-items:baseline;justify-items:end;column-gap:12px;row-gap:8px}
  .vd-price{grid-row:1 / 3;align-self:end;margin-bottom:-.133em; /* 基线落在网格底边：右侧标签底部与数字视觉底部对齐 */font-weight:400;font-size:clamp(44px,5vw,64px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .vd-chg{font-size:14px;font-weight:500;color:var(--ink-mute);font-variant-numeric:tabular-nums;justify-self:start}
  .vd-chg.up{color:var(--green)} .vd-chg.down{color:var(--red)}
  .vd-chg:empty{display:none}
  .vd-verdict{justify-self:start;align-self:end;display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:var(--r-pill);
    background:var(--track);font-size:12.5px;font-weight:500;color:var(--ink-soft)}
  .vd-verdict.v-under{color:var(--green);background:rgba(31,143,84,.12)} .vd-verdict.v-over{color:var(--red);background:rgba(198,65,65,.10)}
  /* 两栏 */
  .vd-cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
  .vd-maincol,.vd-side{display:flex;flex-direction:column;gap:16px;min-width:0}
  .vd-side{position:sticky;top:16px}
  .vd-card{background:var(--card);border:1px solid var(--card-edge);border-radius:var(--r-xl);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:22px 24px}
  .vd-cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .vd-cardtitle{font-size:20px;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
  /* 我的持仓 */
  .vd-hold-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .vd-hold-link{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;color:var(--ink-mute);text-decoration:none}
  .vd-hold-link:hover{color:var(--ink)}
  .vd-hold-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .vd-hold-v{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .vd-hold-cur{font-size:12px;color:var(--ink-mute);margin-left:6px;letter-spacing:0}
  .vd-hold-pnl{font-size:15px;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:var(--r-pill);background:var(--track);color:var(--ink-soft)}
  .vd-hold-pnl.up{color:var(--green);background:rgba(31,143,84,.1)} .vd-hold-pnl.down{color:var(--red);background:rgba(198,65,65,.08)}
  .vd-hold-rows .vc-kv-v.up{color:var(--green)} .vd-hold-rows .vc-kv-v.down{color:var(--red)}
  .vd-hold-note{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;color:var(--ink-soft)}
  .vd-hold-note i{width:8px;height:8px;border-radius:50%;flex:none}
  .vd-hold-plan{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:rgba(29,29,27,.035)}
  .vd-hold-plan.over,.vd-hold-plan.under{background:rgba(240,140,46,.07)}
  .vd-hold-planline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-soft)}
  .vd-hold-drift{font-size:12px;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:var(--r-pill);background:var(--track);color:var(--ink-soft)}
  .vd-hold-drift.over{background:rgba(240,140,46,.16);color:#a4561a} .vd-hold-drift.under{background:rgba(58,115,238,.12);color:#2c5bc4}
  .vd-hold-say{margin-top:6px;font-size:13px;color:var(--ink)}
  .vd-hold-say.trimHot{color:var(--red)} .vd-hold-say.addCheap,.vd-hold-say.buildCheap{color:var(--green)} .vd-hold-say.ok{color:var(--ink-mute)}
  .vd-hold-how{margin-top:3px;font-size:12px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .vd-hold-accs{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:5px}
  .vd-hold-acc{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .vd-cardsub{font-size:13px;line-height:1.55;color:var(--ink-mute);margin:6px 0 14px}
  /* 关键数据 */
  .ks-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
  .ks-cell{display:flex;flex-direction:column;gap:8px;padding:14px 16px 14px 0;border-top:1px dashed var(--border)}
  .ks-cell:nth-child(-n+4){border-top:0;padding-top:0}
  .ks-k{font-size:13px;color:var(--ink-mute)}
  .ks-v{display:flex;align-items:center;gap:7px;font-size:22px;font-weight:400;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums}
  .ks-v small{font-size:12px;color:var(--ink-mute);font-weight:400;letter-spacing:0}
  /* tabs 卡 */
  .vd-main{min-width:0;margin-top:6px}
  /* 侧栏：钟摆 + 同看板 */
  .vd-gauge{width:100%}
  .vd-gauge svg{display:block;width:100%;height:auto;overflow:visible}
  .peer-list{display:flex;flex-direction:column}
  .peer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px dashed var(--border);
    background:none;cursor:pointer;text-align:left;font-family:var(--font);color:var(--ink)}
  .peer:first-child{border-top:0;padding-top:0}
  .peer:hover .peer-name{text-decoration:underline;text-underline-offset:3px}
  .peer-av{width:36px;height:36px;border-radius:50%;background:var(--track-edge);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:var(--ink-soft)}
  .peer-id{display:flex;flex-direction:column;gap:3px;min-width:0}
  .peer-name{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .peer-code{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .peer-q{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .peer-px{font-size:15px;font-variant-numeric:tabular-nums}
  .peer-v{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--r-pill);background:var(--track);color:var(--ink-soft);white-space:nowrap}
  .peer-v.v-under{color:var(--green);background:rgba(31,143,84,.12)} .peer-v.v-over{color:var(--red);background:rgba(198,65,65,.10)}
  body.vd-mode .topnav,body.ve-mode .topnav{display:none} /* 详情页/添加估值页不要网站 header(用返回导航) */
  @media (max-width:1100px){
    .vd-cols{grid-template-columns:1fr}
    .vd-side{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  }
  @media (max-width:760px){
    .vd-hero{grid-template-columns:auto minmax(0,1fr);gap:14px}
    .vd-avatar{width:54px;height:54px;font-size:22px}
    .vd-quote{grid-column:1 / -1;justify-items:start;justify-content:start}
    .ks-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ks-cell:nth-child(-n+4){border-top:1px dashed var(--border);padding-top:14px}
    .ks-cell:nth-child(-n+2){border-top:0;padding-top:0}
    .vd-card{padding:18px 16px}
  }
  .vge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:180px;padding:20px 0;text-align:center}
  .vge-bar{width:188px;height:12px;margin-bottom:2px;border-radius:var(--r-pill);background-image:var(--hatch)}
  .vge-title{font-size:15px;font-weight:500;color:var(--ink)}
  /* 估值研究空态：图标 + 标题 + 说明 + 主行动 */
  .vempty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 24px 44px}
  .vempty-icon{width:60px;height:60px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;background:var(--sun);color:var(--sun-ink);margin-bottom:18px}
  .vempty-icon i{font-size:28px}
  .vempty-title{font-size:20px;font-weight:400;color:var(--ink);letter-spacing:-.01em}
  .vempty-sub{font-size:13px;line-height:1.65;color:var(--ink-mute);max-width:392px;margin:8px 0 20px}
  .vempty-cta{height:44px;padding:0 26px;font-family:var(--font);font-size:14px;font-weight:500;color:#fff;background:var(--dark);border:0;border-radius:var(--r-pill);cursor:pointer}
  .vempty-cta:hover{background:#000}
  .vempty-link{margin-top:13px;font-size:12.5px;color:var(--ink-mute);text-decoration:underline;text-underline-offset:2px}
  .vempty-link:hover{color:var(--ink-soft)}
  .vge-method,.vempty-link{display:inline-flex;align-items:center;gap:4px}
  .vge-add{margin-top:4px}
  .vge-method{margin-top:6px;font-size:12px;color:var(--ink-mute);text-decoration:underline;text-underline-offset:2px}
  .vge-method:hover{color:var(--ink-soft)}
  .vd-tabs{display:flex;gap:4px;width:fit-content;margin:0 0 16px;padding:5px;position:sticky;top:12px;z-index:3;
    background:rgba(255,255,255,.6);border:1px solid var(--card-edge);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:var(--r-pill)}
  /* tab 内各分节即卡片：与「关键数据」等同一套卡片样式 */
  .fd-sec,.vdist-tile,.p-fin,.p-val,.p-fund > .fd-empty{background:var(--card);border:1px solid var(--card-edge);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .p-fin{border-radius:var(--r-xl);padding:22px 24px}
  .p-fund > .fd-empty{border-radius:var(--r-xl);padding:40px 24px;text-align:center}
  /* 估值研究 tab：对照图 + 估值卡片放在同一张大卡里，上下用虚线分段；估值卡片是卡内的浅灰格子 */
  .p-val{border-radius:var(--r-xl);padding:22px 24px 24px}
  .p-val > .vsec-head{margin-top:24px;padding-top:22px;border-top:1px dashed var(--border)}
  .p-val > .vsec-head:first-child{margin-top:0;padding-top:0;border-top:0}
  .vd-tab{height:38px;padding:0 18px;border:0;background:none;cursor:pointer;font-family:var(--font);font-size:14px;font-weight:400;color:var(--ink-soft);border-radius:var(--r-pill);transition:background .15s,color .15s}
  .vd-tab:hover{color:var(--ink);background:rgba(29,29,27,.05)}
  .vd-tab.on{color:#fff;background:var(--dark)}
  .vd-panel{display:none} .vd-panel.on{display:block}
  .vd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px}
  .vd-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
  .vd-row .k{color:var(--ink-soft);font-size:13.5px}
  .vd-row .v{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
  .vd-empty{color:var(--ink-mute);font-size:13.5px;padding:24px 0}
  .vd-method{display:inline-block;margin-top:16px;font-size:13px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}
  /* ===== 估值工作台（添加 / 编辑估值）：① 选择估值方法页 → ② 两栏工作台（中 结果 + 假设格子 / 右 标的 + 数据 + 明细 + 保存），各栏独立滚动 ===== */
  body.ve-mode{overflow:hidden}
  body.ve-mode .page{height:100vh;min-height:0}
  body.ve-mode #viewValEdit{display:flex;flex:1 1 auto;min-height:0;overflow:hidden;padding:0;flex-direction:column}
  .view-valedit .ve-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:0;margin-bottom:18px;flex:0 0 auto}
  .view-valedit .ve-back{margin-bottom:0}
  .view-valedit .ve-titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .view-valedit .ve-title{font-size:24px;line-height:1.2;letter-spacing:-.015em} /* 工作页标题：和返回按钮同一行、不抢内容 */
  .vc-mount{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .vc-workbench{display:grid;grid-template-columns:minmax(420px,5fr) minmax(0,7fr);gap:22px;padding-bottom:40px;color:var(--ink);flex:1 1 auto;min-height:0}
  /* 栏头：左「关键假设」= 输入，右「估值结论」= 输出 */
  .vc-colhead{display:flex;flex-direction:column;gap:3px}
  .vc-colhead-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--ink)}
  .vc-colhead-title::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-mute)}
  .vc-results .vc-colhead-title::before{background:var(--sun)}
  .vc-colhead-sub{font-size:12.5px;color:var(--ink-mute);padding-left:16px}
  .vc-col{min-height:0;min-width:0;overflow:auto;padding-bottom:24px;scrollbar-width:thin}

  /* 选择估值方法：弹窗（新增时自动弹出；「更换方法」再次打开） */
  .vc-picker{position:fixed;inset:0;z-index:95;display:flex;padding:24px;background:rgba(40,36,25,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .vc-picker[hidden]{display:none}
  .vc-picker-modal{margin:auto;width:min(980px,100%);max-height:min(860px,calc(100vh - 48px));overflow:auto;overscroll-behavior:contain;
    background:#fbfaf6;border-radius:var(--r-xl);box-shadow:0 40px 100px -30px rgba(40,35,20,.5);padding:26px 28px 28px}
  .vc-picker-head{margin:0 0 22px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .vc-picker-top{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .vc-picker-close{background:var(--track) !important}
  .vc-picker-close:hover{background:var(--track-edge) !important}
  .vc-picker-title{font-size:24px;font-weight:400;letter-spacing:-.015em}
  .vc-picker-sub{max-width:760px;font-size:14px;line-height:1.7;color:var(--ink-soft)}
  .vc-picker-warn{font-size:13px;color:var(--sun-ink);background:rgba(246,207,74,.28);border-radius:var(--r-pill);padding:5px 12px}
  .vc-pgroups{display:flex;flex-direction:column;gap:22px}
  .vc-pgroup-lab{font-size:13px;color:var(--ink-mute);margin:0 4px 10px}
  .vc-pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px}
  .vc-pcard{position:relative;display:flex;flex-direction:column;gap:8px;min-height:104px;padding:16px 18px;border:1px solid var(--divider);border-radius:var(--r-lg);
    background:#fff;cursor:pointer;text-align:left;font-family:var(--font);color:var(--ink);
    transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s,border-color .2s}
  .vc-pcard:hover{transform:translateY(-2px);border-color:transparent;box-shadow:0 1px 2px rgba(60,50,20,.05),0 14px 30px -16px rgba(60,50,20,.3)}
  .vc-pcard:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
  .vc-pcard.on{border-color:transparent;box-shadow:0 0 0 2px var(--sun)}
  .vc-pcard-title{font-size:17px;font-weight:400;letter-spacing:-.01em}
  .vc-pcard-sub{font-size:13px;line-height:1.6;color:var(--ink-soft)}
  .vc-pcard-cur{display:none;position:absolute;top:16px;right:16px;font-size:11px;font-weight:500;color:var(--sun-ink);background:var(--sun);border-radius:var(--r-pill);padding:2px 8px}
  .vc-pcard.on .vc-pcard-cur{display:block}
  /* AI 推荐方法：弹窗顶部一行按钮 + 结论；被推荐的卡片底部挂徽章与理由，首选带暖黄底 */
  .vc-picker-ai{display:flex;flex-direction:column;align-items:flex-start;gap:10px;align-self:stretch}
  .vc-picker-ai[hidden]{display:none}
  .vc-picker-aibtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px;border:0;border-radius:var(--r-pill);background:var(--dark);color:#fff;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500}
  .vc-picker-aibtn i{color:var(--sun);font-size:15px}
  .vc-picker-aibtn:hover{background:#000}
  .vc-picker-aibtn[hidden]{display:none}
  .vc-picker-aibtn.busy{cursor:default;opacity:.85}
  .vc-picker-aibtn.busy i{animation:vcSpin 1s linear infinite}
  @keyframes vcSpin{to{transform:rotate(360deg)}}
  .vc-picker-aiout{display:none;align-self:stretch;gap:14px;align-items:flex-start;padding:16px 20px 16px 16px;border-radius:var(--r-lg);
    background:linear-gradient(135deg,rgba(246,207,74,.34),rgba(246,207,74,.14));box-shadow:inset 0 0 0 1px rgba(246,207,74,.55)}
  .vc-picker-aiout.on{display:flex}
  .vc-picker-aiout.error{display:block;background:rgba(198,65,65,.07);box-shadow:none;color:var(--red);font-size:13.5px}
  .vc-picker-aibadge{flex:none;width:34px;height:34px;border-radius:50%;background:var(--dark);color:var(--sun);display:flex;align-items:center;justify-content:center;font-size:16px}
  .vc-picker-aibody{min-width:0;display:flex;flex-direction:column;gap:4px}
  .vc-picker-ailab{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--sun-ink)}
  .vc-picker-aitxt{font-size:14.5px;line-height:1.75;color:var(--ink)}
  .vc-picker-biz{margin:10px 0 12px;padding:12px 14px;border-radius:var(--r-md);background:rgba(255,255,255,.7)}
  .vc-picker-biz-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .vc-picker-biz-lab{font-size:12px;font-weight:600;color:var(--ink-soft)}
  .vc-picker-biz-type{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--r-pill);background:var(--dark);color:var(--sun);font-size:11.5px;font-weight:500}
  .vc-picker-biz-row{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:10px;padding:5px 0;border-top:1px dashed var(--border);font-size:13px;line-height:1.6}
  .vc-picker-biz-row:first-of-type{border-top:0}
  .vc-picker-biz-k{color:var(--ink-mute)}
  .vc-picker-biz-v{color:var(--ink)}
  .vc-picker-aipicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .vc-picker-aipick{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 6px;border:0;border-radius:var(--r-pill);background:#fff;
    box-shadow:inset 0 0 0 1px rgba(246,207,74,.6);cursor:pointer;font-family:var(--font);font-size:13px;color:var(--ink);transition:box-shadow .15s,transform .15s}
  .vc-picker-aipick:hover{box-shadow:inset 0 0 0 1px var(--sun),0 0 0 3px rgba(246,207,74,.3)}
  .vc-picker-aipick i{font-size:14px;color:var(--ink-mute)}
  .vc-picker-aipick-role{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-pill);background:var(--track);font-size:11.5px;color:var(--ink-soft)}
  .vc-picker-aipick.primary{background:var(--dark);color:#fff;box-shadow:none}
  .vc-picker-aipick.primary .vc-picker-aipick-role{background:var(--sun);color:var(--sun-ink);font-weight:500}
  .vc-picker-aipick.primary i{color:var(--sun)}
  .vc-picker-refs{margin-top:8px;font-size:12.5px;color:var(--ink-soft)}
  .vc-picker-refs summary{cursor:pointer;color:var(--sun-ink);font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:4px}
  .vc-picker-refs summary::-webkit-details-marker{display:none}
  .vc-picker-refs summary::after{content:"▾";font-size:11px}
  .vc-picker-refs[open] summary::after{content:"▴"}
  .vc-picker-refs ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;line-height:1.6}
  .vc-pcard.ai-primary{background:#fffbea}
  .vc-pcard-ai{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--border)}
  .vc-pcard-aibadge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--sun-ink);background:var(--sun);border-radius:var(--r-pill);padding:2px 9px}
  .vc-pcard:not(.ai-primary) .vc-pcard-aibadge{background:var(--track);color:var(--ink-soft)}
  .vc-pcard-reason{font-size:12.5px;line-height:1.55;color:var(--ink)}

  /* 中栏：方法标题 */
  /* 左栏：输入（浅灰格子 + 半透明卡），右栏：结论（一整张白卡） */
  /* 两栏同一种整卡外壳、等高、各自内部滚动（左右对称，不会被视口硬切）；栏内用分隔线分段，不再卡片叠卡片 */
  .vc-inputs,.vc-results{display:flex;flex-direction:column;gap:22px;align-self:stretch;background:rgba(255,255,255,.86);border:1px solid var(--card-edge);
    border-radius:var(--r-xl);box-shadow:0 1px 2px rgba(60,50,20,.05),0 18px 40px -24px rgba(60,50,20,.32);padding:22px 26px 26px}
  /* 阴影向下最多延伸 18+40-24=34px，外层 padding-bottom:40px 留足，不会被 overflow:hidden 切出直线 */
  .vc-inputs > .vc-prof-sec,.vc-inputs .vc-form > .vc-card{padding-top:22px;border-top:1px dashed var(--border)}
  .vc-inputs .vc-card{background:none;border:0;border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
  .vc-inputs .vc-card-head{margin-left:0;margin-right:0}
  .vc-method-head{padding:2px 2px 0}
  .vc-colhead-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .vc-method-lab{font-size:12px;color:var(--ink-mute);margin-bottom:4px}
  .vc-method-row{display:flex;align-items:center;gap:12px}
  .vc-method-name{flex:1;min-width:0;font-size:22px;font-weight:400;letter-spacing:-.015em;line-height:1.25}
  .vc-method-change{flex:none}
  .vc-method-change{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 13px;border:0;border-radius:var(--r-pill);
    background:var(--track);cursor:pointer;font-family:var(--font);font-size:12.5px;color:var(--ink-soft);transition:background .15s,color .15s}
  .vc-method-change:hover{background:var(--track-edge);color:var(--ink)}
  .vc-method-desc{margin-top:6px;font-size:13.5px;line-height:1.6;color:var(--ink-soft)}
  /* 中栏：大号结果（参考稿的 264.00 hrs / $2,647）+ 区间 vs 现价条 */
  .vc-hero{padding:0}
  .vc-point-hint{margin-top:10px;font-size:12.5px;color:var(--ink-mute)}
  .vc-summary-label{font-size:13px;color:var(--ink-mute);margin-bottom:6px}
  .vc-hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .vc-hero-nums{display:flex;align-items:baseline;flex-wrap:wrap;min-width:0}
  .vc-rnums{display:flex;align-items:baseline;color:var(--ink);font-variant-numeric:tabular-nums}
  .vc-rlow,.vc-rhigh,.vc-rdash{font-size:clamp(44px,4.6vw,64px);font-weight:400;letter-spacing:-.04em;line-height:1.05}
  .vc-rdash{padding:0 .1em;color:var(--ink-mute)}
  .vc-rnow{font-size:clamp(20px,2vw,26px);color:var(--ink-mute);letter-spacing:-.01em;margin-left:10px;font-variant-numeric:tabular-nums}
  .vc-summary-empty{font-size:14px;line-height:1.7;color:var(--ink-mute);max-width:520px;padding:6px 0}
  .vc-rverdict{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:var(--r-pill);background:var(--track);font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:8px}
  .vc-rverdict.v-under{color:var(--green);background:rgba(31,143,84,.12)} .vc-rverdict.v-over{color:var(--red);background:rgba(198,65,65,.10)}
  .vc-rangeviz{margin:38px 0 26px;padding:0 4px}
  .vc-rv-track{position:relative;height:12px;border-radius:var(--r-pill);background-color:rgba(255,255,255,.5);background-image:var(--hatch)}
  .vc-rv-band{position:absolute;top:0;bottom:0;border-radius:var(--r-pill);background:var(--sun)}
  .vc-rv-now{position:absolute;top:-8px;bottom:-8px;width:3px;margin-left:-1.5px;border-radius:3px;background:var(--dark)}
  .vc-rv-tag{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px);white-space:nowrap;font-size:11.5px;font-weight:500;color:#fff;background:var(--dark);border-radius:var(--r-pill);padding:3px 9px;font-variant-numeric:tabular-nums}
  .vc-rv-end{position:absolute;top:100%;margin-top:9px;transform:translateX(-50%);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  /* 单点估值（保守 = 乐观）：色带宽度为 0 看不见，改画一个估值标记 + 下方标签 */
  .vc-rv-fair{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px #fff,0 2px 6px rgba(60,50,20,.25)}
  .vc-rv-fairtag{position:absolute;top:100%;margin-top:12px;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:500;color:var(--sun-ink);background:var(--sun);border-radius:var(--r-pill);padding:3px 9px;font-variant-numeric:tabular-nums}

  /* 中栏：假设区——一张大卡里按组排格子（参考稿的日历格） */
  .vc-form{display:flex;flex-direction:column;gap:22px}
  .vc-empty-method{color:var(--ink-mute);font-size:14px;padding:18px 4px}
  .vc-modes{display:flex;gap:4px;background:rgba(255,255,255,.55);border:1px solid var(--card-edge);border-radius:var(--r-pill);padding:4px;width:fit-content;flex-wrap:wrap}
  .vc-modetab{appearance:none;background:none;border:0;height:34px;padding:0 15px;font-family:var(--font);font-size:13px;color:var(--ink-soft);border-radius:var(--r-pill);cursor:pointer}
  .vc-modetab:hover{color:var(--ink)}
  .vc-modetab.on{background:var(--dark);color:#fff}
  .vc-card{background:var(--card);border:1px solid var(--card-edge);border-radius:var(--r-xl);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:18px 18px 18px;margin:0}
  .vc-card-head{font-size:16px;font-weight:500;color:var(--ink);margin:0 4px 14px}
  /* 单值字段：两列格子 */
  .vc-singles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .vc-singles-grid .vc-card-head{grid-column:1/-1;margin-bottom:6px}
  .vc-fld{min-width:0;background:rgba(29,29,27,.035);border-radius:var(--r-md);padding:12px 14px}
  /* 保守/乐观双值：每个假设一行格子 */
  .vc-arow{display:grid;grid-template-columns:minmax(0,1fr) 108px 108px;gap:8px;align-items:center;padding:10px 12px;margin-bottom:6px;
    background:rgba(29,29,27,.035);border-radius:var(--r-md)}
  .vc-arow:last-child{margin-bottom:0}
  .vc-arow-head{background:none;padding:0 12px 2px;margin-bottom:2px}
  .vc-arow .vc-ref,.vc-arow .vc-guide{margin-top:0}
  .vc-chead{font-size:12px;color:var(--ink-mute);text-align:center}
  .vc-flabel,.vc-label{font-size:13px;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:2px;min-width:0}
  .vc-arow .vc-label{margin-bottom:0}
  .vc-unit{color:var(--ink-mute);margin-left:3px}
  .vc-period{margin-left:8px;font-size:10.5px;font-weight:500;color:var(--ink-mute);background:rgba(255,255,255,.8);border-radius:var(--r-pill);padding:1px 7px;font-family:var(--mono);white-space:nowrap}
  .vc-input{height:40px;padding:0 12px;width:100%;border:0;border-radius:var(--r-sm);background:#fff;box-shadow:inset 0 0 0 1px var(--divider);
    font-family:var(--font);font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;transition:box-shadow .15s}
  .vc-input::-webkit-outer-spin-button,.vc-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .vc-input::placeholder{color:var(--ink-mute);font-size:12.5px}
  .vc-input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--ring-border),0 0 0 4px var(--ring)}
  .vc-driven .vc-input{background:transparent;box-shadow:inset 0 0 0 1px var(--divider);color:var(--ink-mute)}
  .vc-info{margin-left:4px;border:0;background:none;color:var(--ink-mute);font-size:14px;cursor:pointer;padding:0;line-height:1;display:inline-flex}
  .vc-info:hover{color:var(--ink)}
  .vc-guide{grid-column:1 / -1;margin:8px 0 0;padding:10px 12px;background:rgba(246,207,74,.2);border-radius:var(--r-sm);font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
  .vc-ref{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
  .vc-refchip{border:0;background:rgba(255,255,255,.85);border-radius:var(--r-pill);height:26px;padding:0 10px;font-family:var(--font);font-size:11.5px;color:var(--ink-soft);cursor:pointer;transition:background .12s,color .12s}
  .vc-refchip:hover{background:#fff;color:var(--ink)}
  .vc-refrange{background:var(--sun-soft);color:var(--sun-ink)}
  .vc-refrange:hover{background:var(--sun);color:var(--sun-ink)}
  .vc-refq{background:none;box-shadow:inset 0 0 0 1px var(--border);color:var(--ink-mute)}
  .vc-srclink{display:inline-flex;margin-left:2px;color:var(--ink-mute);text-decoration:none;font-size:13px;cursor:pointer}
  .vc-srclink:hover{color:var(--ink)}
  .vc-deriv{margin-top:8px}
  .vc-deriv-toggle{appearance:none;display:inline-flex;align-items:center;gap:3px;background:none;border:0;padding:0 4px;cursor:pointer;font-family:var(--font);font-size:12.5px;color:var(--ink-soft);font-weight:500}
  .vc-deriv-toggle:hover{color:var(--ink)}
  .vc-deriv-body{margin-top:8px;padding:12px;border:1px dashed var(--border);border-radius:var(--r-md);background:rgba(255,255,255,.6);display:grid;gap:8px}
  .vc-deriv-out{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:2px}
  .vc-deriv-tip{font-size:12px;color:var(--ink-mute);line-height:1.6}
  /* 分部 / 资产明细 */
  .vc-seg{border:0;border-radius:var(--r-lg);padding:14px;margin-bottom:12px;background:rgba(29,29,27,.035)}
  .vc-seg-head{display:flex;align-items:center;justify-content:space-between}
  .vc-seg-title{font-size:14px;font-weight:500;color:var(--ink)}
  .vc-seg-togglab{font-size:12px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .vc-seg-body{margin-top:10px;display:grid;gap:10px}
  .vc-seg-hero{font-weight:500;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .vc-seg-add{appearance:none;display:inline-flex;align-items:center;gap:4px;background:none;border:1.5px dashed var(--node);border-radius:var(--r-pill);height:32px;padding:0 13px;font-family:var(--font);font-size:12.5px;color:var(--ink-soft);cursor:pointer;width:fit-content}
  .vc-seg-add:hover{color:var(--ink);border-color:var(--ink-mute)}
  .vc-seg-sum{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.6}
  .vc-segcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:8px}
  .vc-segcard{border:0;border-radius:var(--r-md);padding:12px;background:#fff;display:grid;gap:10px;min-width:0;overflow:hidden;box-shadow:0 1px 2px rgba(60,50,20,.04)}
  .vc-segc-top{display:flex;align-items:center;gap:8px}
  .vc-segc-top .vc-seg-name{flex:1 1 auto;min-width:90px;font-weight:500;font-size:13.5px;color:var(--ink);border:0;background:var(--track);border-radius:var(--r-sm);height:36px;padding:0 11px}
  .vc-segc-top .vc-seg-name:focus{background:#fff;outline:none;box-shadow:0 0 0 3px var(--ring)}
  .vc-segc-top .vc-money{width:120px;flex:none;height:36px}
  .vc-segc-del{appearance:none;display:inline-flex;background:none;border:0;color:var(--ink-mute);cursor:pointer;font-size:16px;line-height:1;padding:4px;margin-left:auto;border-radius:50%}
  .vc-segc-del:hover{color:var(--red);background:rgba(198,65,65,.08)}
  .vc-segc-mid{display:flex;align-items:flex-start;gap:12px 16px;flex-wrap:wrap}
  .vc-segscen{display:grid;grid-template-columns:auto 60px 60px;gap:6px 8px;align-items:center}
  .vc-segscen-h{font-size:11px;color:var(--ink-mute);text-align:center}
  .vc-segscen-lab{font-size:11.5px;color:var(--ink-mute);white-space:nowrap}
  .vc-segscen .vc-input{width:60px;min-width:0;height:34px;text-align:center;padding:0 6px}
  .vc-segc-meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;padding-top:14px;min-width:0}
  .vc-segc-share{font-size:13px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .vc-segc-e{font-size:11.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  .vc-asset-hint{font-size:12px;color:var(--ink-mute);line-height:1.6;margin:6px 0 2px}
  .vc-asset-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-mute);flex-wrap:wrap}
  .vc-asset-row .vc-input{width:84px;min-width:0;height:34px;text-align:right}
  .vc-asset-u{font-size:11.5px;color:var(--ink-mute);white-space:nowrap}
  .vc-asset-pv{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .vc-asset-btns{display:flex;gap:8px;flex-wrap:wrap}
  .vc-segc-top .vc-asset-com{flex:0 0 auto;width:auto;min-width:80px;max-width:120px;height:36px;padding:0 8px}
  .vc-asset-tag{font-size:10.5px;color:var(--ink-soft);background:var(--track);border-radius:var(--r-pill);padding:2px 8px;white-space:nowrap}
  .vc-pricerows{margin-top:10px;display:grid;gap:8px}
  .vc-price-row{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center}
  .vc-price-lab{font-size:12.5px;color:var(--ink-soft)}
  .vc-price-row .vc-input{width:84px;height:34px;text-align:right}
  .vc-price-hdr span{font-size:11px;color:var(--ink-mute);text-align:center}
  .vc-price-hdr span:first-child{text-align:left}

  /* 中栏底部：逐年现金流表 + 图 + 敏感性 */
  .vc-sched{border-top:1px dashed var(--border);padding-top:6px}
  .vc-sched:empty{display:none}
  .vc-sched-toggle{display:inline-flex;align-items:center;gap:4px;border:0;background:none;cursor:pointer;font-family:var(--font);font-size:14px;color:var(--ink);padding:10px 0}
  .vc-sched-body{padding:0 0 12px}
  .vc-sched-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .vc-sched-table th{text-align:right;color:var(--ink-mute);font-weight:400;font-size:12px;padding:6px 8px;border-bottom:1px dashed var(--border)}
  .vc-sched-table th:first-child{text-align:left}
  .vc-sched-table td{text-align:right;padding:6px 8px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .vc-sched-table td:first-child{text-align:left;color:var(--ink-soft)}
  .vc-sched-term td{border-top:1px dashed var(--border)}
  .vc-sched-sum td{font-weight:500;border-top:1px solid var(--border)}
  .vc-viz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:4px 28px}
  /* 结论栏里的图与敏感性：不再单独成卡，用虚线分隔成段 */
  .vc-result-card{border-top:1px dashed var(--border);padding-top:18px;min-width:0}
  .vc-chart-card:empty,.vc-sens-card:empty{display:none}
  .vc-card-title{font-size:17px;font-weight:400;letter-spacing:-.01em;margin-bottom:16px;color:var(--ink)}
  .vc-chart-wrap{width:100%;overflow:hidden}
  .vc-chart{width:100%;height:auto;display:block}
  .vc-chart-area{fill:rgba(246,207,74,.28);stroke:none}
  .vc-chart-line{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .vc-chart-dot{fill:var(--ink)}
  .vc-chart-x{font-size:12px;fill:var(--ink-mute)}
  .vc-sens-ytitle{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-soft);margin:-6px 0 10px;padding-left:88px}
  .vc-sens-table{display:grid;gap:4px;overflow-x:auto}
  .vc-sens-row{display:grid;grid-template-columns:84px repeat(5,minmax(56px,1fr));gap:4px}
  .vc-sens-axis,.vc-sens-hcell,.vc-sens-y,.vc-sens-cell{min-height:42px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-variant-numeric:tabular-nums;border-radius:var(--r-sm)}
  .vc-sens-axis,.vc-sens-hcell,.vc-sens-y{background:rgba(29,29,27,.035);color:var(--ink-soft)}
  .vc-sens-axis{font-size:11.5px;text-align:center;padding:0 4px}
  .vc-sens-cell{background:rgba(246,207,74,.18);color:var(--ink-soft)}
  .vc-sens-cell.center{background:var(--sun);font-weight:500;color:var(--sun-ink)}

  /* 结论栏顶：标的一行（logo · 名称 / 代码 · 现价） */
  .vc-prof{display:flex;align-items:center;gap:12px;padding:14px 0 18px;border-bottom:1px dashed var(--border)}
  .vc-prof-av{width:44px;height:44px;border-radius:50%;background:var(--dark);color:var(--sun);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500}
  .vc-prof-id{min-width:0;flex:1}
  .vc-prof-name{font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vc-prof-code{margin-top:2px;font-family:var(--mono);font-size:11.5px;color:var(--ink-mute)}
  .vc-prof-px{font-size:26px;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .vc-prof-sec{padding:0}
  .vc-prof-title{font-size:16px;font-weight:500;margin-bottom:10px}
  /* 点线引导的键值行 */
  .vc-kv{display:flex;align-items:baseline;gap:8px;padding:6px 0;font-size:13.5px}
  .vc-kv-k{color:var(--ink-soft);flex:none}
  .vc-kv-dots{flex:1;border-bottom:1.5px dotted var(--node);transform:translateY(-3px);min-width:16px}
  .vc-kv-v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
  /* 估值明细：renderBreakdown 产出的 .vc-rrow 也排成点线键值行 */
  .vc-summary-metrics{display:flex;flex-direction:column}
  .vc-summary-metrics:empty::after{content:"—";color:var(--ink-mute);font-size:13px}
  .vc-rrow{display:flex;align-items:baseline;gap:8px;padding:6px 0;font-size:13.5px}
  .vc-rk{color:var(--ink-soft);flex:none}
  .vc-rrow::after{content:"";order:1;flex:1;border-bottom:1.5px dotted var(--node);transform:translateY(-3px);min-width:16px}
  .vc-rv{order:2;color:var(--ink);font-weight:400;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right}
  /* 备注 + 保存 */
  .vc-savebar{position:sticky;bottom:-26px;z-index:2;margin:auto -26px -26px;padding:18px 26px 22px;border-top:1px dashed var(--border);background:#fdfcf9;border-radius:0 0 var(--r-xl) var(--r-xl);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:14px}
  .vc-note{margin:0}
  .vc-note-label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);margin-bottom:8px}
  .vc-note-label > span{flex:1}
  .vc-note-ai{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border:0;border-radius:var(--r-pill);background:rgba(246,207,74,.28);color:var(--sun-ink);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer}
  .vc-note-ai:hover{background:rgba(246,207,74,.45)} .vc-note-ai:disabled{opacity:.7;cursor:default}
  .vc-note-ai i{font-size:13px} .vc-note-ai .ri-loader-4-line{animation:vcSpin 1s linear infinite}
  .vc-note-undo{border:0;background:none;padding:0;font-family:var(--font);font-size:12px;color:var(--ink-mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .vc-note-err{margin-top:6px;font-size:12px;color:var(--red)}
  .vc-note-input{width:100%;min-height:84px;padding:11px 14px;border:0;border-radius:var(--r-md);background:#fff;box-shadow:inset 0 0 0 1px var(--divider);font-family:var(--font);font-size:13.5px;line-height:1.6;color:var(--ink);resize:vertical}
  .vc-note-input::placeholder{color:var(--ink-mute)}
  .vc-note-input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--ring-border),0 0 0 4px var(--ring)}
  .vc-submit{min-width:180px;height:48px;padding:0 28px;border:0;border-radius:var(--r-pill);background:var(--dark);color:#fff;cursor:pointer;font-family:var(--font);font-size:15px;font-weight:500;transition:background .15s,opacity .15s}
  .vc-submit:hover{background:#000}
  .vc-submit:disabled{opacity:.3;cursor:not-allowed}

  /* ===== AI 估值助手：入口按钮 + 右侧抽屉 ===== */
  .vc-ai-entry{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:var(--r-pill);
    background:var(--dark);color:#fff;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:500;transition:background .15s,transform .15s}
  .vc-ai-entry i{color:var(--sun);font-size:14px}
  .vc-ai-entry:hover{background:#000}
  .vc-ai-entry[hidden]{display:none}
  .vc-ai{position:fixed;z-index:90;top:16px;right:16px;bottom:16px;width:min(410px,calc(100vw - 32px));display:flex;flex-direction:column;
    background:#fbfaf6;border:1px solid var(--card-edge);border-radius:var(--r-xl);box-shadow:0 30px 80px -30px rgba(40,35,20,.45);
    transform:translateX(calc(100% + 32px));transition:transform .22s cubic-bezier(.22,1,.36,1)}
  .vc-ai.on{transform:none}
  .vc-ai[hidden]{display:none}
  .vc-workbench{transition:margin-right .22s cubic-bezier(.22,1,.36,1)}
  /* 抽屉占右侧 410 + 16 + 12 间隙；内容区最宽 1600 居中，宽屏时右侧本来就有空白 → 只让出真正重叠的那部分，够宽就不让 */
  @media (min-width:1300px){ body.vc-ai-open .vc-workbench{margin-right:max(0px,calc(438px - clamp(16px,3vw,44px) - (100vw - min(100vw,1600px)) / 2))} }
  .vc-ai-head{display:flex;align-items:center;gap:12px;padding:18px 16px 14px 20px;border-bottom:1px dashed var(--border)}
  .vc-ai-badge{flex:none;width:36px;height:36px;border-radius:50%;background:var(--dark);color:var(--sun);display:flex;align-items:center;justify-content:center;font-size:17px}
  .vc-ai-titles{flex:1;min-width:0}
  .vc-ai-title{font-size:16px;font-weight:500}
  .vc-ai-modelwrap{position:relative;margin-top:3px}
  .vc-ai-model{display:inline-flex;align-items:center;gap:2px;max-width:100%;height:24px;padding:0 6px 0 9px;margin-left:-2px;border:0;border-radius:var(--r-pill);background:var(--track);
    cursor:pointer;font-family:var(--font);font-size:12px;color:var(--ink-soft)}
  .vc-ai-model span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vc-ai-model:hover{background:var(--track-edge);color:var(--ink)}
  .vc-ai-mmenu{position:absolute;top:calc(100% + 6px);left:-2px;z-index:5;display:flex;flex-direction:column;gap:1px;width:300px;max-height:60vh;overflow:auto;padding:6px;background:#fff;border-radius:var(--r-md);
    box-shadow:0 1px 2px rgba(60,50,20,.06),0 16px 36px -14px rgba(60,50,20,.35)}
  .vc-ai-mmenu[hidden]{display:none}
  .vc-ai-histwrap{position:relative;flex:none}
  .vc-ai-hmenu{left:auto;right:-2px;width:300px}
  .vc-ai-hrow{display:flex;align-items:center;gap:2px;border-radius:var(--r-sm)}
  .vc-ai-hrow > button:first-child{flex:1;min-width:0}
  .vc-ai-hrow > button:first-child .vc-ai-mname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vc-ai-hrow.on > button:first-child{background:rgba(246,207,74,.28)}
  .vc-ai-mmenu .vc-ai-hdel{flex:none;align-items:center;justify-content:center;width:30px;height:30px;padding:0;color:var(--ink-mute);opacity:0}
  .vc-ai-hrow:hover .vc-ai-hdel,.vc-ai-hdel:focus-visible{opacity:1}
  .vc-ai-mmenu .vc-ai-hdel:hover{color:var(--red);background:rgba(198,65,65,.08)}
  .vc-ai-hempty{padding:10px;font-size:12.5px;color:var(--ink-mute)}
  .vc-ai-mgroup{padding:8px 10px 4px;font-size:11.5px;color:var(--ink-mute)}
  .vc-ai-mmenu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px;border:0;border-radius:var(--r-sm);background:none;cursor:pointer;font-family:var(--font);text-align:left}
  .vc-ai-mmenu button:hover{background:var(--track)}
  .vc-ai-mmenu button.on{background:rgba(246,207,74,.28)}
  .vc-ai-mname{font-size:13.5px;color:var(--ink)}
  .vc-ai-mmodel{font-size:11px;color:var(--ink-mute);font-family:var(--mono);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vc-ai-manage{display:block;margin-top:4px;padding:9px 10px 6px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--ink-soft);text-decoration:none}
  .vc-ai-manage:hover{color:var(--ink);text-decoration:underline}
  .vc-ai-iconbtn{background:var(--track) !important}
  .vc-ai-iconbtn:hover{background:var(--track-edge) !important}
  .vc-ai-log{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px 18px 8px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
  .vc-ai-intro p{margin:0 0 14px;font-size:13.5px;line-height:1.7;color:var(--ink-soft)}
  .vc-ai-quick{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .vc-ai-chip{border:1px solid var(--divider);background:#fff;border-radius:var(--r-pill);padding:7px 13px;cursor:pointer;font-family:var(--font);font-size:13px;color:var(--ink);text-align:left;transition:border-color .15s,box-shadow .15s}
  .vc-ai-chip:hover{border-color:transparent;box-shadow:0 0 0 2px var(--sun)}
  .vc-ai-msg{display:flex;flex-direction:column;gap:8px;max-width:100%}
  .vc-ai-msg.me{align-items:flex-end}
  .vc-ai-bubble{max-width:88%;padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .vc-ai-msg.me .vc-ai-bubble{background:var(--dark);color:#fff;border-bottom-right-radius:6px}
  .vc-ai-msg.ai .vc-ai-bubble{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--divider);border-bottom-left-radius:6px}
  .vc-ai-msg.pending .vc-ai-bubble{color:var(--ink-mute);animation:vcAiPulse 1.2s ease-in-out infinite}
  .vc-ai-msg.error .vc-ai-bubble{color:var(--red);background:rgba(198,65,65,.07);box-shadow:none}
  /* 消息操作行：复制 / 重试，平时淡，悬停这条消息时变清楚；失败消息的操作一直清楚 */
  .vc-ai-risk{display:flex;align-items:flex-start;gap:7px;margin:8px 0 6px;padding:8px 10px;border-radius:var(--r-sm);background:rgba(240,140,46,.10);color:#8a4a17;font-size:11.5px;line-height:1.55}
  .vc-ai-risk i{flex:none;font-size:13px;margin-top:1px;color:#d0782a}
  .vc-ai-macts{display:flex;gap:2px;margin-top:-4px;opacity:.45;transition:opacity .15s}
  .vc-ai-msg:hover .vc-ai-macts,.vc-ai-msg.error .vc-ai-macts,.vc-ai-macts:focus-within{opacity:1}
  .vc-ai-mact{width:26px;height:26px;border:0;border-radius:50%;background:none;color:var(--ink-mute);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
  .vc-ai-mact:hover{background:var(--track);color:var(--ink)}
  .vc-ai-mact.done{color:var(--green)}
  .vc-ai-mact.fail{color:#c26a1c}
  .vc-ai-msg.error .vc-ai-mact{color:var(--red)}
  @keyframes vcAiPulse{50%{opacity:.45}}
  .vc-ai-sugg{width:100%;background:#fff;border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--divider);padding:14px 14px 12px}
  /* 情景分析：保守（灰点）/ 乐观（暖黄点）各一块，故事 + 关键假设列表 + 可能错在哪 / 跟踪信号 */
  .vc-ai-scheck{display:flex;align-items:flex-start;gap:5px;margin-top:4px;font-size:11.5px;line-height:1.55;color:var(--ink-mute)}
  .vc-ai-scheck i{font-size:13px;margin-top:1px;color:var(--sun-ink)}
  .vc-ai-scens{display:flex;flex-direction:column;gap:8px;margin:2px 0 10px}
  .vc-ai-scen{padding:11px 12px;border-radius:var(--r-md);background:rgba(29,29,27,.035)}
  .vc-ai-scen.o{background:rgba(246,207,74,.16)}
  .vc-ai-scen-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .vc-ai-scen-head::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-mute)}
  .vc-ai-scen.o .vc-ai-scen-head::before{background:var(--sun)}
  .vc-ai-scen-story{margin:0 0 8px;font-size:13px;line-height:1.65;color:var(--ink)}
  .vc-ai-scen-k{font-size:11.5px;color:var(--ink-mute);font-weight:500}
  .vc-ai-scen-list{margin:3px 0 8px;padding-left:16px;font-size:12.5px;line-height:1.6;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px}
  .vc-ai-scen-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding-top:6px;margin-top:6px;border-top:1px dashed var(--border);font-size:12.5px;line-height:1.55;color:var(--ink-soft)}
  .vc-ai-scen-row .vc-ai-scen-k{white-space:nowrap;padding-top:1px}
  .vc-ai-sugg-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin-bottom:8px}
  .vc-ai-sugg-head i{color:var(--sun-ink)}
  .vc-ai-srow{padding:9px 0;border-top:1px dashed var(--border)}
  .vc-ai-slab{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px}
  .vc-ai-svals{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
  .vc-ai-snow{color:var(--ink-mute);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.2)}
  .vc-ai-svals i{color:var(--ink-mute);font-size:13px}
  .vc-ai-snext{font-weight:500;color:var(--ink)}
  .vc-ai-snext em{font-style:normal;font-weight:400;font-size:12px;color:var(--ink-mute)}
  .vc-ai-sreason{margin-top:4px;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
  .vc-ai-sact{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px dashed var(--border)}
  .vc-ai-apply{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;border:0;border-radius:var(--r-pill);background:var(--sun);color:var(--sun-ink);cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500}
  .vc-ai-apply:disabled{background:var(--track);color:var(--ink-soft);cursor:default}
  .vc-ai-undo{height:34px;padding:0 13px;border:0;border-radius:var(--r-pill);background:none;color:var(--ink-soft);cursor:pointer;font-family:var(--font);font-size:13px;text-decoration:underline;text-underline-offset:2px}
  .vc-ai-undo[hidden]{display:none}
  /* AI 交互组件：数值由前端现算；白卡同建议参数卡，当前档 / 当前倍数用暖黄 */
  .vc-ai-widget{width:100%;background:#fff;border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--divider);padding:14px 14px 12px}
  .vc-ai-wsens{display:grid;gap:3px}
  .vc-ai-wsrow{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;padding:6px 8px;border-radius:var(--r-sm);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .vc-ai-wsrow span:not(:first-child){text-align:right}
  .vc-ai-wsrow.head{font-size:11.5px;color:var(--ink-mute);padding-top:0;padding-bottom:4px;border-bottom:1px dashed var(--border);border-radius:0}
  .vc-ai-wsrow.cur{background:var(--sun);color:var(--sun-ink);font-weight:500}
  .vc-ai-wbar{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;color:var(--ink-soft)}
  .vc-ai-wtrack{height:8px;border-radius:var(--r-pill);background:var(--track)}
  .vc-ai-wfill{height:100%;border-radius:var(--r-pill);background:var(--ink-mute)}
  .vc-ai-wbar.cur .vc-ai-wfill{background:var(--sun)}
  .vc-ai-wbar.cur{color:var(--ink);font-weight:500}
  .vc-ai-wbval{text-align:right;font-variant-numeric:tabular-nums}
  .vc-ai-wset{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .vc-ai-setchip{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
  .vc-ai-setchip i{color:var(--sun-ink)}
  .vc-ai-setchip:disabled{background:var(--sun-soft);border-color:transparent;box-shadow:none;cursor:default}
  .vc-ai-foot{position:relative;padding:10px 14px 12px;border-top:1px dashed var(--border)}
  .vc-ai-sug{position:absolute;left:14px;right:14px;bottom:calc(100% - 4px);z-index:3;display:flex;flex-direction:column;padding:6px;background:#fff;border-radius:var(--r-md);box-shadow:0 0 0 1px var(--card-edge),0 12px 32px rgba(29,29,27,.12)}
  .vc-ai-sug[hidden]{display:none} /* 上面的 display:flex 会盖过 hidden 属性 */
  .vc-ai-sugitem{text-align:left;border:0;background:none;border-radius:var(--r-xs);padding:8px 10px;font-family:var(--font);font-size:13px;line-height:1.45;color:var(--ink);cursor:pointer}
  .vc-ai-sugitem:hover,.vc-ai-sugitem.on{background:var(--sun-soft)}
  .vc-ai-sughint{padding:6px 10px 2px;font-size:11px;color:var(--ink-mute);border-top:1px dashed var(--divider);margin-top:4px}
  .vc-ai-box{display:flex;align-items:flex-end;gap:8px;background:#fff;border-radius:22px;box-shadow:inset 0 0 0 1px var(--divider);padding:6px 6px 6px 14px}
  .vc-ai-box:focus-within{box-shadow:inset 0 0 0 1px var(--ring-border),0 0 0 4px var(--ring)}
  .vc-ai-sugbtn{flex:none;align-self:center;width:30px;height:30px;margin-left:-8px;border:0;border-radius:50%;background:none;color:var(--ink-mute);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  .vc-ai-sugbtn:hover{background:var(--track);color:var(--ink)}
  .vc-ai-sugbtn.on{background:var(--sun-soft);color:var(--sun-ink)}
  .vc-ai-input{flex:1;min-width:0;border:0;outline:none;resize:none;background:none;padding:7px 0;font-family:var(--font);font-size:13.5px;line-height:1.5;color:var(--ink);max-height:140px}
  .vc-ai-input::placeholder{color:var(--ink-mute)}
  .vc-ai-send{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:var(--dark);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  .vc-ai-send:disabled{opacity:.35;cursor:default}
  .vc-ai-disclaimer{margin-top:7px;text-align:center;font-size:11px;color:var(--ink-mute)}

  /* 窄屏：单栏，结论排在输入下方，整块一起滚动 */
  @media (max-width:1100px){
    .vc-workbench{grid-template-columns:minmax(0,1fr);align-content:start;overflow:auto}
    .vc-col{overflow:visible;min-height:auto} /* 整块滚动时各栏按内容撑开（分栏各自滚动时才需要 min-height:0） */
  }
  @media (max-width:900px){
    body.ve-mode{overflow:auto}
    body.ve-mode .page{height:auto;min-height:100vh}
    body.ve-mode #viewValEdit{overflow:visible}
    .vc-workbench{grid-template-columns:1fr;overflow:visible}
    .vc-col{overflow:visible;padding-bottom:0;min-height:auto}
  }
  @media (max-width:560px){
    .vc-pcard{min-height:0;padding:14px 16px}
    .vc-picker{padding:10px}
    .vc-picker-modal{padding:20px 18px 22px;max-height:calc(100vh - 20px)}
    .vc-singles-grid{grid-template-columns:1fr}
    .vc-arow{grid-template-columns:1fr 1fr;gap:7px}
    .vc-arow .vc-label{grid-column:1 / -1}
    .vc-arow-head > :first-child{display:none} /* 列标题行的空占位格，窄屏时去掉才能对齐「保守 / 乐观」两列 */
    .vc-savebar{grid-template-columns:1fr}
    .vc-results{padding:18px 18px 22px}
  }
  /* 估值卡片列表 */
  /* ===== 估值研究 tab：距离指标 / 估值区间对照图 / 估值卡片网格 ===== */
  .vsec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
  .vsec-title{font-size:20px;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
  .vsec-sub{font-size:13px;color:var(--ink-mute)}
  /* 三个距离指标 */
  .vdist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .vdist-tile{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;padding:18px 20px 16px;border-radius:var(--r-lg)}
  .vdist-dot{width:10px;height:10px;border-radius:50%;background:var(--dark)}
  .vdist-lab{font-size:13.5px;color:var(--ink-soft)}
  .vdist-val{grid-column:1 / -1;margin-top:10px;font-size:40px;font-weight:400;line-height:1;letter-spacing:-.035em;color:var(--ink);font-variant-numeric:tabular-nums}
  .vdist-sub{grid-column:1 / -1;margin-top:8px;font-size:12.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .vdist-none{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:var(--r-xl);
    background:var(--card);border:1px solid var(--card-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .vdist-none-msg{display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.6;color:var(--ink-soft);min-width:0;flex:1 1 320px}
  .vdist-none-msg i{font-size:22px;color:var(--ink-mute)}
  .vdist-none-acts{display:none;gap:8px} /* 宽屏侧栏钟摆卡里已有「添加估值」，这里不重复；窄屏侧栏排到下方时才显示 */
  @media (max-width:1100px){ .vdist-none-acts{display:flex} }
  .vdist-params{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-mute)}
  .vdist-edit{appearance:none;border:0;background:none;padding:0;font-family:var(--font);font-size:12.5px;color:var(--ink-soft);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .vdist-edit:hover{color:var(--ink)}
  /* 估值区间对照图（football field） */
  .vmap{padding:0}
  .vmap-grid{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);column-gap:16px;row-gap:14px;align-items:center}
  .vmap-lab{font-size:13.5px;color:var(--ink-soft);min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .vmap-lab.picked{color:var(--ink);font-weight:500}
  .vmap-pick{font-size:10.5px;font-weight:500;color:var(--sun-ink);background:var(--sun);border-radius:var(--r-pill);padding:2px 8px}
  .vmap-track{position:relative;height:30px;grid-column:2}
  .vmap-bar{position:absolute;top:7px;bottom:7px;border-radius:var(--r-pill);background:var(--dark)}
  .vmap-track.picked .vmap-bar{background:var(--sun)}
  .vmap-end{position:absolute;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
  .vmap-end.lo{right:100%;margin-right:6px}
  .vmap-end.hi{left:100%;margin-left:6px}
  .vmap-now{position:absolute;top:-7px;bottom:-7px;width:0;border-left:1.5px dashed var(--ink);pointer-events:none;z-index:2}
  .vmap-now.first{top:-4px}
  .vmap-ref{position:absolute;top:-7px;bottom:-7px;width:0;border-left:1.5px dashed;pointer-events:none}
  .vmap-ref-tag{position:absolute;top:100%;left:0;transform:translate(-50%,4px);white-space:nowrap;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
  .vmap-now-tag{position:absolute;bottom:100%;left:0;transform:translate(-50%,-2px);white-space:nowrap;font-size:11px;font-weight:500;
    color:#fff;background:var(--dark);border-radius:var(--r-pill);padding:3px 9px;font-variant-numeric:tabular-nums}
  .vmap-axis{grid-column:2;position:relative;height:16px;border-top:1px dashed var(--border);margin-top:18px} /* 上方留出击球线/泡沫线标签的位置 */
  .vmap-axis span{position:absolute;top:4px;transform:translateX(-50%);font-size:10.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .vmap-lab.axis{min-height:0}
  .vmap .vsec-head{margin-bottom:26px}
  @media (max-width:760px){
    .vdist{gap:8px}
    .vdist-tile{grid-template-columns:auto 1fr;padding:14px 12px 12px;column-gap:6px}
    .vdist-lab{font-size:11.5px}
    .vdist-val{font-size:24px;margin-top:8px}
    .vdist-sub{font-size:11px}
    .vmap{padding:18px 14px 14px}
    .vmap-grid{grid-template-columns:84px minmax(0,1fr);column-gap:10px}
    .vmap-lab{font-size:12px}
  }
  /* 估值卡片网格 */
  .vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px}
  .vcard{display:flex;flex-direction:column;border-radius:var(--r-lg);padding:20px 22px 16px;background:rgba(29,29,27,.035);transition:box-shadow .15s,background .15s}
  .vcard.on{background:#fff;box-shadow:0 0 0 2px var(--sun)}
  .vcard-head{display:flex;align-items:center;gap:8px}
  .vcard-method{font-size:15px;font-weight:500;color:var(--ink)}
  .vcard-badge{font-size:11px;font-weight:500;color:var(--sun-ink);background:var(--sun);border-radius:var(--r-pill);padding:3px 9px}
  .vcard-range{margin-top:14px;font-family:var(--font);font-weight:400;font-size:38px;line-height:1;letter-spacing:-.035em;color:var(--ink);font-variant-numeric:tabular-nums}
  .vcard-verdict{margin-top:10px;width:fit-content;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:var(--r-pill);background:var(--track);color:var(--ink-soft)}
  .vcard-verdict.v-under{color:var(--green);background:rgba(31,143,84,.12)} .vcard-verdict.v-over{color:var(--red);background:rgba(198,65,65,.10)}
  .vcard-assume{margin-top:14px;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
  .vcard-checked{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-mute)}
  .vcard-checked i{font-size:13px;color:var(--green)}
  .vcard-checked.due{color:#8a4a17} .vcard-checked.due i{color:#d0782a}
  .vcard-mark{margin-left:auto;border:0;cursor:pointer;font-family:var(--font);font-size:12px;color:#8a4a17;background:rgba(240,140,46,.12);border-radius:var(--r-pill);padding:4px 11px}
  .vcard-mark:hover{background:rgba(240,140,46,.22)}
  .vcard-note{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);font-size:12.5px;line-height:1.6;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word}
  .vcard-actions{margin-top:auto;padding-top:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  /* AI 复核：按钮 + 卡内结果块 */
  .vcard-ai{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border:0;border-radius:var(--r-pill);background:#fff;box-shadow:inset 0 0 0 1px var(--divider);
    cursor:pointer;font-family:var(--font);font-size:12.5px;color:var(--ink)}
  .vcard-ai i{color:var(--sun-ink);font-size:14px}
  .vcard-ai:hover{box-shadow:inset 0 0 0 1px var(--sun),0 0 0 3px rgba(246,207,74,.25)}
  .vcard-ai.busy{cursor:default;opacity:.8}
  .vcard-ai.busy i{animation:vcSpin 1s linear infinite}
  .vrev{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:#fff;box-shadow:inset 0 0 0 1px var(--divider)}
  .vrev.watch{box-shadow:inset 0 0 0 1px rgba(240,140,46,.45)} .vrev.broken{box-shadow:inset 0 0 0 1px rgba(198,65,65,.4)}
  .vrev-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .vrev-badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500}
  .vrev-badge.hold{background:rgba(31,143,84,.12);color:var(--green)} .vrev-badge.watch{background:rgba(240,140,46,.16);color:#a4561a} .vrev-badge.broken{background:rgba(198,65,65,.1);color:var(--red)}
  .vrev-when{font-size:11.5px;color:var(--ink-mute)}
  .vrev-stale{margin-top:8px;font-size:12px;color:#a4561a}
  .vrev-sum{margin-top:10px;font-size:13px;line-height:1.65;color:var(--ink)}
  .vrev-checks{margin-top:10px;display:flex;flex-direction:column}
  .vrev-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--border)}
  .vrev-dot{flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%}
  .vrev-dot.ok{background:var(--green)} .vrev-dot.watch{background:#f08c2e} .vrev-dot.broken{background:var(--red)}
  .vrev-main{min-width:0;flex:1}

// 入场动画：现价数字与钟摆 swingIn 同步入场、同时收尾（呼应 motion.dev number-trend）
// 用与 gauge.swingIn 完全相同的阻尼包络（λ=0.9）和停止阈值（env≤0.012），保证两者同时停
function animatePriceIn(item) {
  const px = item.verdictEl.querySelector(".px");
  const to = item.cfg.price;
  if (!px || !(to > 0)) return;
  if (REDUCE) { setNum(px, VMSGS.px(to)); return; }
  const lambda = 8.85, cutoff = 0.012, t0 = performance.now(); // λ=8.85 → 收敛约 0.5s(ln(1/cutoff)/λ)
  setNum(px, VMSGS.px(0));

    // 归一化：env 降到 cutoff 时正好到达目标，避免收尾跳一下
    setNum(px, VMSGS.px(to * (1 - env) / (1 - cutoff)));
    if (env > cutoff) item._pxRaf = requestAnimationFrame(step);

}

// ── 该复核的估值 ──
// 只看选中的那张估值卡（它决定了合理区间）：updatedAt 超过 REVIEW_DAYS 天，或估值之后又出了财报（季报 / 半年报 / 年报：最新一期的期末晚于估值日期，财报一定是期末之后才发布）
const REVIEW_DAYS = 180;
const selectedCard = (c) => (Array.isArray(c.valuations) ? c.valuations.find((v) => v.id === c.selectedValuationId) : null) || null;
// 最新一期财报的期末（ISO 日期）按标的缓存一天，避免每次打开都拉财报
const FP_KEY = (sym) => "rv_fp2_" + sym; // v2：季报起算（v1 只看年报）
function cachedFp(sym) {
  try { const j = JSON.parse(localStorage.getItem(FP_KEY(sym)) || "null"); return j && Date.now() - j.at < 86400000 ? j : null; } catch { return null; }
}
function latestAnnualEnd(financials) { // 年报 / 季报都适用：取最新一期的期末与期名
  const acct = financials && financials.IS && financials.IS[0];
  const v = acct && acct.values && acct.values[0]; // 最新期在前
  if (!v) return null;
  const t = Number(v.fpEnd);
  const iso = Number.isFinite(t) && t > 0 ? new Date(t * 1000).toISOString().slice(0, 10) : null;
  return iso ? { end: iso, label: v.period || (v.year ? "FY" + v.year : "") } : null;
}
// 最近一次「看过」这张卡的时间：编辑保存、AI 复核、手动「标记已复核」三者取最新 → { at: ISO, how: "edit"|"ai"|"mark" }
function lastChecked(card) {
  const c = [[card.updatedAt, "edit"], [card.review && card.review.at, "ai"], [card.reviewedAt, "mark"]]
    .filter(([t]) => typeof t === "string" && Number.isFinite(Date.parse(t))).sort((a, b) => Date.parse(b[0]) - Date.parse(a[0]));
  return c.length ? { at: c[0][0], how: c[0][1] } : null;
}
function reviewReasonsFor(card, symbol) {
  const lc = card && lastChecked(card); if (!lc) return null;
  const at = Date.parse(lc.at), zh = LANG === "zh", out = [];
  const months = Math.floor((Date.now() - at) / (30.44 * 86400000));
  if (Date.now() - at > REVIEW_DAYS * 86400000) out.push(zh ? `${months} 个月未复核` : `not reviewed for ${months} months`);
  const fp = cachedFp(symbol);
  if (fp && fp.end && fp.end > lc.at.slice(0, 10)) out.push(zh ? `有新财报 ${fp.label}` : `new report ${fp.label}`);
  return out.length ? out : null;
}
function reviewReasons(item) { return reviewReasonsFor(selectedCard(item.cfg), item.cfg.symbol); }
let reviewFetching = false;
// 后台逐个补齐「最新一期财报期末」：先看季报，没有季报（只出半年报 / 没数据）再看年报；只给主人、只看已估值的；长桥财报接口限频，一个一个来
async function fillReportDates() {
  if (!owner || reviewFetching) return;
  const todo = items.filter((i) => i.cfg.symbol && selectedCard(i.cfg) && !cachedFp(i.cfg.symbol));
  if (!todo.length) return;
  reviewFetching = true;
  try {
    for (const it of todo) {
      const q = await loadFinancials(it, "quarter").catch(() => null);
      let fp = latestAnnualEnd(q && q.financials);
      if (!fp) { const a = await loadFinancials(it, "annual").catch(() => null); fp = latestAnnualEnd(a && a.financials); }
      try { localStorage.setItem(FP_KEY(it.cfg.symbol), JSON.stringify({ at: Date.now(), ...(fp || {}) })); } catch { /* 存不了就下次再拉 */ }
      renderReviewBanner();
    }

}

async function fetchQuotes() {
  const symbols = [...new Set(items.map((i) => i.cfg.symbol).filter(Boolean))];
  if (!symbols.length) return;
  let data;
  try {
    const res = await fetch("/api/quotes?symbols=" + encodeURIComponent(symbols.join(",")));
    data = await res.json();
  } catch { return; }
  const quotes = data.quotes || {};
  const prevClose = data.prevClose || {};
  let ok = 0;
  items.forEach((item) => {
    const p = quotes[item.cfg.symbol];
    if (!(p > 0)) return;
    ok++;
    item.cfg = { ...item.cfg, price: p };
    if (prevClose[item.cfg.symbol] > 0) item.prevClose = prevClose[item.cfg.symbol];
    item.live = true;
    const first = !item.gotQuote;
    item.gotQuote = true;
    item.gauge.set(item.cfg, true);   // 列表用 Bar：自带占位/标记动画
    renderVerdict(item);
    if (structValid(item.cfg)) {       // 入场摆动/数字动画仅在有区间（钟摆）时
      if (first && typeof item.gauge.swingIn === "function") item.gauge.swingIn();
      if (first) animatePriceIn(item);
    }
  });
  if (ok > 0) {
    const now = new Date();
    const p2 = (n) => String(n).padStart(2, "0");
    const src = data.source === "longbridge" ? t("src_longbridge") : t("src_tencent");
    updatedEl.textContent = t("b_updated", `${p2(now.getHours())}:${p2(now.getMinutes())}:${p2(now.getSeconds())}`, src);
  }
}
