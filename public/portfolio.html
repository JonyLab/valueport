<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio · ValuePort</title>
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* ===== Portfolio：总资产 + 估值视角 + 持仓 + 分布 + 账户（令牌见 /shared/styles.css） ===== */
  .page{display:flex;flex-direction:column}
  .pf-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin:0 4px 26px}
  .pf-hero h1{font-size:clamp(36px,5vw,56px);margin:0}
  .pf-hero .eyebrow{font-size:15px;margin-bottom:10px}
  .pf-base{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.55);border:1px solid var(--card-edge);border-radius:var(--r-pill)}
  .pf-base button{height:34px;padding:0 14px;border:0;border-radius:var(--r-pill);background:none;cursor:pointer;font-family:var(--font);font-size:13px;color:var(--ink-soft)}
  .pf-base button.on{background:var(--dark);color:#fff}
  .pf-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
  .pf-main,.pf-side{display:flex;flex-direction:column;gap:16px;min-width:0}
  .pf-card{background:var(--card);border:1px solid var(--card-edge);border-radius:var(--r-xl);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:22px 24px}
  .pf-cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .pf-cardtitle{font-size:20px;font-weight:400;letter-spacing:-.01em}
  .pf-cardsub{font-size:13px;color:var(--ink-mute)}
  /* 总资产 */
  .pf-total-lab{font-size:13px;color:var(--ink-mute)}
  .pf-total{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
  .pf-total-num{font-size:clamp(46px,6vw,72px);font-weight:400;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .pf-total-cur{font-size:18px;color:var(--ink-mute)}
  .pf-day{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink-mute)}
  .pf-day.up,.pf-pnl.up{color:var(--green)} .pf-day.down,.pf-pnl.down{color:var(--red)}
  .pf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:22px}
  .pf-stat{display:flex;flex-direction:column;gap:8px;padding-right:16px}
  .pf-stat + .pf-stat{padding-left:16px;border-left:1px dashed var(--border)}
  .pf-stat-k{font-size:13px;color:var(--ink-mute)}
  .pf-stat-v{font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .pf-note{margin-top:14px;font-size:12.5px;color:var(--ink-mute)}
  .pf-note:empty{display:none}
  /* 估值视角：持仓市值按钟摆区间分布 */
  .pf-zbar{display:flex;gap:4px;height:14px;margin:4px 0 18px}
  .pf-zbar span{border-radius:var(--r-pill);min-width:6px}
  .pf-zbar .none{background-color:rgba(255,255,255,.6);background-image:var(--hatch)}
  .pf-zrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .pf-zrow{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--r-md);background:rgba(29,29,27,.035)}
  .pf-zrow-k{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft)}
  .pf-zrow-k i{width:9px;height:9px;border-radius:50%;flex:none}
  .pf-zrow-k i.none{background-image:var(--hatch);background-color:#fff;box-shadow:inset 0 0 0 1px var(--border)}
  .pf-zrow-v{font-size:20px;font-variant-numeric:tabular-nums}
  .pf-zrow-s{font-size:12px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .pf-callout{margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--ink-soft)}
  .pf-callout b{color:var(--ink);font-weight:500}
  /* 持仓表 */
  .pf-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .pf-table th{text-align:right;font-weight:400;font-size:12px;color:var(--ink-mute);padding:0 10px 10px;white-space:nowrap}
  .pf-table th:first-child,.pf-table td:first-child{text-align:left;padding-left:0}
  .pf-table td{text-align:right;padding:11px 10px;border-top:1px dashed var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pf-table tr.link{cursor:pointer}
  .pf-table tr.link:hover td{background:rgba(246,207,74,.10)}
  .pf-sym{display:flex;align-items:center;gap:10px;min-width:0}
  .pf-logo{width:32px;height:32px;border-radius:50%;background:var(--track-edge);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;overflow:hidden;flex:none}
  .pf-logo img{width:100%;height:100%;object-fit:contain}
  .pf-logo.has-img{background:#fff;box-shadow:inset 0 0 0 1px var(--divider)}
  .pf-sym-id{display:flex;flex-direction:column;gap:2px;min-width:0}
  .pf-sym-name{max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .pf-sym-sub{font-size:11.5px;color:var(--ink-mute)}
  .pf-zone{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--track);font-size:12px;color:var(--ink-soft)}
  .pf-zone i{width:8px;height:8px;border-radius:50%}
  .pf-tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .pf-dist-title{font-size:13px;color:var(--ink-mute)}
  /* 小眼睛 */
  .pf-total-lab{display:flex;align-items:center;gap:8px}
  .pf-eye{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:50%;background:var(--track);color:var(--ink-soft);cursor:pointer;font-size:15px}
  .pf-eye:hover{background:var(--track-edge);color:var(--ink)}
  /* 资产曲线 */
  .pf-curve-ctl{display:flex;gap:8px;flex-wrap:wrap}
  .pf-seg{display:flex;gap:2px;padding:3px;background:var(--track);border-radius:var(--r-pill)}
  .pf-seg button{height:28px;padding:0 11px;border:0;border-radius:var(--r-pill);background:none;cursor:pointer;font-family:var(--font);font-size:12.5px;color:var(--ink-soft);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pf-seg button.on{background:var(--dark);color:#fff}
  .pf-curve-sum{font-size:14px;font-weight:500;color:var(--ink-mute);margin:-6px 0 10px;font-variant-numeric:tabular-nums}
  .pf-curve-sum.up{color:var(--green)} .pf-curve-sum.down{color:var(--red)}
  .pf-curve-wrap{position:relative;height:240px}
  .pf-curve-svg{width:100%;height:100%;display:block;overflow:visible}
  .pf-curve-grid{stroke:var(--divider);stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
  .pf-curve-lab{font-family:var(--font);font-size:12px;fill:var(--ink-mute)}
  .pf-curve-area{fill:rgba(246,207,74,.22)}
  .pf-curve-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .pf-curve-hover{stroke:var(--ink-mute);stroke-width:1;vector-effect:non-scaling-stroke}
  .pf-curve-dot{fill:var(--sun);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
  .pf-curve-tip{position:absolute;top:-6px;pointer-events:none;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:var(--r-sm);background:var(--dark);color:#fff;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pf-curve-tip[hidden]{display:none}
  .pf-curve-tip b{font-size:15px;font-weight:500}
  .pf-curve-tip span{opacity:.65}
  .pf-curve-empty{padding:28px 18px;border-radius:var(--r-md);background-color:rgba(255,255,255,.4);background-image:var(--hatch);font-size:13.5px;line-height:1.7;color:var(--ink-soft)}
  /* 仓位体检 */
  .pf-health-top{display:flex;align-items:center;gap:20px;margin-bottom:16px;flex-wrap:wrap}
  .pf-health-score{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;
    box-shadow:inset 0 0 0 6px var(--track)}
  .pf-health-score.ok{box-shadow:inset 0 0 0 6px rgba(31,143,84,.55)} .pf-health-score.warn{box-shadow:inset 0 0 0 6px rgba(240,140,46,.6)} .pf-health-score.bad{box-shadow:inset 0 0 0 6px rgba(198,65,65,.6)}
  .pf-health-num{font-size:32px;line-height:1;letter-spacing:-.03em}
  .pf-health-lab{font-size:12px;color:var(--ink-soft)}
  .pf-health-sum{flex:1 1 280px;font-size:14px;line-height:1.7;color:var(--ink-soft)}
  .pf-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:8px}
  .pf-check{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 14px;border-radius:var(--r-md);background:rgba(29,29,27,.035)}
  .pf-check-ico{font-size:18px;line-height:1.2}
  .pf-check.ok .pf-check-ico{color:var(--green)} .pf-check.warn .pf-check-ico{color:#d9772a} .pf-check.bad .pf-check-ico{color:var(--red)}
  .pf-check-title{font-size:14px}
  .pf-check-text{margin-top:4px;font-size:12.5px;line-height:1.6;color:var(--ink-mute)}
  .pf-check-v{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* 资产分布：环形图 */
  .pf-donut + .pf-donut{margin-top:18px;padding-top:18px;border-top:1px dashed var(--border)}
  .pf-donut-body{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;margin-top:10px}
  .pf-donut-ring{position:relative;width:120px;height:120px}
  .pf-donut-svg{width:100%;height:100%;transform:rotate(-90deg)}
  .pf-donut-track{fill:none;stroke:var(--track);stroke-width:14}
  .pf-donut-arc{fill:none;stroke-width:14}
  .pf-donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
  .pf-donut-mid-v{font-size:14px;font-variant-numeric:tabular-nums;max-width:80px;overflow:hidden;text-overflow:ellipsis}
  .pf-donut-mid-k{font-size:11px;color:var(--ink-mute)}
  .pf-legend{display:flex;flex-direction:column;gap:7px;min-width:0}
  .pf-legend-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
  .pf-legend-row i{width:9px;height:9px;border-radius:50%}
  .pf-legend-k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft)}
  .pf-legend-v{font-variant-numeric:tabular-nums}
  /* 账户卡上的分布 */
  .pf-acc-stats{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pf-acc-v{font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pf-acc-share{font-size:12.5px;color:var(--ink-mute)}
  .pf-acc-zbar{display:flex;gap:3px;height:8px}
  .pf-acc-zbar span{border-radius:var(--r-pill);min-width:4px}
  .pf-acc-zbar .none{background-color:rgba(255,255,255,.6);background-image:var(--hatch)}
  /* 账户 */
  .pf-acc{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px dashed var(--border)}
  .pf-acc:first-child{border-top:0;padding-top:0}
  .pf-acc-top{display:flex;align-items:center;gap:10px}
  .pf-acc-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--dark);color:var(--sun);font-size:16px;flex:none}
  .pf-acc-id{flex:1;min-width:0}
  .pf-acc-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pf-acc-meta{font-size:12px;color:var(--ink-mute)}
  .pf-acc-err{font-size:12px;color:var(--red);line-height:1.5}
  .pf-acc-acts{display:flex;gap:6px;flex-wrap:wrap}
  .pf-acc-acts .btn{height:30px;padding:0 12px;font-size:12.5px;background:rgba(255,255,255,.7)}
  .pf-add{width:100%;margin-top:14px;height:44px;border:1.5px dashed rgba(29,29,27,.22);border-radius:var(--r-pill);background:none;cursor:pointer;
    font-family:var(--font);font-size:14px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px}
  .pf-add:hover{background:rgba(255,255,255,.55);color:var(--ink)}
  /* 空状态 */
  /* 内容区撑满页面剩余高度，空状态卡片到底、内容垂直居中 */
  #pfRoot{flex:1 1 auto;display:flex;flex-direction:column}
  #pfRoot > .pf-grid{flex:none}
  .pf-empty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
  .pf-empty .btn{align-self:center}
  .pf-empty-ico{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;justify-content:center;font-size:28px}
  .pf-empty-title{font-size:22px}
  .pf-empty-sub{max-width:520px;margin:10px auto 22px;font-size:14px;line-height:1.7;color:var(--ink-soft)}
  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(40,36,25,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:90;display:flex;padding:20px}
  .overlay.hidden{display:none}
  .modal{margin:auto;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fbfaf6;border-radius:var(--r-xl);box-shadow:0 40px 100px -30px rgba(40,35,20,.5);padding:24px 24px 22px}
  .modal.wide{width:min(860px,100%)}
  .modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .modal-title{font-size:22px;font-weight:400}
  .modal-close{background:var(--track) !important}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--border)}
  .pf-brokers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
  .pf-broker{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--divider);border-radius:var(--r-lg);background:#fff;cursor:pointer;text-align:left;font-family:var(--font);color:var(--ink)}
  .pf-broker.on{border-color:transparent;box-shadow:0 0 0 2px var(--sun)}
  .pf-broker b{font-weight:500;font-size:14px}
  .pf-broker span{font-size:12px;color:var(--ink-mute);line-height:1.5}
  .pf-help{font-size:12.5px;line-height:1.7;color:var(--ink-soft);background:rgba(246,207,74,.18);border-radius:var(--r-md);padding:10px 14px;margin:4px 0 14px}
  .pf-fields{display:grid;gap:12px}
  .pf-paste-hint{font-size:12.5px;color:var(--ink-soft);display:flex;gap:6px}
  .pf-paste-ok{font-size:12.5px;color:var(--green)}
  .pf-priv{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink-mute);margin-top:12px;line-height:1.6}
  .pf-err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
  .pf-edit-table{width:100%;border-collapse:collapse;font-size:13px}
  .pf-edit-table th{text-align:left;font-weight:400;font-size:12px;color:var(--ink-mute);padding:0 6px 6px}
  .pf-edit-table td{padding:4px 6px}
  .pf-edit-table input{width:100%;height:36px;padding:0 10px;border:0;border-radius:var(--r-sm);background:#fff;box-shadow:inset 0 0 0 1px var(--divider);font-family:var(--font);font-size:13.5px}
  .pf-edit-table input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--ring-border),0 0 0 3px var(--ring)}
  .pf-edit-del{border:0;background:none;color:var(--ink-mute);cursor:pointer;font-size:16px;padding:4px;border-radius:50%;display:inline-flex}
  .pf-edit-del:hover{color:var(--red);background:rgba(198,65,65,.08)}
  .pf-subtitle{font-size:14px;margin:18px 0 8px}
  .pf-row-add{margin-top:8px;height:32px;padding:0 12px;border:1.5px dashed var(--node);border-radius:var(--r-pill);background:none;cursor:pointer;font-family:var(--font);font-size:12.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
  .pf-csv{width:100%;min-height:160px;padding:12px 14px;border:0;border-radius:var(--r-md);background:#fff;box-shadow:inset 0 0 0 1px var(--divider);font-family:var(--mono);font-size:12.5px;resize:vertical}
  .pf-csv-result{font-size:13px;line-height:1.7;color:var(--ink-soft);margin-top:10px}
  @media (max-width:1100px){ .pf-grid{grid-template-columns:1fr} }
  @media (max-width:640px){
    .pf-stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}
    .pf-stat:nth-child(3){padding-left:0;border-left:0}
    .pf-card{padding:18px 16px}
    .pf-brokers{grid-template-columns:1fr}
    .pf-table .hide-sm{display:none}
  }
  /* 目标仓位 */
  .pf-titlewrap{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pf-alert{display:flex;align-items:center;gap:10px;width:100%;padding:12px 18px;border:0;border-radius:var(--r-pill);background:rgba(240,140,46,.14);color:#a4561a;
    cursor:pointer;font-family:var(--font);font-size:13.5px;text-align:left}
  .pf-alert i:first-child{font-size:17px}
  .pf-alert span{flex:1;min-width:0}
  .pf-alert:hover{background:rgba(240,140,46,.2)}
  .pf-tgt-list{display:flex;flex-direction:column;gap:8px}
  .pf-tgt{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(120px,1.4fr) 128px 70px minmax(180px,1.6fr);gap:14px;align-items:center;
    padding:12px 14px;border-radius:var(--r-md);background:rgba(29,29,27,.035)}
  .pf-tgt.link{cursor:pointer}
  .pf-tgt.link:hover{background:rgba(29,29,27,.06)}
  .pf-tgt-id{display:flex;align-items:center;gap:10px;min-width:0}
  .pf-tgt-id .pf-sym-id{display:flex;flex-direction:column;gap:3px;min-width:0}
  .pf-logo-cash{display:flex;align-items:center;justify-content:center;background:var(--dark);color:var(--sun);font-size:15px}
  .pf-tgt-bar{position:relative;height:10px;border-radius:var(--r-pill);background:rgba(29,29,27,.06)}
  .pf-tgt-band{position:absolute;top:0;bottom:0;border-radius:var(--r-pill);background:rgba(246,207,74,.38)}
  .pf-tgt-fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:var(--r-pill);background:var(--dark)}
  .pf-tgt.over .pf-tgt-fill{background:#f08c2e} .pf-tgt.under .pf-tgt-fill{background:#3a73ee}
  .pf-tgt-mark{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:3px;background:var(--sun-ink)}
  .pf-tgt-nums{font-variant-numeric:tabular-nums;white-space:nowrap}
  .pf-tgt-cur{font-size:15px}
  .pf-tgt-of{font-size:12px;color:var(--ink-mute)}
  .pf-tgt-drift{justify-self:start;font-size:12.5px;font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:var(--r-pill);background:var(--track);color:var(--ink-soft);white-space:nowrap}
  .pf-tgt.over .pf-tgt-drift{background:rgba(240,140,46,.16);color:#a4561a}
  .pf-tgt.under .pf-tgt-drift{background:rgba(58,115,238,.12);color:#2c5bc4}
  .pf-tgt-act{display:flex;flex-direction:column;gap:3px;min-width:0}
  .pf-tgt-say{font-size:13px;color:var(--ink)}
  .pf-tgt-say.ok{color:var(--ink-mute)}
  .pf-tgt-say.trimHot{color:var(--red)} .pf-tgt-say.addCheap,.pf-tgt-say.buildCheap{color:var(--green)}
  .pf-tgt-how{font-size:12px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  @media (max-width:980px){
    .pf-tgt{grid-template-columns:minmax(0,1fr) auto auto;row-gap:10px}
    .pf-tgt-bar{grid-column:1 / -1;grid-row:2}
    .pf-tgt-act{grid-column:1 / -1}
  }
  .pf-plan-rows{display:flex;flex-direction:column;gap:6px;margin:14px 0 10px;max-height:44vh;overflow:auto}
  .pf-plan-row{display:grid;grid-template-columns:auto minmax(0,1fr) 120px;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--r-md);background:rgba(29,29,27,.035)}
  .pf-plan-row .pf-sym-id{display:flex;flex-direction:column;gap:2px;min-width:0}

</style>

<script type="module">
import { applyI18n, LANG } from "/shared/i18n.js";
import { mountLangMenu } from "/shared/langmenu.js";
import { computeAnchors, priceToPhi, structValid, applyZoneColors, ZONES } from "/shared/core.js";

applyI18n();
const zh = LANG === "zh";
const T = (a, b) => (zh ? a : b);
mountLangMenu(document.getElementById("topActions"));

// ---------- 小工具 ----------
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ri = (name) => { const i = document.createElement("i"); i.className = "ri-" + name; i.setAttribute("aria-hidden", "true"); return i; };
const nf = (d) => new Intl.NumberFormat(zh ? "zh-CN" : "en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (v, d = 2) => (Number.isFinite(v) ? (v < 0 ? "−" : "") + nf(d).format(Math.abs(v)) : "—");
const pct = (v, d = 1) => (Number.isFinite(v) ? (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%" : "—");
const signed = (v) => (Number.isFinite(v) ? (v > 0 ? "+" : v < 0 ? "−" : "") + nf(2).format(Math.abs(v)) : "—");
// 小眼睛：隐藏金额与数量（百分比、每股价格照常显示），记在 localStorage
let hideAmt = localStorage.getItem("pf_hide") === "1";
const MASK = "••••";
const amt = (v, d = 2) => (hideAmt ? MASK : money(v, d));
const amtSigned = (v) => (hideAmt ? MASK : signed(v));
const qtyText = (v) => (hideAmt ? MASK : nf(0).format(v));
// 大号数字的小数部分缩小（与看板一致）
function setNum(node, text) {
  const s = String(text ?? ""), i = s.search(/\.\d/);
  node.textContent = i < 0 ? s : s.slice(0, i);
  if (i >= 0) node.appendChild(el("span", "num-dec", s.slice(i)));
}
function mountLogo(node, symbol, label) {
  node.textContent = (label || symbol || "?").trim().slice(0, 1).toUpperCase();
  const img = new Image(); img.alt = "";
  img.onload = () => { node.replaceChildren(img); node.classList.add("has-img"); };
  img.src = "/api/logo?symbol=" + encodeURIComponent(symbol);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "content-type": "application/json", ...(opts.headers || {}) } });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401) { location.replace("/login"); throw new Error("unauthorized"); }
  return { ok: r.ok, status: r.status, data: j };
}

const ZONE_NAMES = zh ? ["击球区", "低估", "合理", "高估", "泡沫区"] : ["Strike zone", "Undervalued", "Fair", "Overvalued", "Bubble"];
const NONE_NAME = T("未估值", "Not valued");
const BROKER_META = {
  longbridge: { name: T("长桥", "Longbridge"), icon: "bank-line", desc: T("实时持仓与余额", "Live positions & cash") },
  ibkr: { name: "IBKR", icon: "global-line", desc: T("Flex 日终数据", "Flex, end of day") },
  manual: { name: T("手动 / CSV", "Manual / CSV"), icon: "edit-box-line", desc: T("A 股等没有接口的券商", "For brokers without an API") },
};
const BASES = ["USD", "HKD", "CNY"];
let base = localStorage.getItem("pf_base") || (zh ? "CNY" : "USD");
if (!BASES.includes(base)) base = "USD";

// ---------- 身份 / 配色 ----------
const me = await api("/api/me");
if (!me.ok) { location.replace("/login"); }
const slug = me.data.board && me.data.board.slug;
if (slug) sessionStorage.setItem("owner_slug", slug); // 切到「自选」时导航可以立即显示
$("tabBoard").href = "/b/" + encodeURIComponent(slug || "");
document.title = (zh ? "资产" : "Portfolio") + " · ValuePort";
$("greet").textContent = T(`${me.data.username} 的全部账户`, `All accounts of ${me.data.username}`);
try {
  const st = await api("/api/my/settings");
  const m = {}; for (const z of ZONES) { const v = st.data.settings && st.data.settings["color_" + z.key]; if (v) m[z.key] = v; }
  applyZoneColors(m);
} catch {}

// 币种切换
function renderBaseSel() {
  const box = $("baseSel"); box.innerHTML = "";
  for (const b of BASES) {
    const btn = el("button", b === base ? "on" : "", b); btn.type = "button"; btn.setAttribute("role", "radio"); btn.setAttribute("aria-checked", b === base);
    btn.addEventListener("click", () => { if (b === base) return; base = b; localStorage.setItem("pf_base", b); renderBaseSel(); load(); });
    box.appendChild(btn);
  }
}
renderBaseSel();

// ---------- 汇总计算 ----------
// 现价落在看板估值区间的第几段；-1 = 未估值（不在看板或没设区间）
function zoneFor(it, price) {
  if (!it || !(price > 0)) return -1;
  const cfg = { ...it, price };
  if (!structValid(cfg)) return -1;
  return Math.min(ZONES.length - 1, Math.floor(Math.max(0, Math.min(179.9, priceToPhi(computeAnchors(cfg), price))) / (180 / ZONES.length)));
}
// 每只持仓：市值 / 成本 / 今日涨跌都换算成 base；同一标的跨账户合并成一行
function summarize(d) {
  const accName = new Map(d.accounts.map((a) => [a.id, a.name]));
  const fx = d.fx || {};
  const missingFx = new Set();
  const conv = (v, cur) => { const r = fx[cur]; if (!(r > 0)) { missingFx.add(cur); return NaN; } return v * r; };
  const bySym = new Map();
  let noPrice = 0;
  for (const h of d.holdings) {
    const price = d.quotes[h.symbol], prev = d.prevClose[h.symbol];
    if (!(price > 0)) noPrice++;
    const row = bySym.get(h.symbol) || { symbol: h.symbol, name: h.name, currency: h.currency, market: h.market, qty: 0, value: 0, cost: 0, costKnown: true, day: 0, price, accounts: new Set() };
    row.qty += h.quantity;
    row.value += price > 0 ? conv(h.quantity * price, h.currency) : NaN;
    if (Number.isFinite(h.costPrice) && h.costPrice > 0) row.cost += conv(h.quantity * h.costPrice, h.currency); else row.costKnown = false;
    if (price > 0 && prev > 0) row.day += conv(h.quantity * (price - prev), h.currency);
    row.accounts.add(accName.get(h.accountId) || "");
    if (!row.name && h.name) row.name = h.name;
    bySym.set(h.symbol, row);
  }
  const items = new Map(d.items.map((it) => [it.symbol, it]));
  const rows = [...bySym.values()].map((r) => {
    const it = items.get(r.symbol);
    return { ...r, zone: zoneFor(it, r.price), onBoard: !!it, ticker: it ? it.ticker : "", boardName: it ? it.name : "" };
  }).sort((a, b) => (b.value || 0) - (a.value || 0));
  const holdValue = rows.reduce((s, r) => s + (Number.isFinite(r.value) ? r.value : 0), 0);
  const cashRows = new Map();
  for (const c of d.cash) cashRows.set(c.currency, (cashRows.get(c.currency) || 0) + c.amount);
  let cashValue = 0;
  for (const [cur, amt] of cashRows) { const v = conv(amt, cur); if (Number.isFinite(v)) cashValue += v; }
  const pnlRows = rows.filter((r) => r.costKnown && Number.isFinite(r.value) && r.cost > 0);
  const pnl = pnlRows.reduce((s, r) => s + r.value - r.cost, 0), pnlCost = pnlRows.reduce((s, r) => s + r.cost, 0);
  const day = rows.reduce((s, r) => s + (Number.isFinite(r.day) ? r.day : 0), 0);
  const total = holdValue + cashValue;
  // 估值视角：按区间汇总市值
  const zones = [...ZONES.map((z, i) => ({ i, key: z.key, name: ZONE_NAMES[i], color: z.hex, value: 0, count: 0 })), { i: -1, key: "none", name: NONE_NAME, color: "", value: 0, count: 0 }];
  for (const r of rows) { if (!Number.isFinite(r.value)) continue; const z = zones.find((x) => x.i === r.zone); z.value += r.value; z.count++; }
  // 分布：市场 / 币种（含现金）
  const byMarket = new Map(), byCur = new Map();
  for (const r of rows) {
    if (!Number.isFinite(r.value)) continue;
    const mk = r.symbol.slice(0, 2) === "us" ? "US" : r.symbol.slice(0, 2) === "hk" ? "HK" : "CN";
    byMarket.set(mk, (byMarket.get(mk) || 0) + r.value);
    byCur.set(r.currency, (byCur.get(r.currency) || 0) + r.value);
  }
  if (cashValue) byMarket.set(T("现金", "Cash"), cashValue);
  for (const [cur, amt] of cashRows) { const v = conv(amt, cur); if (Number.isFinite(v)) byCur.set(cur, (byCur.get(cur) || 0) + v); }
  // 各账户：总值、现金、按区间分布、最大持仓
  const zoneOf = new Map(rows.map((r) => [r.symbol, r.zone]));
  const nameOf = new Map(rows.map((r) => [r.symbol, r.boardName || r.name || r.symbol.slice(2).toUpperCase()]));
  const perAcc = new Map(d.accounts.map((a) => [a.id, { value: 0, cash: 0, zones: new Map(), top: null }]));
  for (const h of d.holdings) {
    const p = d.quotes[h.symbol]; const v = p > 0 ? conv(h.quantity * p, h.currency) : NaN; const A = perAcc.get(h.accountId);
    if (!A || !Number.isFinite(v)) continue;
    A.value += v;
    const z = zoneOf.get(h.symbol); A.zones.set(z, (A.zones.get(z) || 0) + v);
    if (!A.top || v > A.top.value) A.top = { name: nameOf.get(h.symbol), value: v };
  }
  for (const c of d.cash) { const A = perAcc.get(c.accountId); const v = conv(c.amount, c.currency); if (A && Number.isFinite(v)) { A.cash += v; A.value += v; } }
  const byAccount = new Map(d.accounts.map((a) => [a.name, perAcc.get(a.id).value]));
  const s0 = { rows, holdValue, cashValue, total };
  return { ...s0, plan: planView(d, s0, items, conv), pnl, pnlPct: pnlCost ? pnl / pnlCost * 100 : NaN, day, dayPct: total - day ? day / (total - day) * 100 : NaN, zones, byMarket, byCur, byAccount, perAcc, missingFx: [...missingFx], noPrice };
}

// ---------- 渲染 ----------
let data = null, history = [];
// 先用本次会话里上一次的数据立即画出页面（避免切页时先空白再「蹦出」内容），后台拉最新数据再刷新
const CACHE_KEY = () => "pf_cache_" + me.data.username + "_" + base; // 按用户区分，换号不会看到别人的缓存
function fromCache() {
  try { const c = JSON.parse(sessionStorage.getItem(CACHE_KEY()) || "null"); if (c && c.data && Array.isArray(c.data.accounts)) { data = c.data; history = c.history || []; render(); return true; } } catch {}
  return false;
}
async function load() {
  const [r, h] = await Promise.all([api("/api/my/portfolio?base=" + base), api("/api/my/portfolio/history?days=3660")]);
  data = r.data; history = (h.data && h.data.points) || [];
  try { sessionStorage.setItem(CACHE_KEY(), JSON.stringify({ data, history })); } catch { /* 存不下就算了 */ }
  render();
}

function render() {
  const root = $("pfRoot");
  const fromSkel = !!$("pfSkel"); // 只在替换骨架时淡入；缓存先画、新数据再画时不重复淡入（否则会闪）
  root.innerHTML = "";
  if (!data.accounts.length) { root.appendChild(emptyState()); return; }
  const s = summarize(data);
  const grid = el("div", "pf-grid"), main = el("div", "pf-main"), side = el("div", "pf-side");
  const alert = driftAlert(s);
  if (alert) main.appendChild(alert);
  main.append(totalCard(s), curveCard(), targetCard(s), healthCard(s), zoneCard(s), holdingsCard(s));
  side.append(distCard(s), accountsCard(s));
  grid.append(main, side);
  if (fromSkel) grid.classList.add("sk-fade");
  root.appendChild(grid);
}

function emptyState() {
  const c = el("div", "pf-card pf-empty");
  const ico = el("div", "pf-empty-ico"); ico.appendChild(ri("pie-chart-2-line"));
  const b = el("button", "btn primary"); b.type = "button"; b.append(ri("add-line"), document.createTextNode(T("添加账户", "Add an account")));
  b.addEventListener("click", () => openAccount());
  c.append(ico, el("div", "pf-empty-title", T("把你的券商账户连进来", "Connect your brokerage accounts")),
    el("div", "pf-empty-sub", T("支持长桥（实时）、IBKR（Flex 日终数据），以及手动录入或导入 CSV（适合 A 股等没有接口的券商）。连上后，这里会汇总总资产，并把每只持仓和你看板上的估值区间对上：多少仓位在击球区，多少在泡沫区。",
      "Longbridge (live), IBKR (Flex, end of day), or manual entry / CSV import for brokers without an API. Once connected, this page totals your assets and maps every holding onto your board's valuation zones.")), b);
  return c;
}

function totalCard(s) {
  const c = el("section", "pf-card");
  const lab = el("div", "pf-total-lab"); lab.append(document.createTextNode(T("总资产", "Total assets")));
  // 小眼睛：一键隐藏 / 显示所有金额
  const eye = el("button", "pf-eye"); eye.type = "button";
  eye.setAttribute("aria-pressed", hideAmt ? "true" : "false");
  eye.setAttribute("aria-label", hideAmt ? T("显示金额", "Show amounts") : T("隐藏金额", "Hide amounts"));
  eye.title = eye.getAttribute("aria-label");
  eye.appendChild(ri(hideAmt ? "eye-off-line" : "eye-line"));
  eye.addEventListener("click", () => { hideAmt = !hideAmt; localStorage.setItem("pf_hide", hideAmt ? "1" : "0"); render(); });
  lab.appendChild(eye);
  c.appendChild(lab);
  const row = el("div", "pf-total");
  const num = el("span", "pf-total-num"); setNum(num, amt(s.total));
  const cur = el("span", "pf-total-cur", base);
  const day = el("span", "pf-day " + (s.day > 0 ? "up" : s.day < 0 ? "down" : ""), `${T("今日", "Today")} ${hideAmt ? "" : signed(s.day) + " "}(${pct(s.dayPct, 2)})`);
  row.append(num, cur, day);
  c.appendChild(row);
  const stats = el("div", "pf-stats");

const CURVE_RANGES = [["1M", 31], ["3M", 92], ["1Y", 366], ["ALL", 0]];

function curveCard() {

  ctl.appendChild(seg(CURVE_RANGES.map(([k]) => [k, k === "ALL" ? T("全部", "All") : k]), curveRange, (k) => { curveRange = k; }));

  const pts = history.filter((p) => p.accountId === curveAcc && p.day >= since).map((p) => [p.day, p[base]]).filter(([, v]) => Number.isFinite(v));
  const first = history.length ? history[0].day : null;
  if (pts.length < 2) {
    c.appendChild(el("div", "pf-curve-empty", first
      ? T(`资产曲线从 ${first} 开始记录：每天北京时间早上 6:30 自动同步并记一笔，打开本页时也会更新当天的数据。再过一天就能看到曲线。`,
          `Recording started on ${first}: a snapshot is taken every day at 22:30 UTC (and refreshed whenever you open this page). The curve appears after the second day.`)

  const sum = el("div", "pf-curve-sum " + (ch > 0 ? "up" : ch < 0 ? "down" : ""), `${hideAmt ? "" : signed(ch) + " "}(${pct(v0 ? ch / v0 * 100 : NaN, 2)}) · ${pts[0][0]} – ${pts[pts.length - 1][0]}`);
  c.appendChild(sum);
  const W = 1000, H = 260, PL = 4, PR = hideAmt ? 8 : 74, PT = 14, PB = 26;
  let lo = Math.min(...pts.map((p) => p[1])), hi = Math.max(...pts.map((p) => p[1]));
  const pad = (hi - lo) * 0.12 || hi * 0.02 || 1; lo -= pad; hi += pad;
  const X = (i) => PL + i / (pts.length - 1) * (W - PL - PR), Y = (v) => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "pf-curve-svg", preserveAspectRatio: "none" });
  const raw = (hi - lo) / 4, e = Math.pow(10, Math.floor(Math.log10(raw))), step = (raw / e <= 1 ? 1 : raw / e <= 2 ? 2 : raw / e <= 5 ? 5 : 10) * e;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {

    if (!hideAmt) svg.appendChild(mk("text", { x: W - PR + 10, y: Y(v) + 4, class: "pf-curve-lab" }, nf(0).format(v)));

  svg.appendChild(mk("path", { d: `${d}L${X(pts.length - 1)},${H - PB}L${X(0)},${H - PB}Z`, class: "pf-curve-area" }));
  svg.appendChild(mk("path", { d, class: "pf-curve-line" }));
  const nT = Math.min(6, pts.length);
  for (let k = 0; k < nT; k++) {

  }

  wrap.append(svg, tip); c.appendChild(wrap);
  svg.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect(); const vx = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((vx - PL) / (W - PL - PR) * (pts.length - 1))));
    hover.setAttribute("x1", X(i)); hover.setAttribute("x2", X(i)); hover.setAttribute("visibility", "visible");
    dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(pts[i][1])); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(el("b", "", hideAmt ? pct(v0 ? (pts[i][1] / v0 - 1) * 100 : NaN, 2) : money(pts[i][1], 0)), el("span", "", pts[i][0]));
    tip.hidden = false;
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, X(i) / W * r.width - tip.offsetWidth / 2)) + "px";
  });
  svg.addEventListener("mouseleave", () => { hover.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.hidden = true; });
  return c;
}

function healthChecks(s) {
  const out = [];
  const hv = s.holdValue, tot = s.total;

  const w = valued.map((r) => r.value / hv);

      value: t1.toFixed(1) + "%", text: T(`最大持仓 ${top.boardName || top.name || top.symbol} 占持仓 ${t1.toFixed(1)}%。` + (t1 > 25 ? "一只股票出问题就会明显拖累整体，确认这是高确定性的重仓。" : "没有单一持仓过重。"),
        `Largest position ${top.boardName || top.name || top.symbol} is ${t1.toFixed(1)}% of holdings.` + (t1 > 25 ? " One bad outcome would hurt the whole portfolio." : "") ) });
    const t5 = w.slice(0, 5).reduce((a, b) => a + b, 0) * 100;
    const eff = 1 / w.reduce((a, b) => a + b * b, 0);
    out.push({ key: "top5", title: T("持仓集中度", "Concentration"), level: valued.length <= 5 ? (eff < 3 ? "warn" : "ok") : t5 > 80 ? "bad" : t5 > 60 ? "warn" : "ok",
      value: T(`有效 ${eff.toFixed(1)} 只`, `${eff.toFixed(1)} effective`),
      text: T(`共 ${valued.length} 只持仓，前五大占 ${t5.toFixed(1)}%；按权重折算相当于 ${eff.toFixed(1)} 只等权持仓（有效持仓数，避免几只极小仓位虚增数量）。`,
        `${valued.length} holdings, top five ${t5.toFixed(1)}%; equivalent to ${eff.toFixed(1)} equal-weight positions.`) });
  }

      : cashPct < 5 ? T("现金不到 5%，标的跌进击球区时没有余力加仓。", "Under 5% cash leaves little room to add when names hit the strike zone.")

    text: T(`高估与泡沫区合计占持仓 ${risk.toFixed(1)}%` + (zv(4).count ? `，其中泡沫区 ${zv(4).count} 只。` : "。") + (risk > 20 ? "可以考虑在泡沫区逐步减仓。" : ""),
      `Overvalued + bubble is ${risk.toFixed(1)}% of holdings.` + (risk > 20 ? " Consider trimming bubble-zone names." : "")) });
  const strike = hv ? zv(0).value / hv * 100 : 0;
  const none = hv ? zv(-1).value / hv * 100 : 0;

    text: none ? T(`${zv(-1).count} 只持仓（${none.toFixed(1)}%）不在看板或没设合理区间，相当于不知道贵贱。把它们加到看板并估值后，体检才完整。`,
      `${zv(-1).count} holding(s) (${none.toFixed(1)}%) have no fair range on your board.`) : T("每只持仓都有估值区间。", "Every holding has a fair range.") });
  const topShare = (m) => { const e = [...m.entries()].sort((a, b) => b[1] - a[1])[0]; const t = [...m.values()].reduce((a, b) => a + b, 0); return e && t ? [e[0], e[1] / t * 100] : ["", 0]; };
  const [mk, mp] = topShare(s.byMarket), [ck, cp] = topShare(s.byCur);
  out.push({ key: "mkt", title: T("市场 / 币种集中度", "Market / currency"), level: mp > 85 || cp > 85 ? "warn" : "ok", value: `${mk} ${mp.toFixed(0)}%`,

      `${losers.length} position(s) are down over 20% (${lw.toFixed(1)}% of holdings). Re-check the original thesis.`) : T("没有亏损超过 20% 的持仓。", "No position is down more than 20%.") });

}

// ---------- 目标仓位 ----------
// 偏离按「5/25 规则」判定：|当前 − 目标| 超过 band 个百分点，或超过目标的 rel%，二者先到为准（小仓位也管得住）。
// 价值投资不机械再平衡：建议动作结合看板估值区间——超配且高估才明确减，低配且在击球区 / 低估才明确加。
const DRIFT_TEXT = {
  trimHot: T("超配且已高估，考虑减仓", "Overweight and overvalued — consider trimming"),
  trimHold: T("超配但仍低估，可以继续持有，留意集中度", "Overweight but still cheap — fine to hold, watch concentration"),
  trim: T("超配，按计划减仓回到目标", "Overweight — trim back to target"),
  addCheap: T("低配且价格便宜，是加仓的好时机", "Underweight and cheap — a good time to add"),
  addWait: T("低配但已高估，不急着补，等更好的价格", "Underweight but expensive — wait for a better price"),
  add: T("低配，按计划加仓回到目标", "Underweight — add back to target"),
  build: T("计划建仓", "Planned position"),
  buildCheap: T("计划建仓，已进入击球区 / 低估", "Planned — now in strike / undervalued zone"),
  ok: T("在容忍带内", "Within band"),
  cashLow: T("现金低于目标，加仓余力不足", "Cash below target — less room to add"),
  cashHigh: T("现金高于目标，可以留意击球区标的", "Cash above target — look for strike-zone names"),
};
function planView(d, s, items, conv) {
  const plan = d.plan || { targets: {}, cash: null, band: 5, rel: 25 };
  const targets = plan.targets || {};
  const active = Object.keys(targets).length > 0 || Number.isFinite(plan.cash);
  const tot = s.total;
  const tolOf = (t) => Math.max(0.1, Math.min(plan.band, t * plan.rel / 100));
  const held = new Map(s.rows.map((r) => [r.symbol, r]));
  const rows = [];
  for (const [sym, tgt] of Object.entries(targets)) {
    const h = held.get(sym), it = items.get(sym);
    const price = h ? h.price : d.quotes[sym];
    const cur = h && Number.isFinite(h.value) && tot ? h.value / tot * 100 : 0;
    const zone = h ? h.zone : zoneFor(it, price);
    const currency = h ? h.currency : (sym.startsWith("us") ? "USD" : sym.startsWith("hk") ? "HKD" : "CNY");
    const tol = tolOf(tgt), drift = cur - tgt;
    const status = !h ? "build" : drift > tol ? "over" : drift < -tol ? "under" : "ok";
    const hot = zone >= 3, cheap = zone >= 0 && zone <= 1;
    const action = status === "build" ? (cheap ? "buildCheap" : "build")
      : status === "over" ? (hot ? "trimHot" : cheap ? "trimHold" : "trim")
      : status === "under" ? (cheap ? "addCheap" : hot ? "addWait" : "add") : "ok";
    const trade = (tgt - cur) / 100 * tot;                        // 回到目标需要买(+)卖(−)多少（base 货币）
    const px = price > 0 ? conv(price, currency) : NaN;          // 每股价格折成 base
    const shares = Number.isFinite(px) && px > 0 ? Math.round(trade / px) : NaN;
    rows.push({ symbol: sym, name: (it && it.name) || (h && (h.boardName || h.name)) || sym.slice(2).toUpperCase(), ticker: it ? it.ticker : "",
      cur, tgt, tol, drift, status, zone, action, trade, shares, currency });
  }
  // 设了计划但没给目标的持仓：单独列出，不报警
  const untargeted = active ? s.rows.filter((r) => !(r.symbol in targets) && Number.isFinite(r.value) && r.value > 0)
    .map((r) => ({ symbol: r.symbol, name: r.boardName || r.name || r.symbol, cur: tot ? r.value / tot * 100 : 0, zone: r.zone })) : [];
  let cash = null;
  if (Number.isFinite(plan.cash)) {
    const cur = tot ? s.cashValue / tot * 100 : 0, tol = tolOf(plan.cash), drift = cur - plan.cash;
    cash = { cur, tgt: plan.cash, tol, drift, status: drift > tol ? "over" : drift < -tol ? "under" : "ok", trade: (plan.cash - cur) / 100 * tot };
  }
  const rank = (r) => (r.status === "over" || r.status === "under" ? 0 : r.status === "build" ? 1 : 2);
  rows.sort((a, b) => rank(a) - rank(b) || Math.abs(b.drift) - Math.abs(a.drift));
  const allocated = Object.values(targets).reduce((a, b) => a + b, 0) + (Number.isFinite(plan.cash) ? plan.cash : 0);
  const offCount = rows.filter((r) => r.status === "over" || r.status === "under").length + (cash && cash.status !== "ok" ? 1 : 0);
  return { plan, active, rows, untargeted, cash, allocated, offCount };
}

// 顶部提醒：有超出容忍带的偏离时显示，点一下滚到目标仓位卡

          + (Number.isFinite(r.shares) && r.shares !== 0 ? T(`（约 ${qtyText(Math.abs(r.shares))} 股）`, ` (~${qtyText(Math.abs(r.shares))} sh)`) : "");

// 设置目标弹窗：已持有 + 已设目标的标的各一行；可从看板加标的（计划建仓）；现金目标与容忍带
function openPlan(s) {
  const pv = s.plan;
  $("planTitle").textContent = T("设置目标仓位", "Target allocation");
  $("planCancel").textContent = T("取消", "Cancel"); $("planSave").textContent = T("保存", "Save"); $("planErr").textContent = "";

  body.appendChild(el("div", "pf-help", T("按占总资产（含现金）的百分比填写；留空或 0 表示不设目标。小仓位也会按相对偏离提醒。", "Percent of total assets including cash. Leave blank or 0 for no target.")));
  const tbl = el("div", "pf-plan-rows");
  const inputs = new Map();
  const curW = new Map(s.rows.map((r) => [r.symbol, s.total && Number.isFinite(r.value) ? r.value / s.total * 100 : 0]));
  const names = new Map([...data.items.map((it) => [it.symbol, it.name || it.ticker]), ...s.rows.map((r) => [r.symbol, r.boardName || r.name || r.symbol])]);
  const addRow = (sym) => {
    if (inputs.has(sym)) return;

    const lg = el("span", "pf-logo"); mountLogo(lg, sym, names.get(sym) || sym);
    const nm = el("div", "pf-sym-id"); nm.append(el("span", "pf-sym-name", names.get(sym) || sym.slice(2).toUpperCase()), el("span", "pf-sym-sub", T("当前 ", "Now ") + (curW.get(sym) || 0).toFixed(1) + "%"));
    const box = el("div", "pf-plan-in"); const i = el("input"); i.type = "number"; i.min = "0"; i.max = "100"; i.step = "0.5"; i.inputMode = "decimal"; i.placeholder = "—";
    if (pv.plan.targets[sym]) i.value = String(pv.plan.targets[sym]);
    i.addEventListener("input", sum);
    box.append(i, el("span", "", "%"));
    r.append(lg, nm, box); tbl.appendChild(r); inputs.set(sym, i);
  };
  [...new Set([...s.rows.map((r) => r.symbol), ...Object.keys(pv.plan.targets)])].forEach(addRow);
  body.appendChild(tbl);
  // 从看板加一个还没持有的标的（计划建仓）
  const pool = data.items.filter((it) => it.symbol && !inputs.has(it.symbol));
  if (pool.length) {
    const sel = el("select", "pf-plan-add");
    sel.appendChild(el("option", "", T("＋ 从看板添加计划建仓的标的", "+ Add a planned position from your board")));
    pool.forEach((it) => { const o = el("option", "", `${it.name || it.ticker} · ${it.ticker}`); o.value = it.symbol; sel.appendChild(o); });
    sel.addEventListener("change", () => { if (sel.value && sel.selectedIndex > 0) { addRow(sel.value); sel.options[sel.selectedIndex].remove(); sel.selectedIndex = 0; sum(); } });
    body.appendChild(sel);
  }
  const fill = el("button", "pf-row-add"); fill.type = "button"; fill.append(ri("equalizer-line"), document.createTextNode(T("按当前占比填入", "Fill with current weights")));
  fill.addEventListener("click", () => { for (const [sym, i] of inputs) { const w = curW.get(sym) || 0; i.value = w ? String(Math.round(w * 2) / 2) : ""; } cashIn.value = s.total ? String(Math.round(s.cashValue / s.total * 100 * 2) / 2) : ""; sum(); });
  body.appendChild(fill);
  const opts = el("div", "pf-plan-opts");
  const field = (label, val, step, hint) => { const f = el("label", "pf-plan-opt"); const i = el("input"); i.type = "number"; i.step = step; i.inputMode = "decimal"; if (val !== null && val !== undefined) i.value = String(val); f.append(el("span", "", label), i, el("small", "", hint)); opts.appendChild(f); return i; };
  const cashIn = field(T("现金目标 %", "Cash target %"), pv.plan.cash, "0.5", T("留作击球区的弹药", "Dry powder for strike-zone buys"));
  const bandIn = field(T("绝对容忍 pp", "Absolute band pp"), pv.plan.band, "0.5", T("偏离超过几个百分点提醒", "Alert beyond ± this many points"));
  const relIn = field(T("相对容忍 %", "Relative band %"), pv.plan.rel, "1", T("偏离超过目标的百分之几提醒", "Alert beyond this share of the target"));
  cashIn.addEventListener("input", sum);
  body.appendChild(opts);
  const total = el("div", "pf-plan-sum"); body.appendChild(total);
  function sum() {
    let t = 0; for (const i of inputs.values()) t += Number(i.value) || 0; t += Number(cashIn.value) || 0;
    total.textContent = T(`已分配 ${t.toFixed(1)}%`, `Allocated ${t.toFixed(1)}%`) + (t > 100.0001 ? T("，超过 100% 了", " — over 100%") : t < 99.95 ? T(`，剩余 ${(100 - t).toFixed(1)}%`, `, ${(100 - t).toFixed(1)}% left`) : "");
    total.classList.toggle("bad", t > 100.0001);
  }
  sum();
  $("planSave").onclick = async () => {
    $("planErr").textContent = "";
    const targets = {}; for (const [sym, i] of inputs) { const v = Number(i.value); if (i.value !== "" && v > 0) targets[sym] = v; }
    const r = await api("/api/my/portfolio/plan", { method: "PUT", body: JSON.stringify({ targets, cash: cashIn.value === "" ? null : Number(cashIn.value), band: Number(bandIn.value), rel: Number(relIn.value) }) });
    if (!r.ok) { $("planErr").textContent = r.data.error || T("保存失败", "Save failed"); return; }
    closeOverlays(); data.plan = r.data.plan; render(); load();
  };
  $("planOverlay").classList.remove("hidden");
}

// 分类配色：墨黑 / 暖黄 / 暖灰 / 绿 / 蓝 / 橙 / 浅灰，与看板同一套色调
const PALETTE = ["#2a2a29", "#f6cf4a", "#a39e93", "#3a9e64", "#3a73ee", "#f08c2e", "#d8d2c4", "#7a5c3a"];
// 环形图：entries=[[label, value]]，大到小排列；环心写合计（隐藏金额时写条目数）
function donut(title, map) {
  const box = el("div", "pf-donut");
  box.appendChild(el("div", "pf-dist-title", title));
  const entries = [...map.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const tot = entries.reduce((a, [, v]) => a + v, 0);
  const body = el("div", "pf-donut-body");
  const NS = "http://www.w3.org/2000/svg", R = 42, C = 2 * Math.PI * R;
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 120 120"); svg.setAttribute("class", "pf-donut-svg");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", title + "：" + entries.map(([k, v]) => `${k} ${(v / tot * 100).toFixed(1)}%`).join("，"));
  const ring = document.createElementNS(NS, "circle"); ring.setAttribute("cx", 60); ring.setAttribute("cy", 60); ring.setAttribute("r", R); ring.setAttribute("class", "pf-donut-track"); svg.appendChild(ring);
  let off = 0; const gap = entries.length > 1 ? 1.6 : 0;
  entries.forEach(([k, v], i) => {
    const len = v / tot * C;
    const arc = document.createElementNS(NS, "circle");
    arc.setAttribute("cx", 60); arc.setAttribute("cy", 60); arc.setAttribute("r", R);
    arc.setAttribute("stroke", PALETTE[i % PALETTE.length]); arc.setAttribute("class", "pf-donut-arc");
    arc.setAttribute("stroke-dasharray", `${Math.max(0.01, len - gap)} ${C}`); arc.setAttribute("stroke-dashoffset", -off);
    svg.appendChild(arc); off += len;
  });
  const mid = el("div", "pf-donut-mid");
  mid.append(el("span", "pf-donut-mid-v", hideAmt ? String(entries.length) : money(tot, 0)), el("span", "pf-donut-mid-k", hideAmt ? T("项", "items") : base));
  const ring2 = el("div", "pf-donut-ring"); ring2.append(svg, mid);
  const legend = el("div", "pf-legend");
  entries.forEach(([k, v], i) => {
    const r = el("div", "pf-legend-row"); const dot = el("i"); dot.style.background = PALETTE[i % PALETTE.length];
    r.append(dot, el("span", "pf-legend-k", k), el("span", "pf-legend-v", (v / tot * 100).toFixed(1) + "%"));
    legend.appendChild(r);
  });
  if (!entries.length) legend.appendChild(el("div", "pf-note", "—"));
  body.append(ring2, legend);
  box.appendChild(body);
  return box;
}

const CRED_UI = {
  longbridge: {
    help: T("在长桥开放平台（open.longportapp.com）的开发者中心获取 App Key、App Secret 和 Access Token。Access Token 有有效期，过期后在这里更新即可。",
      "Get the App Key, App Secret and Access Token from the Longbridge developer center (open.longportapp.com). The access token expires; update it here when it does."),
    fields: [["appKey", "App Key"], ["appSecret", "App Secret"], ["accessToken", "Access Token"]],
  },
  ibkr: {
    help: T("在 IBKR 账户管理 → 报表 → Flex 查询里，新建一个包含「Open Positions」和「Cash Report」的 Activity Flex Query，记下 Query ID；再在 Flex Web Service 设置里生成 Token。数据为日终，不是实时。",
      "In IBKR Account Management → Reports → Flex Queries, create an Activity Flex Query with Open Positions and Cash Report and note its Query ID; then generate a token under Flex Web Service. Data is end of day, not live."),
    fields: [["token", "Flex Token"], ["queryId", "Query ID"]],
  },
  manual: {
    help: T("手动录入持仓，或导入券商导出的持仓 CSV（支持中英文表头）。适合 A 股等没有对个人开放接口的券商。", "Enter holdings by hand or import a holdings CSV exported from your broker (English or Chinese headers). For brokers without a public API, such as most A-share brokers."),
    fields: [],
  },
};
let accEditing = null, accBroker = "longbridge";
// 一次粘贴多项凭证（长桥「复制所有」等）：拆成 { appKey, appSecret, accessToken } / { token, queryId }
// 支持 KEY=VALUE（可带 export / LONGPORT_ / LONGBRIDGE_ 前缀与引号）、「标签: 值」、标签与值各占一行、JSON；
// 长桥若只有三行裸值，按长度判断（App Key 最短、Access Token 最长）
function parseCredBlob(text, broker) {
  const want = broker === "ibkr" ? { token: /token/, queryId: /query/ } : { appKey: /appkey|^key$/, appSecret: /appsecret|^secret$/, accessToken: /accesstoken|^token$/ };
  const norm = (k) => String(k).toLowerCase().replace(/^(export\s+)?(longport|longbridge|lb|ibkr|flex)[_\s-]*/, "").replace(/[^a-z]/g, "");
  const out = {};
  const put = (k, v) => { const nk = norm(k); v = String(v || "").trim().replace(/^["'`]|["'`,;]+$/g, "").replace(/^["'`]|["'`]$/g, ""); if (!v) return; for (const [f, re] of Object.entries(want)) if (!out[f] && re.test(nk)) { out[f] = v; return; } };
  const t = String(text || "").trim();
  try { const j = JSON.parse(t); if (j && typeof j === "object") { for (const [k, v] of Object.entries(j)) put(k, v); return out; } } catch {}
  const lines = t.split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
  const bare = [];
  for (let i = 0; i < lines.length; i++) {
    const m = /^(?:export\s+)?["']?([A-Za-z][A-Za-z _-]*?)["']?\s*[:=：]\s*(.+)$/.exec(lines[i]);
    if (m) { put(m[1], m[2]); continue; }
    if (Object.values(want).some((re) => re.test(norm(lines[i]))) && i + 1 < lines.length) { put(lines[i], lines[i + 1]); i++; continue; }
    bare.push(lines[i]);
  }
  if (broker !== "ibkr" && !Object.keys(out).length && bare.length === 3) {
    const [k, sc, tk] = [...bare].sort((a, b) => a.length - b.length);
    out.appKey = k; out.appSecret = sc; out.accessToken = tk;
  }
  return out;
}
function openAccount(acc) {
  accEditing = acc || null;
  accBroker = acc ? acc.broker : "longbridge";
  $("accTitle").textContent = acc ? T("账户设置", "Account settings") : T("添加账户", "Add account");
  $("accCancel").textContent = T("取消", "Cancel");
  $("accSave").textContent = acc ? T("保存", "Save") : T("连接并同步", "Connect & sync");
  $("accPriv").textContent = T("凭证加密保存，只用来读取持仓和余额，不会下单；接口也永远不会返回明文。", "Credentials are stored encrypted, used only to read positions and balances (never to trade), and never returned in plain text.");
  $("accErr").textContent = "";
  renderAccForm();
  $("accOverlay").classList.remove("hidden");
}
function renderAccForm() {
  const bx = $("accBrokers"); bx.innerHTML = "";
  bx.style.display = accEditing ? "none" : "";
  for (const k of ["longbridge", "ibkr", "manual"]) {
    const m = BROKER_META[k]; const b = el("button", "pf-broker" + (k === accBroker ? " on" : "")); b.type = "button";
    b.append(el("b", "", m.name), el("span", "", m.desc));
    b.addEventListener("click", () => { accBroker = k; renderAccForm(); });
    bx.appendChild(b);
  }
  const ui = CRED_UI[accBroker];
  $("accHelp").textContent = ui.help;
  const f = $("accFields"); f.innerHTML = "";
  const nameLab = el("label", "field"); nameLab.append(el("span", "f-lab", T("账户名称", "Account name")));
  const nameIn = el("input", "plain"); nameIn.id = "accName"; nameIn.value = accEditing ? accEditing.name : BROKER_META[accBroker].name; nameIn.maxLength = 40; nameLab.appendChild(nameIn); f.appendChild(nameLab);
  if (ui.fields.length > 1) f.appendChild(el("div", "pf-paste-hint", accBroker === "longbridge"
    ? T("可以在长桥开发者中心点「复制所有」，然后粘贴到任意一栏，会自动拆开填好三项。", "Tip: use “Copy all” in the Longbridge developer center and paste into any field — all three are filled in.")
    : T("也可以把 Token 和 Query ID 一起粘贴到任意一栏。", "You can paste the token and query ID together into either field.")));
  const credInputs = [];
  for (const [k, lab] of ui.fields) {
    const l = el("label", "field"); l.append(el("span", "f-lab", lab));
    const i = el("input"); i.type = "password"; i.autocomplete = "off"; i.spellcheck = false; i.dataset.k = k;
    i.placeholder = accEditing ? T("留空则不修改", "Leave blank to keep") : "";
    // 粘贴的内容含多项时，自动拆开分别填入
    i.addEventListener("paste", (e) => {
      const text = (e.clipboardData || window.clipboardData).getData("text");
      if (!/[\r\n]|[:=：].*[:=：]|^\s*\{/.test(text)) return; // 单个值：照常粘贴
      const got = parseCredBlob(text, accBroker);
      const n = Object.keys(got).length;
      if (n < 2) return;
      e.preventDefault();
      for (const inp of credInputs) if (got[inp.dataset.k]) inp.value = got[inp.dataset.k];
      $("accErr").textContent = "";
      const ok = $("accFields").querySelector(".pf-paste-ok") || el("div", "pf-paste-ok");
      ok.textContent = T(`已识别 ${n} 项：${Object.keys(got).map((x) => ui.fields.find(([k]) => k === x)[1]).join("、")}`, `Recognised ${n}: ${Object.keys(got).map((x) => ui.fields.find(([k]) => k === x)[1]).join(", ")}`);
      $("accFields").appendChild(ok);
    });
    credInputs.push(i);
    l.appendChild(i); f.appendChild(l);
  }
  if (accEditing) {
    const del = el("button", "btn ghost danger"); del.type = "button"; del.append(ri("delete-bin-line"), document.createTextNode(T("删除这个账户", "Delete this account")));
    del.style.justifySelf = "start";
    del.addEventListener("click", async () => {
      if (!confirm(T("删除后，这个账户的持仓记录会一并清除。确定删除？", "This also removes the account's holdings. Delete?"))) return;
      await api(`/api/my/portfolio/accounts/${accEditing.id}`, { method: "DELETE" }); closeOverlays(); load();
    });
    f.appendChild(del);
  }
}
$("accSave").addEventListener("click", async () => {
  $("accErr").textContent = "";
  const name = $("accName").value.trim();
  const creds = {}; let any = false, all = true;
  $("accFields").querySelectorAll("input[data-k]").forEach((i) => { const v = i.value.trim(); if (v) { creds[i.dataset.k] = v; any = true; } else all = false; });
  const btn = $("accSave"); btn.disabled = true;
  try {
    if (accEditing) {
      const body = { name };
      if (any) { if (!all) { $("accErr").textContent = T("更换凭证时需要把所有字段都填上。", "Fill in every field to replace credentials."); return; } body.creds = creds; }
      const r = await api(`/api/my/portfolio/accounts/${accEditing.id}`, { method: "PUT", body: JSON.stringify(body) });
      if (!r.ok) { $("accErr").textContent = r.data.error || T("保存失败", "Save failed"); return; }
      if (body.creds) await api(`/api/my/portfolio/accounts/${accEditing.id}/sync`, { method: "POST" });
    } else {
      if (CRED_UI[accBroker].fields.length && !all) { $("accErr").textContent = T("请把所有字段都填上。", "Please fill in every field."); return; }
      btn.textContent = T("连接中…", "Connecting…");
      const r = await api("/api/my/portfolio/accounts", { method: "POST", body: JSON.stringify({ broker: accBroker, name, creds: CRED_UI[accBroker].fields.length ? creds : undefined }) });
      if (!r.ok) { $("accErr").textContent = r.data.error || T("添加失败", "Could not add the account"); return; }
      if (r.data.sync && !r.data.sync.ok) { closeOverlays(); await load(); return; } // 失败原因显示在账户卡上
      if (accBroker === "manual") { closeOverlays(); await load(); const a = data.accounts.find((x) => x.id === r.data.id); if (a) openHoldings(a); return; }
    }
    closeOverlays(); await load();
  } finally { btn.disabled = false; btn.textContent = accEditing ? T("保存", "Save") : T("连接并同步", "Connect & sync"); }
});

let holdAcc = null, holdMode = "edit";
function openHoldings(acc) {
  holdAcc = acc; holdMode = "edit";
  $("holdTitle").textContent = T(`编辑持仓 · ${acc.name}`, `Edit holdings · ${acc.name}`);
  $("holdCancel").textContent = T("取消", "Cancel"); $("holdSave").textContent = T("保存", "Save"); $("holdErr").textContent = "";
  const body = $("holdBody"); body.innerHTML = "";
  body.appendChild(el("div", "pf-help", T("代码支持 AAPL.US / 700.HK / 600519.SH 或 usAAPL / hk00700 / sh600519 等写法；成本价可留空。", "Symbols like AAPL.US / 700.HK / 600519.SH or usAAPL / hk00700 / sh600519. Cost price is optional.")));
  const mk = (cols) => { const t = el("table", "pf-edit-table"); const h = el("tr"); for (const c of [...cols, ""]) h.appendChild(el("th", "", c)); t.appendChild(h); return t; };
  const posT = mk([T("代码", "Symbol"), T("名称", "Name"), T("数量", "Qty"), T("成本价", "Cost"), T("币种", "Currency")]);
  const cashT = mk([T("币种", "Currency"), T("金额", "Amount")]);
  const addRow = (t, vals) => {
    const tr = el("tr");
    vals.forEach((v) => { const td = el("td"); const i = el("input"); i.value = v ?? ""; td.appendChild(i); tr.appendChild(td); });
    const td = el("td"); const d = el("button", "pf-edit-del"); d.type = "button"; d.appendChild(ri("close-line")); d.addEventListener("click", () => tr.remove()); td.appendChild(d); tr.appendChild(td);
    t.appendChild(tr);
  };
  const mine = data.holdings.filter((h) => h.accountId === acc.id);
  mine.forEach((h) => addRow(posT, [h.symbol, h.name, h.quantity, h.costPrice ?? "", h.currency]));
  if (!mine.length) addRow(posT, ["", "", "", "", ""]);
  data.cash.filter((c) => c.accountId === acc.id).forEach((c) => addRow(cashT, [c.currency, c.amount]));
  const addBtn = (t, n) => { const b = el("button", "pf-row-add"); b.type = "button"; b.append(ri("add-line"), document.createTextNode(T("加一行", "Add row"))); b.addEventListener("click", () => addRow(t, Array(n).fill(""))); return b; };
  body.append(el("div", "pf-subtitle", T("持仓", "Positions")), posT, addBtn(posT, 5), el("div", "pf-subtitle", T("现金", "Cash")), cashT, addBtn(cashT, 2));
  holdAcc._tables = { posT, cashT };
  $("holdOverlay").classList.remove("hidden");
}
// 前端先把常见写法规整成腾讯格式（后端会再校验）
function normSymbol(raw, currency) {
  const s = String(raw || "").trim();
  if (/^(us|hk|sh|sz)[A-Za-z0-9.]+$/.test(s)) return s.slice(0, 2) + (s.startsWith("us") ? s.slice(2).toUpperCase() : s.slice(2));
  let m = /^([A-Za-z.]+)\.US$/i.exec(s); if (m) return "us" + m[1].toUpperCase();
  m = /^(\d{1,5})\.HK$/i.exec(s); if (m) return "hk" + m[1].padStart(5, "0");
  m = /^(\d{6})\.(SH|SS)$/i.exec(s); if (m) return "sh" + m[1];
  m = /^(\d{6})\.SZ$/i.exec(s); if (m) return "sz" + m[1];
  if (/^\d{6}$/.test(s)) return (/^[695]/.test(s) ? "sh" : "sz") + s;
  if (/^\d{1,5}$/.test(s)) return "hk" + s.padStart(5, "0");
  if (/^[A-Za-z.]+$/.test(s)) return "us" + s.toUpperCase();
  return s;
}
const curOf = (sym) => (sym.startsWith("us") ? "USD" : sym.startsWith("hk") ? "HKD" : "CNY");
$("holdSave").addEventListener("click", async () => {
  if (holdMode === "import") return doImport();
  $("holdErr").textContent = "";
  const { posT, cashT } = holdAcc._tables;
  const positions = [], cash = [];
  posT.querySelectorAll("tr").forEach((tr, i) => {
    if (!i) return; const v = [...tr.querySelectorAll("input")].map((x) => x.value.trim()); if (!v[0] && !v[2]) return;
    const symbol = normSymbol(v[0]);
    positions.push({ symbol, name: v[1], quantity: Number(v[2].replace(/,/g, "")), costPrice: v[3] === "" ? null : Number(v[3].replace(/,/g, "")), currency: (v[4] || curOf(symbol)).toUpperCase() });
  });
  cashT.querySelectorAll("tr").forEach((tr, i) => {
    if (!i) return; const v = [...tr.querySelectorAll("input")].map((x) => x.value.trim()); if (!v[0] && !v[1]) return;
    cash.push({ currency: v[0].toUpperCase(), amount: Number(v[1].replace(/,/g, "")) });
  });
  const r = await api(`/api/my/portfolio/accounts/${holdAcc.id}/holdings`, { method: "PUT", body: JSON.stringify({ positions, cash }) });
  if (!r.ok) { $("holdErr").textContent = (r.data.errors || [r.data.error || T("保存失败", "Save failed")]).join("；"); return; }
  closeOverlays(); load();
});

function openImport(acc) {
  holdAcc = acc; holdMode = "import";
  $("holdTitle").textContent = T(`导入 CSV · ${acc.name}`, `Import CSV · ${acc.name}`);
  $("holdCancel").textContent = T("取消", "Cancel"); $("holdSave").textContent = T("导入", "Import"); $("holdErr").textContent = "";
  const body = $("holdBody"); body.innerHTML = "";
  body.appendChild(el("div", "pf-help", T("选择券商导出的持仓文件，或直接粘贴内容。需要包含代码和数量两列（中英文表头都可以，如「证券代码 / 股票余额 / 成本价」）。导入会替换这个账户现有的持仓，现金不变。",
    "Choose a holdings file exported from your broker, or paste it. It needs symbol and quantity columns (English or Chinese headers). Importing replaces this account's positions; cash is kept.")));
  const file = el("input"); file.type = "file"; file.accept = ".csv,.txt,text/csv"; file.style.marginBottom = "10px";
  const ta = el("textarea", "pf-csv"); ta.id = "csvText"; ta.placeholder = "symbol,name,quantity,cost,currency\nAAPL.US,Apple,10,150,USD";
  file.addEventListener("change", async () => { const f = file.files && file.files[0]; if (!f) return; ta.value = await f.text(); });
  body.append(file, ta, el("div", "pf-csv-result"));
  $("holdOverlay").classList.remove("hidden");
}
async function doImport() {
  $("holdErr").textContent = "";
  const text = $("csvText").value;
  if (!text.trim()) { $("holdErr").textContent = T("请先选择文件或粘贴内容。", "Choose a file or paste its contents first."); return; }
  const r = await api(`/api/my/portfolio/accounts/${holdAcc.id}/import`, { method: "POST", body: JSON.stringify({ text }) });
  if (!r.ok) { $("holdErr").textContent = r.data.error || T("导入失败", "Import failed"); return; }
  const res = document.querySelector(".pf-csv-result");
  const skipped = (r.data.unsupported || []).length, errs = (r.data.errors || []).length;
  res.textContent = T(`已导入 ${r.data.imported} 只持仓` + (skipped ? `，跳过 ${skipped} 个不支持的品种` : "") + (errs ? `，${errs} 行有问题未导入` : "") + "。",
    `Imported ${r.data.imported} position(s)` + (skipped ? `, skipped ${skipped} unsupported` : "") + (errs ? `, ${errs} row(s) had problems` : "") + ".");
  await load();
  $("holdSave").textContent = T("完成", "Done"); holdMode = "done";
  $("holdSave").onclick = () => { closeOverlays(); $("holdSave").onclick = null; };
}

fromCache();
