<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>登录 · 估值钟摆</title>
<link rel="stylesheet" href="/shared/styles.css">
<style>.auth{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh);padding:0 24px 24px}
.auth h2{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em;margin:0 -24px 18px;padding:22px 24px 16px;border-bottom:1px solid var(--divider)}.auth input{width:100%;font-size:14px;padding:10px;border:1px solid var(--border);border-radius:5px;margin-bottom:12px;background:#fff}
.auth input:focus{outline:none;border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring)}
.auth .err{color:var(--red);font-size:12px;margin-bottom:10px;min-height:16px}.auth .alt{font-size:12.5px;color:var(--ink-soft);margin-top:14px;text-align:center}.auth .alt a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}</style>
</head><body><div class="page"><div class="auth">
<h2 data-i18n="a_login_title">登录</h2><div class="err" id="err"></div>
<input id="u" data-i18n-ph="a_username_ph" placeholder="用户名" autocomplete="username">
<input id="p" type="password" data-i18n-ph="a_password_ph" placeholder="密码" autocomplete="current-password">
<button class="btn primary" id="go" style="width:100%" data-i18n="a_login_btn">登录</button>
<div class="alt"><span data-i18n="a_no_account">没有账号？</span><a href="/register" data-i18n="a_register_link">用激活码注册</a> · <a href="#" id="langSw"></a></div>
</div></div>
<script type="module">
import { t, applyI18n, toggleLang, langButtonLabel } from "/shared/i18n.js";
applyI18n();
const sw=document.getElementById("langSw"); sw.textContent=langButtonLabel();
sw.addEventListener("click",(e)=>{e.preventDefault();toggleLang();});
const err=document.getElementById("err");
async function gotoMyBoard(replace){
  try{
    const r=await fetch("/api/me");
    if(!r.ok) return false;
    const me=await r.json();
    if(!me.board||!me.board.slug) return false;
    const url="/b/"+me.board.slug;
    if(replace) location.replace(url); else location.href=url;
    return true;
  }catch{ return false; }
}
async function login(){ err.textContent="";
  const go=document.getElementById("go"); go.disabled=true;
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("p").value})});
    if(r.ok){ if(await gotoMyBoard(false)) return; err.textContent=t("a_board_fail"); }
    else err.textContent=(await r.json().catch(()=>({}))).error||t("a_login_fail");
  }catch{ err.textContent=t("a_net_err"); }
  finally{ go.disabled=false; }
}
document.getElementById("go").addEventListener("click",login);
document.getElementById("p").addEventListener("keydown",(e)=>{if(e.key==="Enter")login();});
// 已登录就直接进自己的看板
gotoMyBoard(true);
</script></body></html>
