<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>登录 · 估值钟摆</title>
<link rel="stylesheet" href="/shared/styles.css">
</head><body><div class="page"><div class="page-corner" id="corner"></div><div class="auth">
<a class="auth-brand" href="/"><b>Value</b>Port</a>
<h2 data-i18n="a_login_title">登录</h2><div class="err" id="err"></div>
<input id="u" data-i18n-ph="a_username_ph" placeholder="用户名" autocomplete="username">
<input id="p" type="password" data-i18n-ph="a_password_ph" placeholder="密码" autocomplete="current-password">
<button class="btn primary" id="go" style="width:100%" data-i18n="a_login_btn">登录</button>
<div class="alt"><span data-i18n="a_no_account">没有账号？</span><a href="/register" data-i18n="a_register_link">用激活码注册</a></div>
</div></div>
<script type="module">
import { t, applyI18n } from "/shared/i18n.js";
import { mountLangMenu } from "/shared/langmenu.js";
applyI18n();
mountLangMenu(document.getElementById("corner"));
const err=document.getElementById("err");
async function gotoMyBoard(replace){
  try{
    const r=await fetch("/api/me");
    if(!r.ok) return false;
    const me=await r.json();
    if(!me.board||!me.board.slug) return false;
    const url="/portfolio"; // 登录后先到资产（Portfolio）首页
    if(replace) location.replace(url); else location.href=url;
    return true;
  }catch{ return false; }
}
async function login(){ err.textContent="";
  const go=document.getElementById("go"); go.disabled=true;
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("p").value})});
    if(r.ok){ try{sessionStorage.clear();}catch(e){} /* 换了身份：清掉上个账号的会话缓存 */ if(await gotoMyBoard(false)) return; err.textContent=t("a_board_fail"); }
    else err.textContent=(await r.json().catch(()=>({}))).error||t("a_login_fail");
  }catch{ err.textContent=t("a_net_err"); }
  finally{ go.disabled=false; }
}
document.getElementById("go").addEventListener("click",login);
document.getElementById("p").addEventListener("keydown",(e)=>{if(e.key==="Enter")login();});
// 已登录就直接进自己的看板
gotoMyBoard(true);
</script></body></html>
