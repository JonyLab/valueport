<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的看板 · 配置</title>
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* ===== shadcn(zinc)-flavored theme — 仅作用于本页（加载在 shared/styles.css 之后） ===== */
  :root{
    --bg:#fafafa;            /* zinc-50 页面底 */
    --card:#ffffff;
    --ink:#09090b;           /* zinc-950 前景 */
    --ink-soft:#52525b;      /* zinc-600 次级 */
    --ink-mute:#71717a;      /* zinc-500 muted-foreground */
    --border:#e4e4e7;        /* zinc-200 边框 */
    --accent:#f4f4f5;        /* zinc-100 hover/底纹 */
    --ring:rgba(161,161,170,.4);  /* zinc-400/40 focus ring */
    --ring-border:#a1a1aa;
    --divider:#e4e4e7;
    --track:#f0f0f1;--track-edge:#e4e4e7;
    --shadow:0 1px 2px rgba(0,0,0,.05);   /* shadow-sm */
  }
  body{padding:32px 24px 64px}
  .hidden{display:none}

  /* 头部 */
  h1{font-size:24px;letter-spacing:-.02em}
  .eyebrow{letter-spacing:.08em}
  .sub{font-size:14px;color:var(--ink-mute)}

  /* 卡片：边框替代重阴影 */
  .charts,.config{border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .config{padding:0 18px 18px}
  .config-title{letter-spacing:.08em}

  /* Figma 式右侧固定检查器面板（桌面端） */
  @media (min-width:881px){
    body{padding-right:412px}
    .layout{display:block}
    .charts{max-width:920px;margin:0 auto}
    .config{position:fixed;top:0;right:0;bottom:0;width:388px;max-height:none;
      border:0;border-left:1px solid var(--border);border-radius:0;box-shadow:none;z-index:40}
  }
  @media (max-width:880px){
    .config{overflow:visible}   /* 移动端不做内滚，吸顶相对窗口生效 */
    .config-sticky{border-radius:14px 14px 0 0}
  }
  /* 吸顶：面板头 + tabs（负边距铺满面板内宽，盖住滚动内容） */
  .config-sticky{position:sticky;top:0;z-index:10;background:var(--card);
    margin:0 -18px 6px;padding:14px 18px 10px;border-bottom:1px solid var(--border)}
  .config-sticky .config-head{margin-bottom:0}
  .config-sticky .tabs{margin:10px 0 0}

  /* 按钮（h-9 / rounded-md / outline & primary） */
  .btn{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;
    border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);
    font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s,box-shadow .15s}
  .btn:hover{background:var(--accent);border-color:var(--border)}
  .btn:active{transform:none}
  .btn:focus-visible{outline:none;border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:#27272a}
  /* 列表末尾的「添加图表」：整行虚线按钮 */
  .btn.add{width:100%;justify-content:center;margin-top:14px;border-style:dashed;color:var(--ink-soft)}
  .btn.add:hover{background:var(--accent);border-style:dashed;color:var(--ink)}
  .btn-del{font-size:12.5px;border-radius:6px;padding:4px 8px}
  .btn-del:hover{color:#dc2626;background:#fef2f2}

  /* 表单（统一 36px 高、灰 ring 焦点态） */
  .field{gap:6px}
  .cfg-grid{gap:12px}
  .f-lab{font-size:12.5px;font-weight:500;color:#3f3f46}
  .field input,.field textarea{
    height:36px;font-size:14px;font-weight:500;color:var(--ink);
    border:1px solid var(--border);border-radius:8px;padding:0 12px;width:100%;
    background:#fff;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.03);
    transition:border-color .15s,box-shadow .15s}
  .field textarea{height:auto;min-height:76px;padding:8px 12px;resize:vertical;line-height:1.55;font-family:var(--font);font-size:13.5px}
  .field input:focus,.field textarea:focus{border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring);background:#fff}
  .field input.bad,.field textarea.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,60,60,.12)}
  .field input.ok{border-color:#86c8a0;box-shadow:none;background:#fff}
  .cfg-block.site .field input{font-family:var(--font)}

  /* 分类 tabs（shadcn Tabs：muted 底槽 + 选中白底浮起） */
  .tabs{display:flex;gap:2px;background:var(--accent);border-radius:10px;padding:3px;margin:12px 0 6px}
  .tab{flex:1;height:32px;border:0;background:transparent;border-radius:7px;cursor:pointer;
    font-family:var(--font);font-size:13px;font-weight:500;color:var(--ink-mute);
    transition:background .15s,color .15s,box-shadow .15s}
  .tab:hover{color:var(--ink)}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.03)}
  .tab:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
  .tab-pane>.cfg-block:first-child{padding-top:12px}

  /* 区块分隔与标题 */
  .cfg-block{padding:18px 0 16px;border-bottom:1px solid var(--border)}
  .cfg-name{font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:0}
  .save-state{font-size:12px;color:var(--ink-mute);font-family:var(--font);margin-left:8px}
  .save-state.ok{color:var(--green)} .save-state.err{color:var(--red)}
  .quote-note{font-size:12px;color:var(--ink-mute)}
  .quote-note code{background:var(--accent);border:1px solid var(--border);border-radius:5px;padding:1px 5px}

  /* 预设 chips → 徽章式开关 */
  .chip{font-family:var(--font);font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;
    border:1px solid var(--border);background:#fff;color:var(--ink-soft)}
  .chip:hover{background:var(--accent);border-color:var(--border)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip:focus-visible{outline:none;border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring)}

  /* 联想下拉 → popover */
  .combo-list{border:1px solid var(--border);border-radius:10px;padding:4px;
    box-shadow:0 4px 16px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05)}
  .combo-opt{border-radius:6px;padding:8px 10px;font-size:13px}
  .combo-opt:hover,.combo-opt.act{background:var(--accent)}
  .combo-opt .c-mkt{background:var(--accent);border:1px solid var(--border);color:var(--ink-mute)}

  /* 色块配色行 */
  .color-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--accent)}
  .color-row:first-child{border-top:none}
  .color-row .c-lab{flex:1;font-size:13px;color:var(--ink-soft)}
  .color-row input[type=color]{width:36px;height:32px;padding:2px;border:1px solid var(--border);
    border-radius:8px;background:#fff;cursor:pointer}
  .color-row input[type=text]{width:96px;height:32px;font-family:var(--mono);font-size:12.5px;font-weight:500;
    border:1px solid var(--border);border-radius:8px;padding:0 9px;background:#fff;outline:none;
    transition:border-color .15s,box-shadow .15s}
  .color-row input[type=text]:focus{border-color:var(--ring-border);box-shadow:0 0 0 3px var(--ring)}
  .color-row input[type=text].bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,60,60,.12)}
</style>
</head>
<body>
<div class="page">
  <!-- 配置主体 -->
  <div id="app" class="hidden">
    <div class="page-head">
      <p class="eyebrow">我的看板 · 配置</p>
      <h1>估值钟摆 · 我的配置</h1>
      <p class="sub">在此增删改标的与估值参数，保存后公开页即时生效。</p>
    </div>
    <div class="layout">
      <div class="charts" id="charts"></div>
      <div class="config">
        <!-- 吸顶：面板头 + 分类 tabs -->
        <div class="config-sticky">
          <div class="config-head">
            <span class="config-title">配置</span>
            <button class="btn" id="btnLogout">退出</button>
          </div>
          <div class="tabs" role="tablist" aria-label="配置分类">
            <button class="tab on" role="tab" aria-selected="true" data-pane="paneItems">标的</button>
            <button class="tab" role="tab" aria-selected="false" data-pane="panePage">页面</button>
            <button class="tab" role="tab" aria-selected="false" data-pane="paneBoard">看板</button>
          </div>
        </div>

        <!-- 标的 -->
        <div id="paneItems" class="tab-pane" role="tabpanel">
          <div class="quote-bar">
            <button class="btn" id="btnRefresh">↻ 立即刷新</button>
            <span class="quote-status" id="quoteStatus"></span>
          </div>
          <p class="quote-note">现价由腾讯公开行情接口经服务端代理获取（延时）。代码框支持 <code>代码 / 名称 / 拼音</code> 联想，<b>必须从下拉中选择</b>以锁定精确标的。改动会自动保存。</p>
          <div id="cfgList"></div>
          <button class="btn add" id="btnAdd">＋ 添加图表</button>
        </div>

        <!-- 页面：文案 + 配色 -->
        <div id="panePage" class="tab-pane hidden" role="tabpanel">
          <div class="cfg-block site">
            <div class="cfg-top">
              <span class="cfg-name">页面文案</span>
              <span class="save-state" id="setSave"></span>
            </div>
            <div class="cfg-grid">
              <label class="field full"><span class="f-lab">小标题</span>
                <input id="setEyebrow" type="text" autocomplete="off" placeholder="市场情绪 · Valuation Pendulum"></label>
              <label class="field full"><span class="f-lab">大标题</span>
                <input id="setTitle" type="text" autocomplete="off" placeholder="估值钟摆看板"></label>
              <label class="field full"><span class="f-lab">说明</span>
                <textarea id="setSubtitle" placeholder="每只标的一只钟摆：指针落位由现价与设定的合理价值区间、安全边际共同决定。市场在两端摆动，钟摆终将回归中点。"></textarea></label>
            </div>
            <p class="quote-note">留空即使用默认文案。改动自动保存，公开页即时生效。</p>
          </div>
          <div class="cfg-block site">
            <div class="cfg-top">
              <span class="cfg-name">色块配色</span>
              <span class="save-state" id="colSave"></span>
            </div>
            <div id="colorRows"></div>
            <p class="quote-note">各估值区间的高亮色。用取色器或直接填 <code>#rrggbb</code>，改动自动保存、实时预览；清空恢复默认。</p>
          </div>
        </div>

        <!-- 看板 -->
        <div id="paneBoard" class="tab-pane hidden" role="tabpanel">
          <div class="cfg-block site" id="boardBlock">
            <div class="cfg-top">
              <span class="cfg-name">看板设置</span>
              <span class="save-state" id="boardSave"></span>
            </div>
            <div class="cfg-grid">
              <label class="field full"><span class="f-lab">看板名称</span>
                <input id="boardName" type="text" autocomplete="off" placeholder="我的估值看板"></label>
              <label class="field full"><span class="f-lab">公开地址 Slug</span>
                <input id="boardSlug" type="text" autocomplete="off" maxlength="32" placeholder="my-board" spellcheck="false"></label>
            </div>
            <p class="quote-note">公开地址：<a id="boardLink" href="#" target="_blank">/b/…</a> — 改动自动保存（600ms 防抖）。Slug 仅限小写字母、数字和连字符，3–32 位。</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { Gauge } from "/shared/gauge.js";
import { verdictOf, structValid, applyZoneColors, ZONES, DEFAULT_ZONE_COLORS } from "/shared/core.js";
import { MKT_LABEL } from "/shared/market.js";

const REDUCE = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
const chartsEl = document.getElementById("charts");
const cfgList = document.getElementById("cfgList");
const items = []; // {id, cfg, gauge, chartEl, cfgEl, verdictEl, live, gotQuote, saveEl}
let quoteTimer = null;

/* ---------- 启动：/api/me 鉴权 ---------- */
async function init() {
  let me;
  try {
    const res = await fetch("/api/me");
    if (res.status === 401) { location.href = "/login"; return; }
    me = await res.json();
  } catch {
    location.href = "/login";
    return;
  }
  document.getElementById("app").classList.remove("hidden");
  // 初始化看板设置输入框
  const board = me.board || {};
  document.getElementById("boardName").value = board.name || "";
  document.getElementById("boardSlug").value = board.slug || "";
  updateBoardLink(board.slug || "");

  // 加载列表 + 设置
  let rows;
  try {
    const res = await fetch("/api/my/items");
    if (!res.ok) { location.href = "/login"; return; }
    rows = (await res.json()).items || [];
  } catch {
    location.href = "/login";
    return;
  }
  rows.forEach((r) => addItem({ ...r, price: 0 }));
  loadSettings();
  fetchQuotes();
  if (!quoteTimer) quoteTimer = setInterval(fetchQuotes, 60000);
}

/* ---------- 看板设置（自动保存） ---------- */
const boardNameEl = document.getElementById("boardName");
const boardSlugEl = document.getElementById("boardSlug");
const boardSaveEl = document.getElementById("boardSave");
const boardLinkEl = document.getElementById("boardLink");
const SLUG_RE = /^[a-z0-9-]{3,32}$/;
let boardTimer = null;

function updateBoardLink(slug) {
  if (slug && SLUG_RE.test(slug)) {
    boardLinkEl.href = "/b/" + slug;
    boardLinkEl.textContent = "/b/" + slug;
  } else {
    boardLinkEl.href = "#";
    boardLinkEl.textContent = "/b/…";
  }
}

async function saveBoard() {
  const name = boardNameEl.value.trim();
  const slug = boardSlugEl.value.trim();
  if (!SLUG_RE.test(slug)) return; // client-side guard; bad input stays marked
  boardSaveEl.className = "save-state"; boardSaveEl.textContent = "保存中…";
  try {
    const res = await fetch("/api/my/board", {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, slug }),
    });
    if (res.ok) {
      boardSaveEl.className = "save-state ok"; boardSaveEl.textContent = "已保存";
      updateBoardLink(slug);
    } else {
      let errMsg = "保存失败";
      try { const b = await res.json(); if (b.error) errMsg = b.error; } catch { /* ignore */ }
      boardSaveEl.className = "save-state err"; boardSaveEl.textContent = errMsg;
    }
  } catch { boardSaveEl.className = "save-state err"; boardSaveEl.textContent = "保存失败"; }
}

boardSlugEl.addEventListener("input", () => {
  const v = boardSlugEl.value.trim();
  if (v === "" || SLUG_RE.test(v)) {
    boardSlugEl.classList.remove("bad");
  } else {
    boardSlugEl.classList.add("bad");
  }
  updateBoardLink(v);
  if (SLUG_RE.test(v)) {
    clearTimeout(boardTimer);
    boardTimer = setTimeout(saveBoard, 600);
  }
});
boardNameEl.addEventListener("input", () => {
  clearTimeout(boardTimer);
  boardTimer = setTimeout(saveBoard, 600);
});

/* ---------- 页面文案（自动保存） ---------- */
const setEyebrow = document.getElementById("setEyebrow");
const setTitle = document.getElementById("setTitle");
const setSubtitle = document.getElementById("setSubtitle");
const setSaveEl = document.getElementById("setSave");
let setTimer = null;
async function loadSettings() {
  let s = {};
  try {
    const res = await fetch("/api/my/settings");
    if (res.ok) s = (await res.json()).settings || {};
  } catch { /* 保持空，占位符显示默认 */ }
  setEyebrow.value = s.eyebrow || "";
  setTitle.value = s.title || "";
  setSubtitle.value = s.subtitle || "";
  colorState = {};
  for (const k of ZONE_KEYS) if (s["color_" + k]) colorState[k] = s["color_" + k];
  applyZoneColors(currentColorMap());
  buildColorRows();
  items.forEach((i) => i.gauge.repaint());
}
async function saveSettings() {
  setSaveEl.className = "save-state"; setSaveEl.textContent = "保存中…";
  try {
    const res = await fetch("/api/my/settings", {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ eyebrow: setEyebrow.value, title: setTitle.value, subtitle: setSubtitle.value }),
    });
    if (res.ok) { setSaveEl.className = "save-state ok"; setSaveEl.textContent = "已保存"; }
    else { setSaveEl.className = "save-state err"; setSaveEl.textContent = "保存失败"; }
  } catch { setSaveEl.className = "save-state err"; setSaveEl.textContent = "保存失败"; }
}
[setEyebrow, setTitle, setSubtitle].forEach((el) =>
  el.addEventListener("input", () => { clearTimeout(setTimer); setTimer = setTimeout(saveSettings, 600); }));

/* ---------- 色块配色（自动保存 + 实时预览） ---------- */
const ZONE_KEYS = ZONES.map((z) => z.key);
const ZONE_LABELS = { deep: "深度低估", under: "低估", fair: "合理", over: "高估", xover: "极度高估" };
const colSaveEl = document.getElementById("colSave");
const HEX_RE = /^#[0-9a-fA-F]{6}$/;
let colorState = {}; // 仅存自定义的区间色；缺省即用默认
let colTimer = null;

function currentColorMap() {
  const m = {};
  for (const k of ZONE_KEYS) if (colorState[k]) m[k] = colorState[k];
  return m;
}
function buildColorRows() {
  const wrap = document.getElementById("colorRows");
  wrap.innerHTML = "";
  ZONES.forEach((z) => {
    const cur = colorState[z.key] || DEFAULT_ZONE_COLORS[z.key];
    const row = document.createElement("div");
    row.className = "color-row";
    const lab = document.createElement("span");
    lab.className = "c-lab";
    lab.textContent = `${ZONE_LABELS[z.key] || z.key} · ${z.en}`;
    const picker = document.createElement("input");
    picker.type = "color"; picker.value = cur;
    const hex = document.createElement("input");
    hex.type = "text"; hex.maxLength = 7; hex.spellcheck = false; hex.autocomplete = "off";
    hex.value = cur; hex.placeholder = DEFAULT_ZONE_COLORS[z.key];
    picker.addEventListener("input", () => { hex.value = picker.value; hex.classList.remove("bad"); onColorChange(z.key, picker.value); });
    hex.addEventListener("input", () => {
      const v = hex.value.trim();
      if (HEX_RE.test(v)) { hex.classList.remove("bad"); picker.value = v; onColorChange(z.key, v); }
      else if (v === "") { hex.classList.remove("bad"); onColorChange(z.key, ""); } // 清空→默认
      else hex.classList.add("bad");
    });
    row.append(lab, picker, hex);
    wrap.appendChild(row);
  });
}
function onColorChange(key, value) {
  if (value) colorState[key] = value; else delete colorState[key];
  applyZoneColors(currentColorMap());
  items.forEach((i) => i.gauge.repaint());
  clearTimeout(colTimer);
  colTimer = setTimeout(saveColors, 600);
}
async function saveColors() {
  colSaveEl.className = "save-state"; colSaveEl.textContent = "保存中…";
  const payload = {};
  for (const k of ZONE_KEYS) payload["color_" + k] = colorState[k] || ""; // 空串→后端删除→默认
  try {
    const res = await fetch("/api/my/settings", {
      method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(payload),
    });
    colSaveEl.className = res.ok ? "save-state ok" : "save-state err";
    colSaveEl.textContent = res.ok ? "已保存" : "保存失败";
  } catch { colSaveEl.className = "save-state err"; colSaveEl.textContent = "保存失败"; }
}

document.getElementById("btnLogout").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login";
});

/* ---------- 分类 tabs 切换 ---------- */
document.querySelectorAll(".tab").forEach((t) =>
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => {
      x.classList.toggle("on", x === t);
      x.setAttribute("aria-selected", x === t ? "true" : "false");
    });
    document.querySelectorAll(".tab-pane").forEach((p) => p.classList.toggle("hidden", p.id !== t.dataset.pane));
    document.querySelector(".config").scrollTop = 0;
  }));

/* ---------- 保存（防抖） ---------- */
function setSave(item, state, text) {
  if (!item.saveEl) return;
  item.saveEl.className = "save-state " + (state || "");
  item.saveEl.textContent = text || "";
}
async function saveItem(item) {
  if (!item.cfg.symbol || !structValid(item.cfg)) return;
  if (item._saving) { item._pendingSave = true; return; } // a POST/PUT is in flight — coalesce, replay after it resolves
  item._saving = true;
  setSave(item, "", "保存中…");
  const payload = {
    ticker: item.cfg.ticker, name: item.cfg.name, symbol: item.cfg.symbol,
    fairLow: item.cfg.fairLow, fairHigh: item.cfg.fairHigh, mos: item.cfg.mos, ext: item.cfg.ext,
    sortOrder: item.cfg.sortOrder || 0,
  };
  const url = item.id ? `/api/my/items/${item.id}` : "/api/my/items";
  const method = item.id ? "PUT" : "POST";
  try {
    const res = await fetch(url, { method, headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
    if (res.ok) {
      const body = await res.json();
      if (!item.id && body.id) item.id = body.id;
      setSave(item, "ok", "已保存");
    } else {
      setSave(item, "err", "保存失败");
    }
  } catch {
    setSave(item, "err", "保存失败");
  } finally {
    item._saving = false;
    if (item._pendingSave) { item._pendingSave = false; saveItem(item); } // replay latest edit (now a PUT, id is known)
  }
}
function debounceSave(item) {
  clearTimeout(item._saveT);
  item._saveT = setTimeout(() => saveItem(item), 600);
}

/* ---------- 图表侧 ---------- */
function renderVerdict(item) {
  const v = verdictOf(item.cfg);
  const el = item.verdictEl;
  el.className = "verdict " + v.cls;
  el.innerHTML = "";
  const px = document.createElement("span");
  px.className = "px" + (item.live ? " px-live" : "");
  px.textContent = v.px;
  el.appendChild(px);
  el.appendChild(document.createTextNode(v.text));
}
function addChartDom(item) {
  const wrap = document.createElement("div");
  wrap.className = "chart-item";
  const gauge = new Gauge(wrap);
  const verdict = document.createElement("p");
  verdict.className = "verdict v-fair";
  wrap.appendChild(verdict);
  chartsEl.appendChild(wrap);
  item.gauge = gauge; item.chartEl = wrap; item.verdictEl = verdict;
  gauge.set(item.cfg, false);
  renderVerdict(item);
}

/* ---------- 代码联想（走 /api/hints） ---------- */
let hintSeq = 0;
async function loadHints(q) {
  const seq = ++hintSeq;
  try {
    const res = await fetch("/api/hints?q=" + encodeURIComponent(q));
    const { hints } = await res.json();
    return seq === hintSeq ? hints : null;
  } catch { return []; }
}

/* ---------- 配置侧 ---------- */
const FIELDS = [
  { k: "ticker", lab: "标的代码", type: "text" },
  { k: "fairLow", lab: "合理 · 低点", type: "number" },
  { k: "fairHigh", lab: "合理 · 高点", type: "number" },
  { k: "mos", lab: "安全边际 %", type: "number", presets: [10, 20, 30, 40, 50] },
  { k: "ext", lab: "极度高估 %", type: "number", presets: [10, 20, 30, 40, 50] },
];

function addCfgDom(item) {
  const block = document.createElement("div");
  block.className = "cfg-block";
  const top = document.createElement("div");
  top.className = "cfg-top";
  const name = document.createElement("span");
  name.className = "cfg-name";
  name.textContent = item.cfg.name ? `${(item.cfg.ticker || "—").toUpperCase()} · ${item.cfg.name}` : (item.cfg.ticker || "—").toUpperCase();
  const saveEl = document.createElement("span");
  saveEl.className = "save-state";
  item.saveEl = saveEl;
  const del = document.createElement("button");
  del.className = "btn-del"; del.textContent = "移除";
  del.addEventListener("click", () => removeItem(item));
  const topRight = document.createElement("span");
  topRight.append(saveEl, del);
  top.append(name, topRight);

  const grid = document.createElement("div");
  grid.className = "cfg-grid";
  FIELDS.forEach((f) => {
    const lab = document.createElement("label");
    lab.className = "field" + (f.k === "ticker" ? " full" : "");
    const span = document.createElement("span");
    span.className = "f-lab"; span.textContent = f.lab;
    const input = document.createElement("input");
    input.type = f.type;
    if (f.type === "number") { input.min = "0"; input.step = "any"; }
    else { input.maxLength = 24; input.spellcheck = false; input.placeholder = "代码 / 名称 / 拼音"; input.autocomplete = "off"; }
    input.value = item.cfg[f.k] ?? "";

    input.addEventListener("input", () => {
      const v = f.type === "number" ? parseFloat(input.value) : input.value.trim();
      const next = { ...item.cfg, [f.k]: v };
      let bad = false;
      if (f.k === "fairLow") bad = !(v > 0);
      if (f.k === "fairHigh") bad = !(v > next.fairLow);
      if (f.k === "mos") bad = !(v > 0 && v < 100);
      if (f.k === "ext") bad = !(v > 0);
      input.classList.toggle("bad", bad && input.value !== "");
      item.cfg = next;
      if (f.k === "ticker") {
        name.textContent = (v || "—").toUpperCase();
        item.live = false; item.gotQuote = false;
        item.cfg = { ...item.cfg, price: 0, symbol: null, name: "" };
        input.classList.remove("ok", "bad");
        renderVerdict(item);
        item.gauge.set(item.cfg);
      }
      if (structValid(item.cfg)) {
        item.gauge.set(item.cfg);
        renderVerdict(item);
        debounceSave(item);
      }
    });

    if (f.k === "ticker") {
      const combo = document.createElement("div");
      combo.className = "combo";
      const list = document.createElement("div");
      list.className = "combo-list"; list.style.display = "none";
      const err = document.createElement("div");
      err.className = "f-err"; err.textContent = "请从下拉中选择标的";
      let opts = [], act = -1, searchTimer = null;
      const close = () => { list.style.display = "none"; act = -1; };
      const markState = () => {
        const txt = input.value.trim();
        if (item.cfg.symbol) { input.classList.add("ok"); input.classList.remove("bad"); err.style.display = "none"; }
        else if (txt) { input.classList.add("bad"); input.classList.remove("ok"); err.style.display = ""; }
        else { input.classList.remove("ok", "bad"); err.style.display = "none"; }
      };
      const pick = (o) => {
        input.value = o.code;
        item.cfg = { ...item.cfg, ticker: o.code, name: o.name, symbol: o.symbol, price: 0 };
        item.live = false; item.gotQuote = false;
        name.textContent = `${o.code} · ${o.name}`;
        if (structValid(item.cfg)) { item.gauge.set(item.cfg); renderVerdict(item); saveItem(item); }
        close(); markState(); fetchQuotes();
      };
      const renderList = (arr) => {
        opts = arr; act = -1; list.innerHTML = "";
        if (!arr.length) { close(); return; }
        arr.forEach((o) => {
          const d = document.createElement("div");
          d.className = "combo-opt";
          d.innerHTML = `<span class="c-code"></span><span class="c-name"></span><span class="c-mkt"></span>`;
          d.children[0].textContent = o.code;
          d.children[1].textContent = o.name;
          d.children[2].textContent = MKT_LABEL[o.mkt];
          d.addEventListener("mousedown", (e) => { e.preventDefault(); pick(o); });
          list.appendChild(d);
        });
        list.style.display = "";
      };
      const highlight = () => {
        [...list.children].forEach((d, i) => d.classList.toggle("act", i === act));
        if (act >= 0) list.children[act].scrollIntoView({ block: "nearest" });
      };
      input.addEventListener("input", () => {
        const q = input.value.trim();
        clearTimeout(searchTimer);
        if (q.length < 1) { close(); return; }
        searchTimer = setTimeout(async () => {
          const arr = await loadHints(q);
          if (arr !== null) renderList(arr);
        }, 250);
      });
      input.addEventListener("keydown", (e) => {
        if (list.style.display === "none") return;
        if (e.key === "ArrowDown") { e.preventDefault(); act = Math.min(opts.length - 1, act + 1); highlight(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(0, act - 1); highlight(); }
        else if (e.key === "Enter") { e.preventDefault(); if (act >= 0) pick(opts[act]); else if (opts.length) pick(opts[0]); }
        else if (e.key === "Escape") { close(); }
      });
      input.addEventListener("blur", () => { setTimeout(() => { close(); markState(); }, 150); });
      combo.append(input, list);
      lab.append(span, combo, err);
      grid.appendChild(lab);
      if (item.cfg.symbol) input.classList.add("ok");
      return;
    }

    lab.append(span, input);
    if (f.presets) {
      const chips = document.createElement("div");
      chips.className = "chips";
      const chipEls = f.presets.map((p) => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "chip"; c.textContent = p + "%";
        c.addEventListener("click", () => { input.value = p; input.dispatchEvent(new Event("input", { bubbles: true })); });
        chips.appendChild(c);
        return { el: c, val: p };
      });
      const syncChips = () => { const v = parseFloat(input.value); chipEls.forEach(({ el, val }) => el.classList.toggle("on", v === val)); };
      input.addEventListener("input", syncChips);
      syncChips();
      lab.appendChild(chips);
    }
    grid.appendChild(lab);
  });

  block.addEventListener("click", (e) => {
    if (e.target.closest("input,button")) return;
    item.chartEl.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "center" });
  });
  block.append(top, grid);
  cfgList.appendChild(block);
  item.cfgEl = block;
}

/* ---------- 增/删 ---------- */
function addItem(cfg) {
  const item = { id: cfg.id || null, cfg: { ...cfg }, live: false, gotQuote: false };
  items.push(item);
  addChartDom(item);
  addCfgDom(item);
  return item;
}
async function removeItem(item) {
  if (item.id) await fetch(`/api/my/items/${item.id}`, { method: "DELETE" });
  const idx = items.indexOf(item);
  if (idx >= 0) { item.gauge.destroy(); item.chartEl.remove(); item.cfgEl.remove(); items.splice(idx, 1); }
}
document.getElementById("btnAdd").addEventListener("click", () => {
  const it = addItem({ ticker: "", name: "", symbol: null, price: 0, fairLow: 215, fairHigh: 265, mos: 20, ext: 25, sortOrder: items.length });
  it.cfgEl.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "nearest" });
  const first = it.cfgEl.querySelector("input");
  first && first.focus();
});

/* ---------- 行情 ---------- */
const statusEl = document.getElementById("quoteStatus");
async function fetchQuotes() {
  const map = items.filter((i) => i.cfg.symbol);
  if (!map.length) { statusEl.textContent = "请先从下拉选择标的"; return; }
  statusEl.classList.remove("err"); statusEl.textContent = "获取中…";
  const symbols = [...new Set(map.map((i) => i.cfg.symbol))];
  let data;
  try {
    const res = await fetch("/api/quotes?symbols=" + encodeURIComponent(symbols.join(",")));
    data = await res.json();
  } catch { statusEl.textContent = "接口不可达"; statusEl.classList.add("err"); return; }
  const quotes = data.quotes || {};
  let ok = 0;
  map.forEach((item) => {
    const p = quotes[item.cfg.symbol];
    if (!(p > 0)) return;
    ok++;
    item.cfg = { ...item.cfg, price: p }; item.live = true;
    if (structValid(item.cfg)) {
      const first = !item.gotQuote; item.gotQuote = true;
      item.gauge.set(item.cfg, !first);
      if (first) item.gauge.swingIn();
      renderVerdict(item);
    }
  });
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, "0"), mm = String(t.getMinutes()).padStart(2, "0"), ss = String(t.getSeconds()).padStart(2, "0");
  statusEl.textContent = ok > 0 ? `已更新 ${ok}/${map.length} · ${hh}:${mm}:${ss}` : "未取到报价";
  statusEl.classList.toggle("err", ok === 0);
}
document.getElementById("btnRefresh").addEventListener("click", fetchQuotes);

/* ---------- 启动 ---------- */
init();
</script>
